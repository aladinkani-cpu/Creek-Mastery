  };

  // =====================================================
  // SETTINGS
  // =====================================================
  const LEGACY_KEY = "creekAcademy.flashcards.v2";          // old building progress – read for migration, never deleted
  const STORAGE_KEY = "creekAcademy.flashcards.v3";         // { version: 3, buildings, areaFacts, activeSection, settings }
  const BACKUP_KEY = "creekAcademy.flashcards.v2.backup";   // building backup (reset / import)
  const AREA_BACKUP_KEY = "creekAcademy.flashcards.v3.areaBackup";

  const MAX_LEARNING = 4;                 // max facts in learning before a new one is unlocked
  const LEARN_STEPS = [2, 3, 4];             // learning phase: cards until a fact comes back (strength 0 / 1 / 2)
  const REVIEW_DAYS = [0, 0, 0, 1, 3, 7, 14]; // once a fact sits: days until it comes back, by strength
  const MAX_BOX = 6;
  const SITS_BOX = 3;                     // "sits": right 3 times in a row – the 3rd time typed from memory where possible
  const MASTERED_BOX = 4;                 // "mastered": still known on a later day
  const TYPE_BOX = 2;                     // from this strength on, you type the answer yourself (if it is a number)
  const TEST_PASS = 0.9;                  // level test: share of correct answers needed to unlock the next level
  const ROUND_SIZE = 15;                  // cards per round
  const BONUS_EVERY = 5;                  // a compare / reverse bonus question every N questions (Buildings)
  const WEAK_DAYS = 14;                   // "weak spot" = answered wrong within the last N days
  const AUTO_ADVANCE_MS = 1200;
  const DAY = 24 * 60 * 60 * 1000;
  const MONTHS = {
    january: 1, february: 2, march: 3, april: 4, may: 5, june: 6,
    july: 7, august: 8, september: 9, october: 10, november: 11, december: 12
  };

  // =====================================================
  // VALUE HELPERS
  // =====================================================
  function numbersIn(text) { return (String(text).match(/\d+/g) || []).map(Number); }
  function floorsValue(text) { const n = numbersIn(text); return n.length ? Math.max(...n) : null; }
  function unitsValue(text) { const n = numbersIn(text); return n.length ? n[0] : null; }
  function completionValue(text) {
    const m = String(text).toLowerCase().match(/([a-z]+)\s+(\d{4})/);
    if (!m || !MONTHS[m[1]]) return null;
    return Number(m[2]) * 12 + MONTHS[m[1]];
  }
  const VALUE_FN = { floors: floorsValue, completion: completionValue, units: unitsValue };
  function valueOf(field, text) { return VALUE_FN[field] ? VALUE_FN[field](text) : null; }
  function hasValue(b, field) { return b[field] !== undefined && String(b[field]).trim() !== ""; }
  function completionYear(text) { const m = String(text).match(/\d{4}/); return m ? m[0] : null; }

  function levelForField(field) { return LEVELS.find(l => l.field === field); }
  function answerOf(b, field) {
    const lv = levelForField(field);
    return lv && lv.answer ? lv.answer(b) : b[field];
  }
  function numericAnswer(field, text) {
    const lv = levelForField(field);
    if (lv && lv.answer) { const n = Number(text); return isNaN(n) ? null : n; }
    return valueOf(field, text);
  }

  function shuffle(list) {
    const arr = list.slice();
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function esc(text) {
    return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function digitsOnly(text) { return String(text).replace(/\D/g, ""); }
  // "500,000" → "500000", "4.5" → "4.5", "4,5" → "4.5" (comma as decimal mark), "abc" → ""
  function normalizeNumber(text) {
    let t = String(text).trim().replace(/\s/g, "");
    if (/^\d{1,3}([,.]\d{3})+$/.test(t)) t = t.replace(/[,.]/g, ""); // thousands separators (500,000 or 500.000)
    else t = t.replace(",", ".");                                  // decimal comma
    t = t.replace(/[^\d.]/g, "");
    if (!/^\d+(\.\d+)?$/.test(t)) return "";
    return String(Number(t));
  }
  function startOfDay(t) { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); }
  function pick(list) { return list[Math.floor(Math.random() * list.length)]; }

  // =====================================================
  // STORAGE
  // =====================================================
  function freshProgress() {
    return { version: 2, reviewCount: 0, bestStreak: 0, currentLevel: 0, manualUnlock: {}, celebrated: {}, passed: {}, testOffered: {}, cards: {} };
  }

  function normalizeFact(f, fallbackSeen) {
    if (typeof f.seen !== "boolean") f.seen = !!fallbackSeen;
    if (typeof f.box !== "number") f.box = 0;
    if (typeof f.due !== "number") f.due = 0;
    if (typeof f.dueAt !== "number") f.dueAt = 0;          // older saves: reviews are due right away
    if (typeof f.wrongCount !== "number") f.wrongCount = 0;
    if (typeof f.lastWrongAt !== "number") f.lastWrongAt = 0;
    return f;
  }

  function normalize(p) {
    if (typeof p.reviewCount !== "number") p.reviewCount = 0;
    if (typeof p.bestStreak !== "number") p.bestStreak = 0;
    if (typeof p.currentLevel !== "number" || !LEVELS[p.currentLevel]) p.currentLevel = 0;
    if (!p.manualUnlock) p.manualUnlock = {};
    if (!p.celebrated) p.celebrated = {};
    if (!p.passed) p.passed = {};             // level test passed
    if (!p.testOffered) p.testOffered = {};
    if (!p.cards) p.cards = {};
    Object.values(p.cards).forEach(card => {
      if (!card.facts) card.facts = {};
      Object.values(card.facts).forEach(f => normalizeFact(f, card.seen));
    });
    return p;
  }

  function freshAreaProgress() {
    return { reviewCount: 0, bestStreak: 0, facts: {} };
  }

  function normalizeArea(a) {
    if (!a || typeof a !== "object") return freshAreaProgress();
    if (typeof a.reviewCount !== "number") a.reviewCount = 0;
    if (typeof a.bestStreak !== "number") a.bestStreak = 0;
    if (!a.facts || typeof a.facts !== "object") a.facts = {};
    Object.values(a.facts).forEach(f => normalizeFact(f, false));
    return a;
  }

  function normalizeSettings(s) {
    return {
      clientMode: !!(s && s.clientMode),
      rankIdx: s && typeof s.rankIdx === "number" ? s.rankIdx : -1   // last rank shown (for the rank-up moment)
    };
  }

  // Loads the v3 store. If only the old v2 building progress exists, it is migrated
  // into store.buildings (the old v2 entry is left untouched as a safety copy).
  function loadStore() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && parsed.version === 3) {
          return {
            buildings: parsed.buildings ? normalize(parsed.buildings) : freshProgress(),
            areaFacts: normalizeArea(parsed.areaFacts),
            activeSection: parsed.activeSection === "area" ? "area" : "buildings",
            settings: normalizeSettings(parsed.settings),
            migrated: false
          };
        }
      }
    } catch (e) { /* fall through to legacy */ }

    let buildingsProgress = freshProgress();
    let migrated = false;
    try {
      const legacyRaw = localStorage.getItem(LEGACY_KEY);
      if (legacyRaw) {
        const legacy = JSON.parse(legacyRaw);
        if (legacy && legacy.version === 2) {
          buildingsProgress = normalize(legacy);
          migrated = true;
        }
      }
    } catch (e) { /* keep fresh */ }
    return { buildings: buildingsProgress, areaFacts: freshAreaProgress(), activeSection: "buildings", settings: normalizeSettings(null), migrated };
  }

  function storeSnapshot() {
    return { version: 3, buildings: progress, areaFacts: areaProgress, activeSection, settings };
  }

  function saveProgress() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(storeSnapshot())); } catch (e) { /* session only */ }
  }

  function factState(id, field) {
    if (!progress.cards[id]) progress.cards[id] = { facts: {} };
    const card = progress.cards[id];
    if (!card.facts) card.facts = {};
    if (!card.facts[field]) card.facts[field] = normalizeFact({ box: 0, due: 0, seen: false }, false);
    return card.facts[field];
  }

  function areaState(id) {
    if (!areaProgress.facts[id]) areaProgress.facts[id] = normalizeFact({ box: 0, due: 0, seen: false }, false);
    return areaProgress.facts[id];
  }

  // =====================================================
  // STATE
  // =====================================================
  const initialStore = loadStore();
  let progress = initialStore.buildings;          // building progress
  let areaProgress = initialStore.areaFacts;      // area knowledge progress (separate pool)
  let activeSection = initialStore.activeSection; // "buildings" | "area"
  let settings = initialStore.settings;           // { clientMode }
  let filter = "all";                              // building area filter
  let areaFilter = "all";                          // area knowledge category filter
  let view = { kind: "empty" };
  let lastId = null;
  let advanceTimer = null;
  let toastTimer = null;
  let overlayActions = { primary: null, secondary: null };
  let lastRenderedView = null;
  const lastStats = { buildings: null, area: null };

  function newRound() { return { count: 0, answered: 0, correct: 0, intros: 0, sitsAtStart: null }; }
  function newSession() { return { answered: 0, correct: 0, streak: 0, sinceBonus: 0, bonusToggle: 0, round: newRound() }; }
  const sessions = { buildings: newSession(), area: newSession() };
  let session = sessions[activeSection];
  const weakMode = { buildings: false, area: false };
  let test = null; // running level test: { li, items, idx, correct, missed }
  const practiceAnyway = { buildings: false, area: false };

  const el = {
    filterSelect: document.getElementById("filterSelect"),
    subtitle: document.getElementById("subtitle"),
    tabs: document.getElementById("tabs"),
    levels: document.getElementById("levels"),
    statNew: document.getElementById("statNew"),
    statLearning: document.getElementById("statLearning"),
    statMastered: document.getElementById("statMastered"),
    statStreak: document.getElementById("statStreak"),
    toolbarInfo: document.getElementById("toolbarInfo"),
    weakBtn: document.getElementById("weakBtn"),
    testBtn: document.getElementById("testBtn"),
    clientBtn: document.getElementById("clientBtn"),
    card: document.getElementById("card"),
    sessionInfo: document.getElementById("sessionInfo"),
    skipBtn: document.getElementById("skipBtn"),
    resetBtn: document.getElementById("resetBtn"),
    undoResetBtn: document.getElementById("undoResetBtn"),
    exportBtn: document.getElementById("exportBtn"),
    importBtn: document.getElementById("importBtn"),
    overlay: document.getElementById("overlay"),
    overlayKicker: document.getElementById("overlayKicker"),
    overlayTitle: document.getElementById("overlayTitle"),
    overlayText: document.getElementById("overlayText"),
    overlayPrimary: document.getElementById("overlayPrimary"),
    overlaySecondary: document.getElementById("overlaySecondary"),
    toast: document.getElementById("toast"),
    fx: document.getElementById("fx"),
    meter: document.getElementById("meter"),
    meterRank: document.getElementById("meterRank"),
    meterPct: document.getElementById("meterPct"),
    meterLine: document.getElementById("meterLine"),
    meterTrack: document.getElementById("meterTrack"),
    meterRanks: document.getElementById("meterRanks"),
    meterToggle: document.getElementById("meterToggle"),
    breakdown: document.getElementById("breakdown")
  };

  // =====================================================
  // LEVELS (Buildings)
  // =====================================================
  function currentLevel() { return LEVELS[progress.currentLevel]; }

  function levelPool(li, useFilter) {
    const field = LEVELS[li].field;
    return buildings.filter(b => hasValue(b, field) && (!useFilter || filter === "all" || b.area === filter));
  }

  function levelSits(li) {
    const field = LEVELS[li].field;
    const pool = levelPool(li, false);
    const sits = pool.filter(b => { const f = factState(b.id, field); return f.seen && f.box >= SITS_BOX; }).length;
    return { sits, total: pool.length };
  }

  function isLevelComplete(li) {
    const s = levelSits(li);
    return s.total > 0 && s.sits === s.total;
  }

  function isUnlocked(li) {
    return li === 0 || !!progress.passed[li - 1] || !!progress.manualUnlock[li];
  }

  // =====================================================
  // ITEMS – one learnable fact. Buildings and Area use the same engine.
  // =====================================================
  function areaPool() {
    return areaFacts.filter(f => areaFilter === "all" || f.category === areaFilter);
  }

  function sectionItems() {
    if (activeSection === "area") return areaPool().map(f => ({ type: "a", id: f.id, fact: f }));
    const lv = currentLevel();
    return levelPool(progress.currentLevel, true).map(b => ({ type: "b", id: b.id, b, field: lv.field }));
  }

  // What the scheduler may show: the current level, plus facts from earlier levels
  // that are still being learned, due for review today, or weak spots – so they never get forgotten.
  function schedulingItems() {
    const items = sectionItems();
    if (activeSection === "area") return items;
    const now = Date.now();
    for (let li = 0; li < progress.currentLevel; li++) {
      const field = LEVELS[li].field;
      levelPool(li, true).forEach(b => {
        const it = { type: "b", id: b.id + ":" + field, bid: b.id, b, field };
        const st = factState(b.id, field);
        if (st.seen && (isLearning(st) || isReviewDue(st, now) || isWeak(st, now))) items.push(it);
      });
    }
    return items;
  }

  function stateOf(item) { return item.type === "a" ? areaState(item.id) : factState(item.bid || item.id, item.field); }
  function sectionProgress() { return activeSection === "area" ? areaProgress : progress; }
  function correctAnswer(item) { return item.type === "a" ? item.fact.answer : answerOf(item.b, item.field); }

  function statusOf(item) {
    const s = stateOf(item);
    if (!s.seen) return "new";
    return s.box >= MASTERED_BOX ? "mastered" : "learning";
  }

  function isLearning(s) { return s.seen && s.box < SITS_BOX; }
  function isReviewDue(s, now) { return s.seen && s.box >= SITS_BOX && s.dueAt <= now; }
  function isWeak(s, now) { return s.seen && s.lastWrongAt > 0 && now - s.lastWrongAt < WEAK_DAYS * DAY && s.box < MASTERED_BOX; }

  function dueTodayCount(items) {
    const now = Date.now();
    return items.filter(i => { const s = stateOf(i); return isLearning(s) || isReviewDue(s, now); }).length;
  }

  function sitsCount(items) {
    return items.filter(i => { const s = stateOf(i); return s.seen && s.box >= SITS_BOX; }).length;
  }

  // =====================================================
  // SCHEDULER (spaced repetition: card-based while learning, day-based once a fact sits)
  // =====================================================
  function pickNextItem() {
    const items = schedulingItems();
    if (items.length === 0) return { reason: "empty" };
    const prog = sectionProgress();
    const rc = prog.reviewCount;
    const now = Date.now();
    const notLast = list => list.filter(i => i.id !== lastId);

    if (weakMode[activeSection]) {
      const weak = items.filter(i => isWeak(stateOf(i), now));
      if (!weak.length) return { reason: "no-weak" };
      const pool = notLast(weak).length ? notLast(weak) : weak;
      const minBox = Math.min(...pool.map(i => stateOf(i).box));
      return { item: pick(pool.filter(i => stateOf(i).box === minBox)) };
    }

    // 1) facts still being learned that are due now
    const dueLearning = notLast(items.filter(i => { const s = stateOf(i); return isLearning(s) && s.due <= rc; }));
    if (dueLearning.length) return { item: pick(dueLearning) };

    // 2) reviews that are due today (day-based)
    const dueReviews = notLast(items.filter(i => isReviewDue(stateOf(i), now)));
    if (dueReviews.length) return { item: pick(dueReviews) };

    // 3) a new fact, if fewer than MAX_LEARNING are in progress
    const seen = items.filter(i => stateOf(i).seen);
    const unseen = items.filter(i => !stateOf(i).seen);
    const learningCount = seen.filter(i => isLearning(stateOf(i))).length;
    if (unseen.length && (learningCount < MAX_LEARNING || seen.length === 0)) {
      const freshFirst = unseen.filter(i => i.id !== lastId);
      return { item: freshFirst[0] || unseen[0] };
    }

    // 4) learning facts that are not due yet (keeps the learning phase going)
    const learning = items.filter(i => isLearning(stateOf(i)));
    const learningNotLast = notLast(learning);
    if (learningNotLast.length) {
      const minDue = Math.min(...learningNotLast.map(i => stateOf(i).due));
      return { item: pick(learningNotLast.filter(i => stateOf(i).due === minDue)) };
    }

    // 5) "practice anyway": reviews that are not due yet, soonest first
    if (practiceAnyway[activeSection] && seen.length) {
      const pool = notLast(seen).length ? notLast(seen) : seen;
      const sorted = pool.slice().sort((a, b) => stateOf(a).dueAt - stateOf(b).dueAt);
      return { item: pick(sorted.slice(0, 3)) };
    }

    if (learning.length) return { item: learning[0] };
    return { reason: "done" };
  }

  function applyResult(item, correct) {
    const s = stateOf(item);
    const prog = sectionProgress();
    const now = Date.now();
    const notDueYet = s.box >= SITS_BOX && s.dueAt > now; // extra practice of a review that is not due

    if (correct) {
      if (!notDueYet) {
        s.box = Math.min(s.box + 1, MAX_BOX);
        if (s.box < SITS_BOX) {
          s.due = prog.reviewCount + LEARN_STEPS[s.box];
          s.dueAt = 0;
        } else {
          s.due = prog.reviewCount;
          s.dueAt = startOfDay(now) + REVIEW_DAYS[s.box] * DAY;
        }
      }
      if (s.box >= SITS_BOX) s.lastWrongAt = 0; // relearned → no longer a weak spot
    } else {
      s.box = 0;
      s.due = prog.reviewCount + LEARN_STEPS[0];
      s.dueAt = 0;
      s.wrongCount++;
      s.lastWrongAt = now;
    }
    prog.reviewCount++;
  }

  // =====================================================
  // QUESTION BUILDING
  // =====================================================
  // Typed recall: only for answers that are a single number (year, floors, units, area numbers, CR routes)
  function typedSpec(item) {
    if (item.type === "a") {
      const answer = item.fact.answer;
      const tokens = answer.match(/\d[\d.,]*\d|\d/g) || [];
      if (tokens.length !== 1) return null;
      return { canonical: normalizeNumber(tokens[0]), template: answer.replace(tokens[0], "___"), decimal: tokens[0].includes(".") };
    }
    const value = answerOf(item.b, item.field);
    if (item.field === "completion") return { canonical: digitsOnly(value), template: "" };
    if (/^\d+$/.test(value)) return { canonical: value, template: "" };
    const tokens = String(value).match(/\d+/g) || [];
    if (item.field === "units" && tokens.length === 1) return { canonical: tokens[0], template: value.replace(tokens[0], "___") };
    return null;
  }

  function makeOptions(item, hard) {
    const s = stateOf(item);
    const strong = hard || s.box >= 2;
    if (item.type === "a") {
      const f = item.fact;
      const wrong = (strong && f.close) ? f.close : f.distractors;
      return shuffle([f.answer, ...wrong.slice(0, 3)]);
    }
    const field = item.field;
    const correct = answerOf(item.b, field);
    const pool = [...new Set(buildings.filter(x => hasValue(x, field)).map(x => answerOf(x, field)))].filter(v => v !== correct);
    let distractors;
    if (strong) {
      const target = numericAnswer(field, correct);
      const scored = pool.map(v => {
        const val = numericAnswer(field, v);
        return { v, dist: (target === null || val === null) ? 99999 : Math.abs(val - target) };
      }).sort((a, c) => a.dist - c.dist);
      distractors = shuffle(scored.slice(0, 5).map(x => x.v)).slice(0, 3);
    } else {
      distractors = shuffle(pool).slice(0, 3);
    }
    return shuffle([correct, ...distractors]);
  }

  // Bonus: compare two buildings (only buildings already learned in this level)
  function makeCompare(lv) {
    const pool = levelPool(progress.currentLevel, true)
      .filter(b => factState(b.id, lv.field).seen && numericAnswer(lv.field, answerOf(b, lv.field)) !== null);
    if (pool.length < 2) return null;
    for (let attempt = 0; attempt < 30; attempt++) {
      const [a, b] = shuffle(pool).slice(0, 2);
      const va = numericAnswer(lv.field, answerOf(a, lv.field));
      const vb = numericAnswer(lv.field, answerOf(b, lv.field));
      if (va === vb) continue;
      const aWins = lv.higherWins ? va > vb : va < vb;
      return { kind: "compare", lv, a, b, winnerId: aWins ? a.id : b.id, picked: undefined };
    }
    return null;
  }

  // Bonus: reverse question – given the value, which building is it?
  function makeReverse(lv) {
    const learned = levelPool(progress.currentLevel, true).filter(b => factState(b.id, lv.field).seen);
    if (!learned.length) return null;
    for (let attempt = 0; attempt < 20; attempt++) {
      const target = pick(learned);
      const value = answerOf(target, lv.field);
      const others = shuffle(buildings.filter(b => hasValue(b, lv.field) && b.id !== target.id && answerOf(b, lv.field) !== value));
      if (others.length < 3) continue;
      return { kind: "reverse", lv, target, value, options: shuffle([target, ...others.slice(0, 3)]), picked: undefined };
    }
    return null;
  }

  // =====================================================
  // FLOW
  // =====================================================
  function clearTimer() {
    if (advanceTimer) { clearTimeout(advanceTimer); advanceTimer = null; }
  }

  function nextItem() {
    clearTimer();
    if (test) { nextTestItem(); return; }

    // Round finished → short summary first
    if (session.round.count >= ROUND_SIZE) { showRoundSummary(); return; }
    if (session.round.sitsAtStart === null) session.round.sitsAtStart = sitsCount(sectionItems());

    // Buildings: every few questions a bonus question (compare or reverse)
    if (activeSection === "buildings" && !weakMode.buildings && session.sinceBonus >= BONUS_EVERY) {
      const lv = currentLevel();
      const bonus = session.bonusToggle % 2 === 0 ? (makeCompare(lv) || makeReverse(lv)) : (makeReverse(lv) || makeCompare(lv));
      if (bonus) {
        session.sinceBonus = 0;
        session.bonusToggle++;
        view = bonus;
        render();
        return;
      }
    }

    const next = pickNextItem();
    if (!next.item) {
      view = { kind: next.reason };
      render();
      return;
    }
    const item = next.item;
    lastId = item.id;
    const s = stateOf(item);

    if (!s.seen) {
      view = { kind: "intro", item };
    } else {
      const spec = s.box >= TYPE_BOX ? typedSpec(item) : null;
      view = spec
        ? { kind: "quiz", mode: "typed", item, spec, picked: undefined, correct: undefined }
        : { kind: "quiz", mode: "mc", item, options: makeOptions(item), picked: undefined, correct: undefined };
    }
    render();
  }

  function finishIntro() {
    if (view.kind !== "intro") return;
    const s = stateOf(view.item);
    const prog = sectionProgress();
    s.seen = true;
    s.box = 0;
    s.due = prog.reviewCount + 2;
    s.dueAt = 0;
    prog.reviewCount++;
    session.round.count++;
    session.round.intros++;
    saveProgress();
    nextItem();
  }

  function answerChoice(value) {
    if (view.kind !== "quiz" || view.mode !== "mc" || view.picked !== undefined) return;
    view.picked = value;
    finishAnswer(value === correctAnswer(view.item));
  }

  function submitTyped(giveUp) {
    if (view.kind !== "quiz" || view.mode !== "typed" || view.picked !== undefined) return;
    const input = document.getElementById("answerInput");
    const typed = giveUp ? "" : (input && input.value ? String(input.value).trim() : "");
    if (!giveUp && !typed) { showToast("Type an answer – or tap “I don't know”"); return; }
    view.picked = giveUp ? null : typed;
    finishAnswer(!giveUp && normalizeNumber(typed) === normalizeNumber(view.spec.canonical));
  }

  function finishAnswer(correct) {
    if (view.test) { finishTestAnswer(correct); return; }
    view.correct = correct;
    applyResult(view.item, correct);
    session.sinceBonus++;
    session.round.count++;
    registerAnswer(correct);
    saveProgress();
    render();
    pulse(correct);
    let paused = activeSection === "buildings" ? checkTestReady() : false;
    if (!paused) paused = checkRankUp();
    if (correct && !paused) advanceTimer = setTimeout(nextItem, AUTO_ADVANCE_MS);
  }

  function answerBonus(index) {
    if ((view.kind !== "compare" && view.kind !== "reverse") || view.picked !== undefined) return;
    let correct;
    if (view.kind === "compare") {
      view.picked = index === 0 ? view.a.id : view.b.id;
      correct = view.picked === view.winnerId;
    } else {
      const chosen = view.options[index];
      if (!chosen) return;
      view.picked = chosen.id;
      correct = chosen.id === view.target.id;
    }
    session.round.count++;
    registerAnswer(correct);
    saveProgress();
    render();
    pulse(correct);
  }

  function registerAnswer(correct, inTest) {
    const sp = sectionProgress();
    session.answered++;
    if (!inTest) session.round.answered++;
    if (correct) {
      session.correct++;
      if (!inTest) session.round.correct++;
      session.streak++;
      if (session.streak > sp.bestStreak) sp.bestStreak = session.streak;
      if (session.streak % 5 === 0) showToast(session.streak + " in a row!");
    } else {
      session.streak = 0;
    }
  }

  // =====================================================
  // OVERLAY (level up, round summary)
  // =====================================================
  function showOverlay(o) {
    clearTimer();
    el.overlayKicker.textContent = o.kicker;
    el.overlayTitle.textContent = o.title;
    el.overlayText.textContent = o.text;
    el.overlayPrimary.textContent = o.primary;
    el.overlaySecondary.textContent = o.secondary;
    overlayActions = { primary: o.onPrimary, secondary: o.onSecondary };
    el.overlay.hidden = false;
  }

  function closeOverlay(which) {
    el.overlay.hidden = true;
    const action = which === "primary" ? overlayActions.primary : overlayActions.secondary;
    overlayActions = { primary: null, secondary: null };
    if (action) action();
    else nextItem();
  }

  function showRoundSummary() {
    const r = session.round;
    const items = sectionItems();
    const sitsNow = sitsCount(items);
    const gained = Math.max(0, sitsNow - (r.sitsAtStart || 0));
    const due = dueTodayCount(items);
    const parts = [];
    if (r.answered) parts.push(r.correct + " / " + r.answered + " answers correct");
    if (r.intros) parts.push(r.intros + " new " + (r.intros === 1 ? "fact" : "facts") + " learned");
    parts.push(sitsNow + " / " + items.length + " sit now" + (gained ? " (+" + gained + ")" : ""));
    parts.push(due ? due + " still due today" : "nothing else due today");

    showOverlay({
      kicker: "Round complete",
      title: r.answered && r.correct / r.answered >= 0.8 ? "Strong round!" : "Round done",
      text: parts.join(", ").replace(/^./, c => c.toUpperCase()) + ".",
      primary: "Next round",
      secondary: "Take a break",
      onPrimary: () => { session.round = newRound(); nextItem(); },
      onSecondary: () => { session.round = newRound(); view = { kind: "break" }; render(); }
    });
    view = { kind: "break" };
    render();
  }

  function setLevel(li) {
    cancelTest();
    progress.currentLevel = li;
    saveProgress();
    lastId = null;
    session.sinceBonus = 0;
    session.round.sitsAtStart = null;
    nextItem();
  }

  function onLevelClick(li) {
    if (li === progress.currentLevel) return;
    if (!isUnlocked(li)) {
      const prev = levelSits(li - 1);
      const ok = window.confirm(
        "Level " + (li + 1) + " unlocks when you pass the Level " + li + " test.\n" +
        "(" + prev.sits + " / " + prev.total + " sit so far – the test opens when all sit.)\n\nOpen Level " + (li + 1) + " anyway?"
      );
      if (!ok) return;
      progress.manualUnlock[li] = true;
    }
    setLevel(li);
  }

  // =====================================================
  // LEVEL TEST – the gate to the next level.
  // All facts of the level, random order, no hints, typed where possible. Need 90 %.
  // =====================================================
  function testNeed(total) { return Math.ceil(total * TEST_PASS); }

  function checkTestReady() {
    const li = progress.currentLevel;
    if (progress.passed[li] || progress.testOffered[li] || !isLevelComplete(li)) return false;
    progress.testOffered[li] = true;
    saveProgress();
    const total = levelPool(li, false).length;
    const next = LEVELS[li + 1];
    showOverlay({
      kicker: "Level " + (li + 1) + ": all " + total + " buildings sit",
      title: "Ready for the level test?",
      text: "One pass through all " + total + " buildings in random order – no hints, no second tries. " +
        "Get " + testNeed(total) + " / " + total + " right to " + (next ? "unlock Level " + (li + 2) + "." : "complete the last level."),
      primary: "Start level test",
      secondary: "Practice more first",
      onPrimary: () => startTest(),
      onSecondary: () => nextItem()
    });
    renderLevels();
    return true;
  }

  function startTest() {
    if (activeSection !== "buildings") return;
    const li = progress.currentLevel;
    const s = levelSits(li);
    if (s.sits < s.total) {
      showToast("The test opens when all " + s.total + " sit (" + s.sits + " / " + s.total + " so far)");
      return;
    }
    clearTimer();
    el.overlay.hidden = true;
    weakMode.buildings = false;
    const field = LEVELS[li].field;
    test = {
      li,
      items: shuffle(levelPool(li, false).map(b => ({ type: "b", id: b.id, b, field }))),
      idx: 0, correct: 0, missed: []
    };
    lastId = null;
    nextItem();
  }

  function cancelTest(message) {
    if (!test) return;
    test = null;
    if (message) showToast(message);
  }

  function nextTestItem() {
    if (test.idx >= test.items.length) { finishTest(); return; }
    const item = test.items[test.idx];
    const spec = typedSpec(item);
    const base = { kind: "quiz", test: true, testNo: test.idx + 1, testTotal: test.items.length, item, picked: undefined, correct: undefined };
    view = spec ? Object.assign(base, { mode: "typed", spec }) : Object.assign(base, { mode: "mc", options: makeOptions(item, true) });
    render();
  }

  function finishTestAnswer(correct) {
    view.correct = correct;
    if (correct) {
      test.correct++;
    } else {
      // Not known after all → back into learning
      test.missed.push(view.item.b.name);
      const st = stateOf(view.item);
      st.box = 0;
      st.due = progress.reviewCount + LEARN_STEPS[0];
      st.dueAt = 0;
      st.wrongCount++;
      st.lastWrongAt = Date.now();
    }
    test.idx++;
    registerAnswer(correct, true);
    saveProgress();
    render();
    pulse(correct);
    if (correct) advanceTimer = setTimeout(nextItem, AUTO_ADVANCE_MS);
  }

  function finishTest() {
    const t = test;
    test = null;
    const total = t.items.length;
    const need = testNeed(total);
    const next = LEVELS[t.li + 1];
    const missed = t.missed.length ? " Missed: " + t.missed.join(", ") + " – they go back into practice." : "";

    if (t.correct >= need) {
      progress.passed[t.li] = true;
      saveProgress();
      celebrate();
      showOverlay({
        kicker: "Level " + (t.li + 1) + " test passed",
        title: next ? "Level " + (t.li + 2) + " unlocked" : "All levels done!",
        text: t.correct + " / " + total + " correct." + missed +
          (next ? " Your " + LEVELS[t.li].title.toLowerCase() + " facts keep coming back for review while you learn " + next.title + "." : ""),
        primary: next ? "Start Level " + (t.li + 2) + ": " + next.title : "Keep practicing",
        secondary: next ? "Stay on this level" : "Close",
        onPrimary: next ? () => setLevel(t.li + 1) : () => nextItem(),
        onSecondary: () => nextItem()
      });
    } else {
      progress.testOffered[t.li] = false; // offer the test again once everything sits
      saveProgress();
      showOverlay({
        kicker: "Level " + (t.li + 1) + " test",
        title: "Not yet – " + t.correct + " / " + total,
        text: "You need " + need + " / " + total + " to unlock " + (next ? "Level " + (t.li + 2) : "the finish") + "." + missed +
          " Once they sit again, the test opens again.",
        primary: "Practice the missed ones",
        secondary: "Close",
        onPrimary: () => { weakMode.buildings = true; lastId = null; nextItem(); },
        onSecondary: () => nextItem()
      });
    }
    view = { kind: "break" };
    render();
  }

  // =====================================================
  // KNOWLEDGE METER – one number for everything (all building facts + all area facts).
  // A fact counts fully once you still knew it on a later day ("mastered"),
  // half while it only sits ("learned, not yet proven"), and not at all before that.
  // =====================================================
  const RANKS = [
    { min: 0, name: "Beginner", line: "You're getting to know the names." },
    { min: 20, name: "Junior Agent", line: "You can answer the basics." },
    { min: 40, name: "Agent", line: "You're ready for a first viewing." },
    { min: 60, name: "Senior Agent", line: "Clients can trust your numbers." },
    { min: 80, name: "Creek Expert", line: "You know Creek Harbour better than most agents." }
  ];

  function scoreFacts(states) {
    let solid = 0, soft = 0;
    states.forEach(st => {
      if (!st.seen) return;
      if (st.box >= MASTERED_BOX) solid++;
      else if (st.box >= SITS_BOX) soft++;
    });
    const total = states.length;
    return { solid, soft, total, pct: total ? (solid + soft * 0.5) / total * 100 : 0 };
  }

  function knowledge() {
    const groups = LEVELS.map(lv => Object.assign({ name: lv.title },
      scoreFacts(buildings.filter(b => hasValue(b, lv.field)).map(b => factState(b.id, lv.field)))));
    groups.push(Object.assign({ name: "Area knowledge" }, scoreFacts(areaFacts.map(f => areaState(f.id)))));
    const solid = groups.reduce((a, g) => a + g.solid, 0);
    const soft = groups.reduce((a, g) => a + g.soft, 0);
    const total = groups.reduce((a, g) => a + g.total, 0);
    return { groups, solid, soft, total, pct: total ? (solid + soft * 0.5) / total * 100 : 0 };
  }

  function rankIndex(pct) {
    let idx = 0;
    RANKS.forEach((r, i) => { if (pct >= r.min) idx = i; });
    return idx;
  }

  let shownPct = null;
  function animateNumber(node, from, to) {
    const raf = typeof requestAnimationFrame === "function" ? requestAnimationFrame : null;
    if (!raf || from === null || from === to) { node.textContent = String(to); return; }
    const start = Date.now(), dur = 900;
    const tick = () => {
      const t = Math.min(1, (Date.now() - start) / dur);
      const eased = 1 - Math.pow(1 - t, 3);
      node.textContent = String(Math.round(from + (to - from) * eased));
      if (t < 1) raf(tick);
    };
    raf(tick);
  }

  function initMeter() {
    let ticks = "";
    RANKS.slice(1).forEach(r => { ticks += '<div class="meter-tick" style="left:' + r.min + '%"></div>'; });
    el.meterTrack.innerHTML = '<div class="meter-sits" id="meterSits"></div><div class="meter-solid" id="meterSolid"></div>' + ticks;
    el.meterSits = document.getElementById("meterSits");
    el.meterSolid = document.getElementById("meterSolid");
  }

  function renderMeter() {
    const k = knowledge();
    const pct = Math.round(k.pct);
    const idx = rankIndex(k.pct);
    const next = RANKS[idx + 1];
    el.meterRank.textContent = RANKS[idx].name;
    animateNumber(el.meterPct, shownPct, pct);
    shownPct = pct;
    el.meterLine.textContent = RANKS[idx].line + (next ? " " + Math.max(1, Math.ceil(next.min - k.pct)) + "\u00a0% to " + next.name + "." : "");
    el.meterSolid.style.width = (k.total ? k.solid / k.total * 100 : 0) + "%";
    el.meterSits.style.width = (k.total ? (k.solid + k.soft) / k.total * 100 : 0) + "%";
    el.meterRanks.innerHTML = RANKS.map(r => '<span class="' + (k.pct >= r.min ? "reached" : "") + '" style="left:' + r.min + '%">' +
      esc(r.name) + "</span>").join("");
    el.breakdown.innerHTML = k.groups.map(g =>
      '<div class="bd-row"><span class="bd-name">' + esc(g.name) + '</span>' +
      '<span class="bd-bar"><em style="width:' + (g.total ? (g.solid + g.soft) / g.total * 100 : 0) + '%"></em>' +
      '<b style="width:' + (g.total ? g.solid / g.total * 100 : 0) + '%"></b></span>' +
      '<span class="bd-pct">' + Math.round(g.pct) + "\u00a0%</span></div>").join("") +
      '<div class="bd-row"><span class="bd-name">Total facts</span><span></span><span class="bd-pct">' + k.total + "</span></div>";
  }

  function toggleMeter() {
    const open = !el.meter.classList.contains("open");
    el.meter.classList.toggle("open", open);
    el.meter.setAttribute("aria-expanded", open ? "true" : "false");
    el.meterToggle.textContent = open ? "Hide details" : "Details";
  }

  // Rank-up moment: shown once when you reach a new rank
  function checkRankUp() {
    const k = knowledge();
    const idx = rankIndex(k.pct);
    if (settings.rankIdx < 0 || idx < settings.rankIdx) { settings.rankIdx = idx; saveProgress(); return false; }
    if (idx === settings.rankIdx) return false;
    settings.rankIdx = idx;
    saveProgress();
    const next = RANKS[idx + 1];
    showOverlay({
      kicker: "New rank reached",
      title: RANKS[idx].name,
      text: RANKS[idx].line + " You now know " + Math.round(k.pct) + "\u00a0% of everything in Creek Academy." +
        (next ? " Next up: " + next.name + " at " + next.min + "\u00a0%." : ""),
      primary: "Keep going",
      secondary: "Take a break",
      onPrimary: () => nextItem(),
      onSecondary: () => { view = { kind: "break" }; render(); }
    });
    celebrate();
    return true;
  }

  // =====================================================
  // EFFECTS – gold sparks on a correct answer, gold dust for big moments
  // =====================================================
  function fxOn() {
    if (!el.fx || typeof document.createElement !== "function") return false;
    try {
      if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return false;
    } catch (e) { /* ignore */ }
    return true;
  }

  function sparkAt(x, y) {
    if (!fxOn()) return;
    for (let i = 0; i < 14; i++) {
      const sp = document.createElement("span");
      sp.className = "spark";
      const angle = (i / 14) * Math.PI * 2 + Math.random() * 0.4;
      const dist = 36 + Math.random() * 46;
      sp.style.left = (x - 3) + "px";
      sp.style.top = (y - 3) + "px";
      sp.style.setProperty("--dx", Math.cos(angle) * dist + "px");
      sp.style.setProperty("--dy", Math.sin(angle) * dist + "px");
      el.fx.appendChild(sp);
      setTimeout(() => sp.remove(), 900);
    }
  }

  function sparkFromAnswer() {
    if (!fxOn() || typeof el.card.querySelector !== "function") return;
    const target = el.card.querySelector(".opt.correct") || el.card.querySelector(".answer-input.ok") || el.card.querySelector(".result-line.good");
    if (!target) return;
    const r = target.getBoundingClientRect();
    sparkAt(r.left + r.width / 2, r.top + r.height / 2);
  }

  function celebrate() {
    if (!fxOn()) return;
    for (let i = 0; i < 46; i++) {
      const d = document.createElement("span");
      d.className = "dust";
      d.style.left = Math.random() * 100 + "vw";
      d.style.setProperty("--dx", (Math.random() * 120 - 60) + "px");
      d.style.setProperty("--r", (Math.random() * 720 - 360) + "deg");
      d.style.setProperty("--t", (1.6 + Math.random() * 1.6) + "s");
      d.style.animationDelay = Math.random() * 0.5 + "s";
      el.fx.appendChild(d);
      setTimeout(() => d.remove(), 3800);
    }
  }

  // =====================================================
  // RENDERING
  // =====================================================
  function badgeHTML(status, label) {
    return '<span class="badge ' + status + '">' + esc(label || status.charAt(0).toUpperCase() + status.slice(1)) + "</span>";
  }

  // Top of the card: label + title (+ the question in client mode)
  function headHTML(item, status, withQuestion) {
    const badge = view.test ? badgeHTML("new", "Test " + view.testNo + " / " + view.testTotal) : badgeHTML(status);
    if (item.type === "a") {
      const f = item.fact;
      let html = '<div class="card-top"><div class="card-area">' + esc(f.category) + "</div>" + badge + "</div>";
      if (settings.clientMode) {
        html += '<div class="client-label">Client asks</div><h1 class="card-name area-q">“' + esc(AREA_CLIENT_QUESTIONS[f.id] || f.question) + '”</h1>';
      } else {
        html += '<h1 class="card-name area-q">' + esc(f.question) + "</h1>";
      }
      return html;
    }
    const lv = levelForField(item.field);
    let html = '<div class="card-top"><div class="card-area">' + esc(view.test ? "Level " + (test ? test.li + 1 : progress.currentLevel + 1) + " test" : item.b.area) + "</div>" + badge + "</div>" +
      '<h1 class="card-name">' + esc(item.b.name.toUpperCase()) + "</h1>";
    if (withQuestion) {
      html += settings.clientMode
        ? '<div class="client-label">Client asks</div><div class="client-q">“' + esc(lv.client(item.b.name)) + '”</div>'
        : '<div class="question">' + esc(lv.question) + "</div>";
    }
    return html;
  }

  function answerBoxHTML(item, cls) {
    if (item.type === "a") {
      return '<div class="big-fact ' + (cls || "") + '"><div class="fact-label">Answer</div>' +
        '<div class="big-value text">' + esc(item.fact.answer) + "</div></div>";
    }
    const lv = levelForField(item.field);
    const extra = lv.extra ? lv.extra(item.b) : "";
    return '<div class="big-fact ' + (cls || "") + '"><div class="fact-label">' + esc(lv.label) +
      '</div><div class="big-value">' + esc(answerOf(item.b, item.field)) + "</div>" +
      (extra ? '<div class="fact-extra">' + esc(extra) + "</div>" : "") + "</div>";
  }

  // Memory hint (Buildings only) – one short line, computed only from the data above
  function hintFor(b, field) {
    if (field === "completion") {
      const year = completionYear(b.completion);
      if (!year) return "";
      const same = buildings.filter(x => x.id !== b.id && completionYear(x.completion) === year).map(x => x.name);
      if (!same.length) return "Only building in your list from <strong>" + year + "</strong>.";
      const shown = same.slice(0, 3).join(", ") + (same.length > 3 ? " …" : "");
      return "Also " + year + ": <strong>" + esc(shown) + "</strong>";
    }
    let line = "";
    const val = valueOf(field, b[field]);
    if (val !== null) {
      const ranked = buildings.filter(x => valueOf(field, x[field]) !== null);
      const rank = ranked.filter(x => valueOf(field, x[field]) > val).length + 1;
      if (field === "floors") {
        line = (rank === 1 ? "<strong>The tallest</strong>" : "<strong>#" + rank + " tallest</strong>") +
          " of " + ranked.length + " (by tallest tower).";
      } else {
        let closest = null;
        ranked.filter(x => x.id !== b.id).forEach(x => {
          const d = Math.abs(valueOf(field, x[field]) - val);
          if (!closest || d < closest.d) closest = { x, d };
        });
        line = "<strong>#" + rank + "</strong> of " + ranked.length + " by units";
        if (closest) {
          line += closest.d === 0
            ? " – same as <strong>" + esc(closest.x.name) + "</strong>."
            : " – closest: " + esc(closest.x.name) + " (" + esc(closest.x[field]) + ").";
        }
      }
    }
    if (b.note) line += (line ? "<br>" : "") + "Note: <strong>" + esc(b.note) + "</strong>";
    return line;
  }

  function hintHTML(item) {
    if (item.type === "a" || view.test) return "";
    const h = hintFor(item.b, item.field);
    return h ? '<p class="hint">' + h + "</p>" : "";
  }

  function renderIntro() {
    const item = view.item;
    return headHTML(item, "new", false) +
      answerBoxHTML(item) +
      hintHTML(item) +
      '<p class="hint">Just this one fact. The quiz comes in a few cards.</p>' +
      '<div class="spacer"></div>' +
      '<button class="btn btn-primary" type="button" data-action="got-it">Got it</button>';
  }

  function renderQuiz() {
    const item = view.item;
    const answered = view.picked !== undefined;
    let html = headHTML(item, statusOf(item), true);

    if (view.mode === "typed") {
      const spec = view.spec;
      if (spec.template) html += '<div class="type-template">' + esc(spec.template).replace("___", "<strong>___</strong>") + "</div>";
      const cls = answered ? (view.correct ? " ok" : " bad") : "";
      html += '<div class="type-row"><input class="answer-input' + cls + '" id="answerInput" type="text" inputmode="' + (spec.decimal ? "decimal" : "numeric") + '" enterkeyhint="done" autocorrect="off" spellcheck="false" ' +
        'autocomplete="off" placeholder="Type it…" value="' + esc(answered && view.picked !== null ? view.picked : "") + '"' +
        (answered ? " disabled" : "") + ">" +
        (answered ? "" : '<button class="btn btn-primary" type="button" data-action="check">Check</button>') + "</div>";
      if (!answered) html += '<div class="type-note">' + (view.test ? "Type it from memory." : "Getting stronger – type it from memory.") + "</div>";
    } else {
      const correctValue = correctAnswer(item);
      html += '<div class="options' + (item.type === "a" ? " single" : "") + '">';
      view.options.forEach((opt, i) => {
        let cls = "btn opt";
        if (answered) {
          if (opt === correctValue) cls += " correct";
          else if (opt === view.picked) cls += " incorrect";
          else cls += " dim";
        }
        html += '<button class="' + cls + '" type="button" data-action="answer" data-index="' + i + '"' +
          (answered ? " disabled" : "") + '><span class="key">' + (i + 1) + "</span>" + esc(opt) + "</button>";
      });
      html += "</div>";
    }

    if (!answered) {
      html += '<button class="btn btn-link" type="button" data-action="dont-know">I don\'t know – show me</button>';
    } else if (view.correct) {
      html += '<div class="result-line good">Correct!</div>' + (view.mode === "typed" ? answerBoxHTML(item, "ok") : "") + hintHTML(item);
    } else {
      html += answerBoxHTML(item, "ok") + hintHTML(item) +
        '<div class="spacer"></div>' +
        '<button class="btn btn-primary" type="button" data-action="next">Continue</button>';
    }
    return html;
  }

  function renderCompare() {
    const c = view;
    let html = '<div class="card-top"><div class="card-area">Bonus question</div><span class="badge">Compare</span></div>' +
      '<h1 class="card-name small">' + esc(c.lv.compare) + "</h1>" +
      '<div class="options" style="margin-top:28px">';
    [c.a, c.b].forEach((bld, i) => {
      let cls = "btn opt compare-opt";
      if (c.picked !== undefined) {
        if (bld.id === c.winnerId) cls += " correct";
        else if (bld.id === c.picked) cls += " incorrect";
        else cls += " dim";
      }
      html += '<button class="' + cls + '" type="button" data-action="bonus" data-index="' + i + '"' +
        (c.picked !== undefined ? " disabled" : "") + '><span class="key">' + (i + 1) +
        '</span><span class="compare-name">' + esc(bld.name) + "</span>" +
        (c.picked !== undefined ? '<span class="compare-val">' + esc(answerOf(bld, c.lv.field)) + "</span>" : "") + "</button>";
    });
    html += "</div>";
    if (c.picked !== undefined) html += bonusResultHTML(c.picked === c.winnerId);
    return html;
  }

  function renderReverse() {
    const r = view;
    let html = '<div class="card-top"><div class="card-area">Bonus question</div><span class="badge">Reverse</span></div>' +
      '<h1 class="card-name small">' + esc(r.lv.reverse(r.value)) + "</h1>" +
      '<div class="options" style="margin-top:28px">';
    r.options.forEach((bld, i) => {
      let cls = "btn opt";
      if (r.picked !== undefined) {
        if (bld.id === r.target.id) cls += " correct";
        else if (bld.id === r.picked) cls += " incorrect";
        else cls += " dim";
      }
      html += '<button class="' + cls + '" type="button" data-action="bonus" data-index="' + i + '"' +
        (r.picked !== undefined ? " disabled" : "") + '><span class="key">' + (i + 1) + "</span>" + esc(bld.name) + "</button>";
    });
    html += "</div>";
    if (r.picked !== undefined) html += bonusResultHTML(r.picked === r.target.id);
    return html;
  }

  function bonusResultHTML(ok) {
    return '<div class="result-line ' + (ok ? "good" : "low") + '">' + (ok ? "Correct!" : "Not quite.") + "</div>" +
      '<div class="spacer"></div><button class="btn btn-primary" type="button" data-action="next">Next</button>';
  }

  function renderMessage(title, text, buttonLabel, action) {
    return '<div class="spacer"></div><h1 class="card-name small">' + title + "</h1>" +
      '<p class="hint">' + text + "</p>" +
      (buttonLabel ? '<button class="btn btn-primary" type="button" data-action="' + action + '">' + buttonLabel + "</button>" : "") +
      '<div class="spacer"></div>';
  }

  function render() {
    let html;
    const isArea = activeSection === "area";
    if (view.kind === "intro") html = renderIntro();
    else if (view.kind === "quiz") html = renderQuiz();
    else if (view.kind === "compare") html = renderCompare();
    else if (view.kind === "reverse") html = renderReverse();
    else if (view.kind === "done") {
      const li = progress.currentLevel;
      const testOpen = !isArea && !progress.passed[li] && isLevelComplete(li);
      html = renderMessage("All done for today",
        testOpen
          ? "Everything in this level sits. Take the level test to unlock the next level – or come back tomorrow for reviews."
          : "Everything you have learned so far sits for today. The next reviews come back tomorrow – that spacing is what makes it stick.",
        testOpen ? "Take level test" : "Practice anyway", testOpen ? "start-test" : "practice");
      if (testOpen) html = html.replace(/<div class="spacer"><\/div>$/,
        '<button class="btn btn-link" type="button" data-action="practice">Practice anyway</button><div class="spacer"></div>');
    } else if (view.kind === "no-weak") {
      html = renderMessage("No weak spots right now",
        "Nothing you answered wrong recently is still open. Nice.", "Back to normal learning", "weak-off");
    } else if (view.kind === "break") {
      html = renderMessage("Nice work", "Short breaks help it stick. Come back whenever you are ready.", "Start next round", "new-round");
    } else {
      html = isArea
        ? renderMessage("No area facts", "Change the category to continue.", "", "")
        : renderMessage("No buildings", "Change the filter to continue.", "", "");
    }
    el.card.innerHTML = html;
    if (view !== lastRenderedView) {
      el.card.classList.remove("enter");
      void el.card.offsetWidth;
      el.card.classList.add("enter");
      lastRenderedView = view;
    } else {
      el.card.classList.remove("enter");
    }

    if (view.kind === "quiz" && view.mode === "typed" && view.picked === undefined) {
      const input = document.getElementById("answerInput");
      if (input && typeof input.focus === "function") input.focus();
    }
    renderLevels();
    updateStats();
    renderMeter();
  }

  function renderLevels() {
    if (activeSection === "area") {
      const pool = areaPool();
      const sits = pool.filter(f => { const s = areaState(f.id); return s.seen && s.box >= SITS_BOX; }).length;
      const pct = pool.length ? Math.round(sits / pool.length * 100) : 0;
      el.levels.classList.add("single");
      el.levels.innerHTML = '<div class="level static active">' +
        '<div class="level-num">Area knowledge</div>' +
        '<div class="level-title">' + esc(areaFilter === "all" ? "All area facts" : areaFilter) + "</div>" +
        '<div class="level-bar"><div class="level-fill" style="width:' + pct + '%"></div></div>' +
        '<div class="level-count">' + sits + " / " + pool.length + " sit</div></div>";
      return;
    }
    el.levels.classList.remove("single");
    let html = "";
    LEVELS.forEach((lv, li) => {
      const s = levelSits(li);
      const pct = s.total ? Math.round(s.sits / s.total * 100) : 0;
      const unlocked = isUnlocked(li);
      let cls = "level";
      if (li === progress.currentLevel) cls += " active";
      if (!unlocked) cls += " locked";
      html += '<button class="' + cls + '" type="button" data-level="' + li + '">' +
        '<div class="level-num">Level ' + (li + 1) + (unlocked ? "" : " · 🔒") + "</div>" +
        '<div class="level-title">' + esc(lv.title) + "</div>" +
        '<div class="level-bar"><div class="level-fill" style="width:' + pct + '%"></div></div>' +
        '<div class="level-count">' + s.sits + " / " + s.total + " sit" +
        (progress.passed[li] ? ", test passed ✓" : (s.total && s.sits === s.total ? ", test ready" : "")) + "</div></button>";
    });
    el.levels.innerHTML = html;
  }

  function updateStats() {
    const items = sectionItems();
    let fresh = 0, learning = 0, mastered = 0;
    items.forEach(i => {
      const st = statusOf(i);
      if (st === "new") fresh++;
      else if (st === "learning") learning++;
      else mastered++;
    });
    el.statNew.textContent = fresh;
    el.statLearning.textContent = learning;
    el.statMastered.textContent = mastered;
    el.statStreak.textContent = session.streak;
    const prevStats = lastStats[activeSection];
    if (prevStats && mastered > prevStats.mastered) bump(el.statMastered);
    if (prevStats && session.streak > prevStats.streak && session.streak % 5 === 0) bump(el.statStreak);
    lastStats[activeSection] = { mastered, streak: session.streak };

    const now = Date.now();
    const roundPct = Math.round(Math.min(session.round.count, ROUND_SIZE) / ROUND_SIZE * 100);
    const sched = schedulingItems();
    if (test) {
      const tPct = Math.round(test.idx / test.items.length * 100);
      el.toolbarInfo.innerHTML = "<span>Level test: <strong>" + test.idx + " / " + test.items.length + "</strong></span>" +
        "<span>" + test.correct + " right" + '<span class="round-bar"><span class="round-fill" style="width:' + tPct + '%"></span></span></span>';
    } else {
      const lead = weakMode[activeSection]
        ? "Weak spots: <strong>" + sched.filter(i => isWeak(stateOf(i), now)).length + "</strong>"
        : "Due today: <strong>" + dueTodayCount(sched) + "</strong>";
      el.toolbarInfo.innerHTML = "<span>" + lead + "</span><span>Round <strong>" + Math.min(session.round.count, ROUND_SIZE) + "/" + ROUND_SIZE + "</strong>" +
        '<span class="round-bar"><span class="round-fill" style="width:' + roundPct + '%"></span></span></span>';
    }
    el.testBtn.hidden = activeSection !== "buildings";
    el.testBtn.classList.toggle("on", !!test);

    el.weakBtn.classList.toggle("on", !!weakMode[activeSection]);
    el.clientBtn.classList.toggle("on", !!settings.clientMode);

    const sp = sectionProgress();
    const rate = session.answered ? Math.round(session.correct / session.answered * 100) : 0;
    el.sessionInfo.textContent = session.answered
      ? session.answered + " answered, " + rate + "\u00a0% right. Best streak: " + sp.bestStreak
      : "No answers yet this session. Best streak: " + sp.bestStreak;
  }

  function bump(node) {
    node.classList.remove("bump");
    void node.offsetWidth;
    node.classList.add("bump");
  }

  function pulse(correct) {
    el.card.classList.remove("flash-ok", "flash-bad");
    void el.card.offsetWidth;
    el.card.classList.add(correct ? "flash-ok" : "flash-bad");
    if (correct) sparkFromAnswer();
  }

  function showToast(text) {
    el.toast.textContent = text;
    el.toast.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.toast.classList.remove("show"), 1800);
  }

  function primaryAction() {
    if (view.kind === "intro") finishIntro();
    else if (view.kind === "quiz" && view.picked !== undefined) nextItem();
    else if (view.kind === "quiz" && view.mode === "typed") {
      const input = document.getElementById("answerInput");
      if (input && typeof input.focus === "function") input.focus();
    }
    else if ((view.kind === "compare" || view.kind === "reverse") && view.picked !== undefined) nextItem();
    else if (view.kind === "break") startNewRound();
  }

  function startNewRound() {
    session.round = newRound();
    nextItem();
  }

  // =====================================================
  // SECTIONS (Buildings | Area Knowledge)
  // =====================================================
  const AREA_CATEGORIES = [...new Set(areaFacts.map(f => f.category))];

  function rebuildFilter() {
    let opts;
    if (activeSection === "area") {
      opts = [["all", "All Area Facts"]].concat(AREA_CATEGORIES.map(c => [c, c]));
      el.filterSelect.setAttribute("aria-label", "Area fact category");
    } else {
      opts = [["all", "All Buildings"], ["Marina / Waterfront", "Marina / Waterfront"], ["Central Park", "Central Park"]];
      el.filterSelect.setAttribute("aria-label", "Filter buildings");
    }
    el.filterSelect.innerHTML = opts.map(o => '<option value="' + esc(o[0]) + '">' + esc(o[1]) + "</option>").join("");
    el.filterSelect.value = activeSection === "area" ? areaFilter : filter;
  }

  function applySectionUI() {
    const isArea = activeSection === "area";
    el.subtitle.textContent = isArea ? "Creek Harbour Area Knowledge" : "Building Flashcards";
    el.tabs.querySelectorAll("[data-section]").forEach(t => {
      const on = t.dataset.section === activeSection;
      t.classList.toggle("active", on);
      t.setAttribute("aria-selected", on ? "true" : "false");
    });
    el.resetBtn.textContent = isArea ? "Reset area progress…" : "Reset building progress…";
    rebuildFilter();
    updateUndoButton();
  }

  function setSection(section) {
    if (section !== "buildings" && section !== "area") return;
    if (section === activeSection) return;
    cancelTest("Level test stopped");
    clearTimer();
    if (!el.overlay.hidden) { el.overlay.hidden = true; overlayActions = { primary: null, secondary: null }; }
    activeSection = section;
    session = sessions[section];
    lastId = null;
    saveProgress();
    applySectionUI();
    nextItem();
  }

  // =====================================================
  // EVENTS
  // =====================================================
  el.card.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-action]");
    if (!btn || btn.disabled) return;
    const action = btn.dataset.action;
    const idx = Number(btn.dataset.index);
    if (action === "got-it") finishIntro();
    else if (action === "answer") answerChoice(view.options[idx]);
    else if (action === "check") submitTyped(false);
    else if (action === "dont-know") view.mode === "typed" ? submitTyped(true) : answerChoice(null);
    else if (action === "next") nextItem();
    else if (action === "bonus") answerBonus(idx);
    else if (action === "practice") { practiceAnyway[activeSection] = true; nextItem(); }
    else if (action === "weak-off") { weakMode[activeSection] = false; lastId = null; nextItem(); }
    else if (action === "new-round") startNewRound();
    else if (action === "start-test") startTest();
  });

  el.meter.addEventListener("click", toggleMeter);

  el.levels.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-level]");
    if (btn) onLevelClick(Number(btn.dataset.level));
  });

  el.tabs.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-section]");
    if (btn) setSection(btn.dataset.section);
  });

  el.skipBtn.addEventListener("click", () => {
    if (test && view.kind === "quiz" && view.picked === undefined) { showToast("In the test: answer or tap “I don't know”"); return; }
    nextItem();
  });

  el.filterSelect.addEventListener("change", () => {
    if (activeSection === "area") areaFilter = el.filterSelect.value;
    else filter = el.filterSelect.value;
    lastId = null;
    session.round.sitsAtStart = null;
    nextItem();
  });

  el.testBtn.addEventListener("click", () => {
    if (test) {
      if (window.confirm("Stop the level test? It will not count.")) { cancelTest("Level test stopped"); nextItem(); }
      return;
    }
    startTest();
  });

  el.weakBtn.addEventListener("click", () => {
    if (test) { showToast("Finish or stop the level test first"); return; }
    weakMode[activeSection] = !weakMode[activeSection];
    lastId = null;
    showToast(weakMode[activeSection] ? "Weak spots: only facts you got wrong recently" : "Back to normal learning");
    nextItem();
  });

  el.clientBtn.addEventListener("click", () => {
    settings.clientMode = !settings.clientMode;
    saveProgress();
    showToast(settings.clientMode ? "Client mode on – questions as a client would ask" : "Client mode off");
    render();
  });

  el.overlayPrimary.addEventListener("click", () => closeOverlay("primary"));
  el.overlaySecondary.addEventListener("click", () => closeOverlay("secondary"));

  // ---------- Reset (protected, per section, with backup) ----------
  const memoryBackups = { buildings: null, area: null };

  function backupKey(section) { return section === "area" ? AREA_BACKUP_KEY : BACKUP_KEY; }

  function writeBackup(section, data) {
    memoryBackups[section] = JSON.parse(JSON.stringify(data));
    try { localStorage.setItem(backupKey(section), JSON.stringify(data)); } catch (e) { /* memory backup only */ }
  }

  function readBackup(section) {
    try {
      const raw = localStorage.getItem(backupKey(section));
      if (raw) return JSON.parse(raw);
    } catch (e) { /* ignore */ }
    return memoryBackups[section];
  }

  function updateUndoButton() {
    el.undoResetBtn.hidden = !readBackup(activeSection);
  }

  function resetSessions() {
    sessions.buildings = newSession();
    sessions.area = newSession();
    session = sessions[activeSection];
  }

  el.resetBtn.addEventListener("click", () => {
    const isArea = activeSection === "area";
    const what = isArea ? "AREA KNOWLEDGE" : "BUILDING";
    const other = isArea ? "Building" : "Area Knowledge";
    const typed = window.prompt("This deletes ALL " + what + " progress.\n" + other +
      " progress is NOT affected.\n\nType RESET to confirm:");
    if (typed === null) return;
    if (typed.trim().toUpperCase() !== "RESET") {
      showToast("Reset cancelled – progress kept");
      return;
    }
    cancelTest();
    writeBackup(activeSection, isArea ? areaProgress : progress);
    if (isArea) areaProgress = freshAreaProgress();
    else progress = freshProgress();
    saveProgress();
    sessions[activeSection] = newSession();
    session = sessions[activeSection];
    lastId = null;
    updateUndoButton();
    showToast((isArea ? "Area" : "Building") + " progress reset – you can restore it");
    nextItem();
  });

  el.undoResetBtn.addEventListener("click", () => {
    const backup = readBackup(activeSection);
    if (!backup) return;
    const isArea = activeSection === "area";
    if (!window.confirm("Restore your " + (isArea ? "Area Knowledge" : "Building") + " progress from the backup?")) return;
    if (isArea) areaProgress = normalizeArea(backup);
    else progress = normalize(backup);
    saveProgress();
    memoryBackups[activeSection] = null;
    try { localStorage.removeItem(backupKey(activeSection)); } catch (e) { /* ignore */ }
    lastId = null;
    updateUndoButton();
    showToast("Progress restored");
    nextItem();
  });

  // ---------- Export / Import (move progress between Mac and iPhone) ----------
  function encodeStore() {
    const json = JSON.stringify(storeSnapshot());
    return "CA3:" + btoa(unescape(encodeURIComponent(json)));
  }

  function decodeStore(code) {
    const clean = String(code).trim().replace(/\s+/g, "");
    if (!clean.startsWith("CA3:")) return null;
    try {
      const data = JSON.parse(decodeURIComponent(escape(atob(clean.slice(4)))));
      if (!data || data.version !== 3 || !data.buildings || !data.areaFacts) return null;
      return data;
    } catch (e) {
      return null;
    }
  }

  el.exportBtn.addEventListener("click", () => {
    const code = encodeStore();
    let copied = false;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(code).then(() => showToast("Progress code copied"), () => {});
        copied = true;
      }
    } catch (e) { /* fall back to the prompt */ }
    window.prompt("Your progress code" + (copied ? " (already copied)" : "") +
      ".\nOn the other device: Import progress → paste it.", code);
  });

  el.importBtn.addEventListener("click", () => {
    const code = window.prompt("Paste a progress code from your other device:");
    if (code === null) return;
    const data = decodeStore(code);
    if (!data) { showToast("That code doesn't look right – nothing changed"); return; }
    if (!window.confirm("Replace the progress on this device with the imported progress?\n\n" +
      "Your current progress is saved as a backup (Restore backup).")) return;
    cancelTest();
    writeBackup("buildings", progress);
    writeBackup("area", areaProgress);
    progress = normalize(data.buildings);
    areaProgress = normalizeArea(data.areaFacts);
    settings = normalizeSettings(data.settings);
    saveProgress();
    resetSessions();
    lastId = null;
    applySectionUI();
    showToast("Progress imported");
    nextItem();
  });

  // Remember whether a button got focus from a mouse/finger or from the Tab key.
  let lastPointerDown = 0;
  document.addEventListener("pointerdown", (e) => {
    lastPointerDown = Date.now();
    const btn = e.target && typeof e.target.closest === "function" ? e.target.closest("button") : null;
    if (btn && btn.dataset) btn.dataset.pointerFocus = "1"; // also when it already had focus
  }, true);
  document.addEventListener("keydown", (e) => { if (e.code === "Tab") lastPointerDown = 0; }, true);
  document.addEventListener("focusin", (e) => {
    const t = e.target;
    if (t && t.dataset) t.dataset.pointerFocus = Date.now() - lastPointerDown < 800 ? "1" : "0";
  }, true);

  // True when a button was reached with Tab (not just clicked/tapped before)
  function keyboardFocused(node) {
    return !!(node && node.tagName === "BUTTON" && node.dataset && node.dataset.pointerFocus === "0");
  }

  function skipFromKey() {
    if (test && view.kind === "quiz" && view.picked === undefined) { showToast("In the test: answer or press 0"); return; }
    nextItem();
  }

  // ---------- Keyboard ----------
  document.addEventListener("keydown", (e) => {
    const active = document.activeElement;
    if (active && active.tagName === "SELECT") return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;

    if (active && active === el.meter && (e.code === "Space" || e.code === "Enter" || e.code === "NumpadEnter")) {
      e.preventDefault();
      toggleMeter();
      return;
    }

    if (active && active.tagName === "INPUT") {
      if (e.code === "Enter" || e.code === "NumpadEnter") {
        e.preventDefault();
        if (view.kind === "quiz" && view.picked === undefined) submitTyped(false);
        else { active.blur(); primaryAction(); }
      } else if (e.code === "Escape") {
        active.blur();
      }
      return;
    }

    if (!el.overlay.hidden) {
      if (e.code === "Space" || e.code === "Enter" || e.code === "NumpadEnter") {
        if (keyboardFocused(active)) return; // let the focused button do its own action
        e.preventDefault();
        closeOverlay("primary");
      }
      else if (e.code === "Escape") closeOverlay("secondary");
      return;
    }

    if (e.code === "Space" || e.code === "Enter" || e.code === "NumpadEnter") {
      if (keyboardFocused(active)) return; // Tab-focused button: the browser presses it
      e.preventDefault();
      if (active && active.tagName === "BUTTON") active.blur();
      primaryAction();
      return;
    }
    if (e.code === "ArrowRight") { e.preventDefault(); skipFromKey(); return; }

    const digit = /^(Digit|Numpad)([0-4])$/.exec(e.code);
    if (!digit) return;
    const n = Number(digit[2]);

    if (view.kind === "quiz" && view.picked === undefined) {
      e.preventDefault();
      if (n === 0) view.mode === "typed" ? submitTyped(true) : answerChoice(null);
      else if (view.mode === "mc" && n <= view.options.length) answerChoice(view.options[n - 1]);
    } else if (view.kind === "compare" && view.picked === undefined && (n === 1 || n === 2)) {
      e.preventDefault();
      answerBonus(n - 1);
    } else if (view.kind === "reverse" && view.picked === undefined && n >= 1 && n <= view.options.length) {
      e.preventDefault();
      answerBonus(n - 1);
    }
  });

  // =====================================================
  // INIT
  // =====================================================
  // A level that was unlocked under the old (too easy) rule goes back behind the level test.
  // Its progress is kept – it can still be opened manually.
  while (progress.currentLevel > 0 && !isUnlocked(progress.currentLevel)) progress.currentLevel--;
  initMeter();
  if (settings.rankIdx < 0) settings.rankIdx = rankIndex(knowledge().pct); // no celebration on first open
  applySectionUI();
  saveProgress();
  nextItem();
</script>
</body>
</html>
