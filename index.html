<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creek Academy – Building Flashcards</title>
<style>
  /* Dubai Creek at night: deep water, pearl light, champagne accents */
  :root {
    --bg: #07131A;
    --bg-glow: #0E2A31;
    --panel: #0E1D25;
    --panel2: #13262F;
    --line: #22363F;
    --line-soft: rgba(216, 190, 140, 0.16);
    --text: #EEF1EC;
    --muted: #8EA3A7;
    --gold: #D8BE8C;
    --gold-bright: #F1DDB2;
    --gold-deep: #A98B57;
    --success: #5CC2A6;
    --warning: #E5A85A;
    --wrong: #E0707A;
    /* kept for older references */
    --accent: var(--gold);
    --border: var(--line);

    --serif: "Didot", "Bodoni 72", "Bodoni MT", "Playfair Display", Georgia, serif;
    --sans: "Avenir Next", "Avenir", "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }

  body {
    background:
      radial-gradient(120% 60% at 50% -10%, var(--bg-glow) 0%, rgba(14, 42, 49, 0) 60%),
      radial-gradient(80% 50% at 100% 110%, rgba(216, 190, 140, 0.07) 0%, rgba(216, 190, 140, 0) 60%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
    padding: 28px 16px 32px;
    min-height: 100vh;
  }

  .app { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 14px; }

  /* ---------- Header ---------- */
  header { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
  .brand {
    font-family: var(--serif);
    font-size: 28px;
    font-weight: 400;
    letter-spacing: 0.02em;
    line-height: 1;
    background: linear-gradient(100deg, var(--gold-deep) 0%, var(--gold-bright) 45%, var(--gold) 70%, var(--gold-deep) 100%);
    background-size: 220% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: sheen 9s ease-in-out infinite;
  }
  @keyframes sheen { 0%, 100% { background-position: 100% 0; } 50% { background-position: 0 0; } }
  .subtitle { margin-top: 7px; font-size: 13px; color: var(--muted); letter-spacing: 0.02em; }

  select {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 12px;
    font-family: var(--sans);
    outline: none;
    cursor: pointer;
    max-width: 48%;
  }
  select:focus-visible { border-color: var(--gold); }

  /* ---------- Section tabs ---------- */
  .tabs {
    position: relative;
    display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px;
    background: rgba(14, 29, 37, 0.7); border: 1px solid var(--line); border-radius: 999px;
  }
  .tab {
    font-family: var(--sans); background: transparent; border: none; color: var(--muted);
    padding: 10px 6px; border-radius: 999px; font-size: 13px; font-weight: 600; letter-spacing: 0.02em;
    cursor: pointer; transition: background 0.35s var(--ease), color 0.35s var(--ease);
  }
  .tab:hover { color: var(--text); }
  .tab.active { background: linear-gradient(180deg, #1A323B, #13262F); color: var(--gold-bright); box-shadow: inset 0 0 0 1px var(--line-soft); }
  .tab:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  /* ---------- Knowledge meter (the hero) ---------- */
  .meter {
    position: relative;
    overflow: hidden;
    padding: 18px 20px 16px;
    border-radius: 20px;
    background: linear-gradient(160deg, rgba(216, 190, 140, 0.09) 0%, rgba(14, 29, 37, 0.9) 45%, rgba(14, 29, 37, 0.95) 100%);
    border: 1px solid var(--line-soft);
    cursor: pointer;
    text-align: left;
    width: 100%;
    font-family: var(--sans);
    color: var(--text);
    transition: border-color 0.3s var(--ease);
  }
  .meter:hover { border-color: rgba(216, 190, 140, 0.35); }
  .meter:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .meter-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .meter-caption { font-size: 12px; color: var(--muted); letter-spacing: 0.02em; }
  .meter-rank { margin-top: 2px; font-family: var(--serif); font-size: 30px; line-height: 1.1; color: var(--gold-bright); }
  .meter-pct { font-family: var(--serif); font-size: 40px; line-height: 1; color: var(--text); font-variant-numeric: lining-nums tabular-nums; }
  .meter-pct small { font-family: var(--sans); font-size: 15px; color: var(--muted); margin-left: 2px; }
  .meter-line { margin-top: 4px; font-size: 13px; color: var(--muted); }

  .meter-track { position: relative; margin-top: 16px; height: 8px; border-radius: 999px; background: rgba(238, 241, 236, 0.07); overflow: visible; }
  .meter-sits, .meter-solid { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 999px; transition: width 1.1s var(--ease); }
  .meter-sits { background: rgba(216, 190, 140, 0.3); }
  .meter-solid {
    background: linear-gradient(90deg, var(--gold-deep), var(--gold) 60%, var(--gold-bright));
    box-shadow: 0 0 14px rgba(241, 221, 178, 0.35);
    overflow: hidden;
  }
  .meter-solid::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.55) 50%, transparent 100%);
    transform: translateX(-100%);
    animation: glint 4.5s ease-in-out infinite;
  }
  @keyframes glint { 0%, 60% { transform: translateX(-100%); } 85%, 100% { transform: translateX(100%); } }
  .meter-tick { position: absolute; top: -3px; width: 1px; height: 14px; background: rgba(238, 241, 236, 0.18); }
  .meter-tick.reached { background: var(--gold); }
  .meter-ranks { position: relative; margin-top: 8px; height: 14px; font-size: 10px; color: var(--muted); }
  .meter-ranks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
  .meter-ranks span:first-child { transform: none; }
  .meter-ranks span:last-child { transform: translateX(-100%); }
  .meter-ranks span.reached { color: var(--gold); }

  .meter-legend { margin-top: 10px; display: flex; gap: 14px; font-size: 11px; color: var(--muted); }
  .meter-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
  .meter-legend .solid { background: var(--gold); }
  .meter-legend .soft { background: rgba(216, 190, 140, 0.35); }
  .meter-toggle { margin-left: auto; color: var(--gold); }

  .meter-details { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.45s var(--ease); }
  .meter.open .meter-details { grid-template-rows: 1fr; }
  .meter-details > div { overflow: hidden; }
  .breakdown { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
  .bd-row { display: grid; grid-template-columns: 124px 1fr 48px; align-items: center; gap: 12px; font-size: 13px; }
  .bd-name { color: var(--text); }
  .bd-bar { position: relative; height: 4px; border-radius: 999px; background: rgba(238, 241, 236, 0.07); overflow: hidden; }
  .bd-bar b, .bd-bar em { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 999px; transition: width 1s var(--ease); }
  .bd-bar em { background: rgba(216, 190, 140, 0.3); }
  .bd-bar b { background: var(--gold); }
  .bd-pct { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* ---------- Levels ---------- */
  .levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .levels.single { grid-template-columns: 1fr; }
  .level {
    font-family: var(--sans); text-align: left; padding: 11px 13px 12px; border-radius: 14px;
    background: rgba(14, 29, 37, 0.75); border: 1px solid var(--line); color: var(--text);
    cursor: pointer; transition: border-color 0.3s var(--ease), background 0.3s var(--ease), transform 0.2s var(--ease);
  }
  .level:hover { border-color: rgba(216, 190, 140, 0.4); }
  .level:active { transform: scale(0.98); }
  .level.active { border-color: rgba(216, 190, 140, 0.55); background: linear-gradient(180deg, rgba(216, 190, 140, 0.1), rgba(14, 29, 37, 0.8)); }
  .level.locked { opacity: 0.45; }
  .level.static { cursor: default; }
  .level.static:active { transform: none; }
  .level-num { font-size: 11px; color: var(--muted); }
  .level.active .level-num { color: var(--gold); }
  .level-title { margin-top: 2px; font-size: 15px; font-weight: 600; }
  .level-bar { margin-top: 9px; height: 3px; border-radius: 999px; background: rgba(238, 241, 236, 0.07); overflow: hidden; }
  .level-fill { height: 100%; background: linear-gradient(90deg, var(--gold-deep), var(--gold)); border-radius: 999px; transition: width 0.8s var(--ease); }
  .level-count { margin-top: 6px; font-size: 11px; color: var(--muted); }

  /* ---------- Stats ---------- */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .stat { padding: 2px 4px; text-align: center; border-left: 1px solid var(--line); }
  .stat:first-child { border-left: none; }
  .stat-label { font-size: 11px; color: var(--muted); }
  .stat-value { margin-top: 1px; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat.new .stat-value { color: var(--text); }
  .stat.learning .stat-value { color: var(--warning); }
  .stat.mastered .stat-value { color: var(--gold-bright); }
  .stat-value.bump { animation: bump 0.5s var(--ease); }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.3); color: var(--gold-bright); } 100% { transform: scale(1); } }

  /* ---------- Toolbar ---------- */
  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .toolbar-info { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .toolbar-info strong { color: var(--text); font-weight: 600; }
  .round-bar { display: inline-block; vertical-align: middle; width: 56px; height: 4px; margin-left: 6px; border-radius: 999px; background: rgba(238, 241, 236, 0.08); overflow: hidden; }
  .round-fill { display: block; height: 100%; background: var(--gold); border-radius: 999px; transition: width 0.5s var(--ease); }
  .toolbar-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    font-family: var(--sans); font-size: 12px; font-weight: 600;
    color: var(--muted); background: transparent; border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 12px; cursor: pointer;
    transition: border-color 0.25s var(--ease), color 0.25s var(--ease), background 0.25s var(--ease);
  }
  .chip:hover { border-color: rgba(216, 190, 140, 0.5); color: var(--text); }
  .chip:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .chip.on { color: var(--bg); border-color: var(--gold); background: var(--gold); }
  .chip.on.weak { color: var(--bg); border-color: var(--warning); background: var(--warning); }

  /* ---------- Card ---------- */
  .card {
    position: relative;
    min-height: 430px;
    background:
      radial-gradient(120% 70% at 50% 0%, rgba(216, 190, 140, 0.08) 0%, rgba(216, 190, 140, 0) 55%),
      linear-gradient(180deg, #13262F 0%, #0D1C23 100%);
    border: 1px solid var(--line-soft);
    border-radius: 26px;
    padding: 26px 24px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(241, 221, 178, 0.08);
  }
  .card::before {
    content: ""; position: absolute; top: 0; left: 18%; right: 18%; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent); opacity: 0.6;
  }
  .card.enter > * { animation: rise 0.55s var(--ease) both; }
  .card.enter > *:nth-child(2) { animation-delay: 0.04s; }
  .card.enter > *:nth-child(3) { animation-delay: 0.08s; }
  .card.enter > *:nth-child(4) { animation-delay: 0.12s; }
  .card.enter > *:nth-child(n+5) { animation-delay: 0.16s; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .card.flash-ok { animation: flashOk 0.9s var(--ease); }
  .card.flash-bad { animation: shake 0.42s ease; }
  @keyframes flashOk {
    0% { box-shadow: 0 0 0 0 rgba(92, 194, 166, 0.5), 0 30px 60px -20px rgba(0, 0, 0, 0.6); }
    100% { box-shadow: 0 0 0 26px rgba(92, 194, 166, 0), 0 30px 60px -20px rgba(0, 0, 0, 0.6); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-7px); }
    40% { transform: translateX(7px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }

  .card-top { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .card-area { font-size: 12px; color: var(--gold); letter-spacing: 0.04em; text-align: left; }
  .badge {
    font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--muted); white-space: nowrap;
  }
  .badge.new { color: var(--gold-bright); border-color: rgba(216, 190, 140, 0.45); }
  .badge.learning { color: var(--warning); border-color: rgba(229, 168, 90, 0.45); }
  .badge.mastered { color: var(--success); border-color: rgba(92, 194, 166, 0.45); }

  .card-name {
    margin-top: 26px;
    font-family: var(--serif);
    font-size: 40px;
    font-weight: 400;
    letter-spacing: 0.005em;
    line-height: 1.08;
    word-break: break-word;
    color: var(--text);
  }
  .card-name.area-q, .card-name.small { font-family: var(--sans); font-size: 22px; font-weight: 600; line-height: 1.3; letter-spacing: 0; }

  .client-label { margin-top: 20px; font-size: 12px; font-weight: 600; color: var(--warning); }
  .client-q { margin-top: 8px; font-family: var(--serif); font-size: 22px; line-height: 1.35; font-style: italic; color: var(--text); }
  .client-label + .card-name { margin-top: 8px; }

  .big-fact {
    margin-top: 26px; width: 100%; padding: 22px 16px; border-radius: 18px;
    background: rgba(7, 19, 26, 0.55); border: 1px solid var(--line);
  }
  .big-fact.ok { border-color: rgba(92, 194, 166, 0.55); }
  .fact-label { font-size: 12px; color: var(--muted); letter-spacing: 0.02em; }
  .big-value { margin-top: 8px; font-family: var(--serif); font-size: 44px; line-height: 1.1; word-break: break-word; color: var(--gold-bright); }
  .big-value.text { font-family: var(--sans); font-size: 19px; font-weight: 600; line-height: 1.4; color: var(--text); }
  .big-fact.ok .big-value { color: var(--success); }
  .fact-extra { margin-top: 4px; font-size: 12px; color: var(--muted); }

  .hint { margin-top: 14px; font-size: 14px; color: var(--muted); line-height: 1.5; max-width: 42ch; }
  .hint strong { color: var(--text); font-weight: 600; }

  .question { margin-top: 24px; font-size: 16px; font-weight: 600; color: var(--muted); }

  .options { margin-top: 16px; width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .options.single { grid-template-columns: 1fr; }

  /* typed answer */
  .type-template { margin-top: 22px; font-size: 18px; color: var(--muted); line-height: 1.45; }
  .type-template strong { color: var(--gold); letter-spacing: 0.1em; }
  .type-row { margin-top: 16px; width: 100%; display: flex; gap: 10px; }
  .answer-input {
    flex: 1; min-width: 0;
    font-family: var(--serif); font-size: 30px; text-align: center;
    color: var(--gold-bright); background: rgba(7, 19, 26, 0.7);
    border: 1px solid var(--line); border-radius: 16px; padding: 12px; outline: none;
    transition: border-color 0.25s var(--ease), box-shadow 0.25s var(--ease);
  }
  .answer-input::placeholder { color: rgba(142, 163, 167, 0.5); font-family: var(--sans); font-size: 16px; }
  .answer-input:focus { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(216, 190, 140, 0.12); }
  .answer-input.ok { border-color: var(--success); color: var(--success); }
  .answer-input.bad { border-color: var(--wrong); color: var(--wrong); }
  .type-note { margin-top: 10px; font-size: 13px; color: var(--muted); }

  /* ---------- Buttons ---------- */
  .btn {
    font-family: var(--sans); font-size: 14px; font-weight: 600;
    color: var(--text); background: rgba(19, 38, 47, 0.9);
    border: 1px solid var(--line); border-radius: 14px;
    padding: 12px 16px; cursor: pointer; user-select: none;
    transition: background 0.2s var(--ease), border-color 0.2s var(--ease), opacity 0.2s var(--ease), transform 0.12s var(--ease), color 0.2s var(--ease);
  }
  .btn:hover { border-color: rgba(216, 190, 140, 0.55); }
  .btn:active { transform: scale(0.97); }
  .btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .btn:disabled { cursor: default; }
  .btn:disabled:active { transform: none; }

  .opt { position: relative; min-height: 64px; padding: 16px 10px; font-size: 17px; line-height: 1.25; word-break: break-word; }
  .opt .key { position: absolute; top: 7px; left: 9px; font-size: 10px; color: rgba(142, 163, 167, 0.7); font-weight: 500; }
  .options.single .opt { min-height: 56px; padding: 14px 16px 14px 32px; font-size: 15px; font-weight: 500; text-align: left; }
  .options.single .opt .key { top: 50%; transform: translateY(-50%); left: 13px; }
  .opt.correct { border-color: var(--success); background: rgba(92, 194, 166, 0.14); color: var(--success); animation: pop 0.45s var(--ease); }
  .opt.incorrect { border-color: var(--wrong); background: rgba(224, 112, 122, 0.12); color: var(--wrong); }
  .opt.dim { opacity: 0.35; }
  @keyframes pop { 0% { transform: scale(1); } 45% { transform: scale(1.04); } 100% { transform: scale(1); } }

  .compare-opt { min-height: 100px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  .compare-name { font-family: var(--serif); font-size: 20px; font-weight: 400; }
  .compare-val { font-size: 13px; font-weight: 500; color: var(--muted); }
  .opt.correct .compare-val { color: var(--success); }
  .opt.incorrect .compare-val { color: var(--wrong); }

  .btn-primary {
    margin-top: 24px; width: 100%; max-width: 320px; padding: 16px; font-size: 15px; letter-spacing: 0.02em;
    color: #1A1408; border-color: transparent;
    background: linear-gradient(180deg, var(--gold-bright) 0%, var(--gold) 55%, var(--gold-deep) 100%);
    box-shadow: 0 10px 24px -10px rgba(216, 190, 140, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.4);
  }
  .btn-primary:hover { border-color: transparent; filter: brightness(1.06); }
  .type-row .btn-primary { margin-top: 0; width: auto; padding: 14px 22px; }

  .btn-link {
    margin-top: 12px; background: none; border: none; color: var(--muted);
    font-size: 13px; font-weight: 500; padding: 6px 10px;
    text-decoration: underline; text-decoration-color: rgba(142, 163, 167, 0.4); text-underline-offset: 4px;
  }
  .btn-link:hover { color: var(--text); }

  .result-line { margin-top: 16px; font-size: 16px; font-weight: 600; }
  .result-line.good { color: var(--success); }
  .result-line.low { color: var(--wrong); }

  .spacer { flex: 1; }

  .bottom { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .session { font-size: 12px; color: var(--muted); }
  .btn-skip { font-size: 13px; padding: 10px 16px; border-radius: 999px; background: transparent; }

  footer { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 8px; }
  .footer-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .btn-reset { font-size: 12px; padding: 7px 13px; color: var(--muted); background: transparent; border-radius: 999px; }
  .btn-reset:hover { color: var(--wrong); border-color: rgba(224, 112, 122, 0.5); }
  .btn-reset.neutral:hover { color: var(--text); border-color: rgba(216, 190, 140, 0.5); }
  .btn-undo { color: var(--success); border-color: rgba(92, 194, 166, 0.5); }
  .btn-undo:hover { color: var(--success); border-color: var(--success); }
  .keys { font-size: 11px; color: var(--muted); opacity: 0.7; text-align: center; line-height: 1.6; }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed; left: 50%; bottom: 28px; z-index: 20;
    transform: translateX(-50%) translateY(20px);
    background: rgba(19, 38, 47, 0.96); border: 1px solid rgba(216, 190, 140, 0.5); color: var(--gold-bright);
    font-size: 14px; font-weight: 600; padding: 11px 20px; border-radius: 999px;
    box-shadow: 0 16px 40px -12px rgba(0, 0, 0, 0.6);
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s var(--ease), transform 0.4s var(--ease);
    max-width: calc(100% - 32px); text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- Overlay ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 10;
    background: rgba(4, 11, 15, 0.8);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center; padding: 16px;
    animation: fadeIn 0.3s var(--ease);
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .overlay-box {
    position: relative; overflow: hidden;

  .overlay-kicker { font-size: 13px; color: var(--gold); }
  .overlay-title {

  .overlay-text { margin-top: 12px; font-size: 14px; color: var(--muted); line-height: 1.6; }

  .fx { position: fixed; inset: 0; pointer-events: none; z-index: 30; overflow: hidden; }
  .spark {
    position: absolute; width: 6px; height: 6px; border-radius: 50%;
    background: radial-gradient(circle, #FFF6DD 0%, var(--gold) 55%, rgba(216, 190, 140, 0) 70%);
    animation: spark 0.8s var(--ease) forwards;
  }
  @keyframes spark {
    0% { transform: translate(0, 0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0.2); opacity: 0; }
  }
  .dust {
    position: absolute; top: -12px; width: 7px; height: 7px; border-radius: 1px;
    background: linear-gradient(135deg, var(--gold-bright), var(--gold-deep));
    animation: fall var(--t) linear forwards;
  }
  @keyframes fall {
    0% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--dx), 105vh) rotate(var(--r)); opacity: 0.2; }

  // The same facts, phrased the way a client would ask (Client mode). Answers are unchanged.
  const AREA_CLIENT_QUESTIONS = {
