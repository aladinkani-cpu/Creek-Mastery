  // =====================================================
  // CHAPTERS – every module is split into levels ("chapters"); the last level of some modules is the final challenge
  // =====================================================
  function levelPool(li, useFilter) {
    const field = LEVELS[li].field;
    return buildings.filter(b => hasValue(b, field) && (!useFilter || filter === "all" || b.area === filter));
  }

  function lvlProg(section) {
    const s = section || activeSection;
    return s === "secondary" ? secProgress : s === "market" ? mktProgress : s === "community" ? comProgress : s === "lingo" ? lingProgress : s === "views" ? viewProgress : s === "objections" ? objProgress : s === "services" ? scProgress : progress;
  }
  function lvlDefs(section) {
    const s = section || activeSection;
    return s === "secondary" ? SECONDARY_LEVELS : s === "market" ? MARKET_LEVELS : s === "community" ? COMMUNITY_LEVELS : s === "lingo" ? LINGO_LEVELS : s === "views" ? VIEW_LEVELS : s === "objections" ? OBJ_LEVELS : s === "services" ? SC_LEVELS : LEVELS;
  }

  const SEC_FILTERS = {
    all: () => true,
    facts: f => f.type === "fact" || f.type === "single",
    scenarios: f => f.type === "scenario" || f.type === "risk",
    sequence: f => f.type === "sequence",
    client: f => f.type === "client"
  };
  function secMatchesFilter(f) { return (SEC_FILTERS[secFilter] || SEC_FILTERS.all)(f); }

  // All learnable items of one level (useFilter: respect the dropdown)
  function mktMatchesFilter(f) { return mktFilter === "all" || f.building === mktFilter; }
  function comMatchesFilter(f) { return comFilter === "all" || f.classification === comFilter; }
  function scMatchesFilter(f) { return scFilter === "all" || f.tags.includes(scFilter); }
  function objMatchesFilter(f) { return objFilter === "all" || f.tags.includes(objFilter); }
  function viewMatchesFilter(f) { return viewFilter === "all" || f.cats.includes(viewFilter); }
  function lingMatchesFilter(f) { return lingFilter === "all" || (lingFilter === "client" ? !!f.client : f.type === lingFilter); }

  function levelItems(li, useFilter, section) {
    section = section || activeSection;
    if (section === "market") {
      const final = MARKET_LEVELS[li] && MARKET_LEVELS[li].final;
      // the final level has no new items: it reviews everything testable from levels 1–9
      return marketFacts.filter(f => (final ? !f.orientation : f.level === li + 1) && (!useFilter || mktMatchesFilter(f)))
        .map(f => ({ type: "m", id: f.id, fact: f }));
    }
    if (section === "services") {
      const final = SC_LEVELS[li] && SC_LEVELS[li].final;
      return scFacts.filter(f => (final ? f.kind !== "rule" : f.level === li + 1) && (!useFilter || scMatchesFilter(f)))
        .map(f => ({ type: "g", id: f.id, fact: f }));
    }
    if (section === "objections") {
      const final = OBJ_LEVELS[li] && OBJ_LEVELS[li].final;
      return objFacts.filter(f => (final || f.level === li + 1) && (!useFilter || objMatchesFilter(f)))
        .map(f => ({ type: "o", id: f.id, fact: f }));
    }
    if (section === "views") {
      const final = VIEW_LEVELS[li] && VIEW_LEVELS[li].final;
      return viewFacts.filter(f => (final || f.level === li + 1) && (!useFilter || viewMatchesFilter(f)))
        .map(f => ({ type: "v", id: f.id, fact: f }));
    }
    if (section === "lingo") {
      const final = LINGO_LEVELS[li] && LINGO_LEVELS[li].final;
      return brokerLingo.filter(f => (final || f.level === li + 1) && (!useFilter || lingMatchesFilter(f)))
        .map(f => ({ type: "l", id: f.id, fact: f }));
    }
    if (section === "community") {
      const final = COMMUNITY_LEVELS[li] && COMMUNITY_LEVELS[li].final;
      // the final exam level has no new items: it reviews everything from levels 1–10
      return communityFacts.filter(f => (final || f.level === li + 1) && (!useFilter || comMatchesFilter(f)))
        .map(f => ({ type: "c", id: f.id, fact: f }));
    }
    if (section === "secondary") {
      return secondaryFacts.filter(f => f.level === li + 1 && (!useFilter || secMatchesFilter(f)))
        .map(f => ({ type: "s", id: f.id, fact: f }));
    }
    const field = LEVELS[li].field;
    return levelPool(li, useFilter).map(b => ({ type: "b", id: b.id, b, field }));
  }

  // Items that count for completion and level tests (orientation-only items never block progress)
  function requiredItems(li, section) { return levelItems(li, false, section).filter(i => !(i.fact && i.fact.orientation)); }

  function levelSits(li, section) {
    const items = requiredItems(li, section);
    const sits = items.filter(i => { const st = stateOf(i); return st.seen && st.box >= SITS_BOX; }).length;
    return { sits, total: items.length };
  }



  // Chapters = the non-final levels of a module. A chapter opens once the previous one is taught (acquired);
  // the old final-exam levels live on as optional module challenges.
  function chapterCount(section) { return lvlDefs(section).filter(d => !d.final).length; }
  function finalLevelIdx(section) { return lvlDefs(section).findIndex(d => d.final); }
  function isUnlocked(li, section) { return li <= Math.max(0, lvlProg(section).reached); }
  function levelAcquired(li, section) {
    const items = requiredItems(li, section);
    if (!items.length) return true;
    let seen = 0, sits = 0;
    items.forEach(i => { const st = stateOf(i); if (st.seen) { seen++; if (st.box >= SITS_BOX) sits++; } });
    return seen === items.length && sits >= Math.ceil(items.length * ACQUIRE_SHARE - 1e-9);
  }
  // open every chapter whose predecessor is taught – returns the newly opened chapter (or -1)
  function refreshUnlocks(section) {
    const p = lvlProg(section), last = chapterCount(section) - 1;
    let opened = -1;
    while (p.reached < last && levelAcquired(p.reached, section)) { p.reached++; opened = p.reached; }
    return opened;
  }

  // =====================================================
  // ITEMS – one learnable fact. Buildings and Area use the same engine.
  // =====================================================
  function sectionItems() { return levelItems(lvlProg().currentLevel, !journeyOn); }

  // What the scheduler may show: the open chapter, plus items from every other chapter that are still
  // being learned, due for review or weak spots – so nothing learned is ever forgotten.
  function schedulingItems() {
    const items = sectionItems();
    const have = new Set(items.map(i => i.id));
    const now = Date.now();
    const defs = lvlDefs();
    defs.forEach((d, li) => {
      if (d.final || li === lvlProg().currentLevel) return;
      levelItems(li, !journeyOn).forEach(it => {
        const key = it.type === "b" ? it.b.id + ":" + it.field : it.id;
        const st = stateOf(it);
        if (!have.has(key) && st.seen && (isLearning(st) || isReviewDue(st, now) || isWeak(st, now))) {
          items.push(it.type === "b" ? { type: "b", id: key, bid: it.b.id, b: it.b, field: it.field } : it);
          have.add(key);
        }
      });
    });
    return items;
  }

  function stateOf(item) {
    if (item.type === "a") return areaState(item.id);
    if (item.type === "s") return secState(item.id);
    if (item.type === "m") return mktState(item.id);
    if (item.type === "c") return comState(item.id);
    if (item.type === "l") return lingState(item.id);
    if (item.type === "v") return viewState(item.id);
    if (item.type === "o") return objState(item.id);
    if (item.type === "g") return scState(item.id);
    return factState(item.bid || item.id, item.field);
  }
  function sectionProgress() { return lvlProg(activeSection); }
  // what the question asks for: unit counts are asked as rounded bands (~550) – the exact value stays in the answer box
  function correctAnswer(item) {
    if (item.type !== "b") return item.fact.answer;
    return numericLearningMode(item) === "approxBand" ? unitsAnchorLabel(item.b) : answerOf(item.b, item.field);
  }
  function catOf(item) { return item.type === "b" ? levelForField(item.field).title : item.fact.category; }
  function difficultyOf(item) { return item.fact && item.fact.difficulty ? item.fact.difficulty : 0; }

  function statusOf(item) {
    const s = stateOf(item);
    if (!s.seen) return "new";
    return s.box >= MASTERED_BOX ? "mastered" : "learning";
  }

  function isLearning(s) { return s.seen && s.box < SITS_BOX; }
  function isReviewDue(s, now) { return s.seen && s.box >= SITS_BOX && s.dueAt <= now; }
  function isWeak(s, now) { return s.seen && s.lastWrongAt > 0 && now - s.lastWrongAt < WEAK_DAYS * DAY && s.box < MASTERED_BOX; }

  function dueNowCount(items) {
    const now = Date.now();
    return items.filter(i => { const s = stateOf(i); return isLearning(s) || isReviewDue(s, now); }).length;
  }

  // =====================================================
  // SCHEDULER (spaced repetition: card-based while learning, time-based once a fact sits)
  // =====================================================
  function pickNextItem(noNew) {
    const items = schedulingItems();
    if (items.length === 0) return { reason: "empty" };
    const prog = sectionProgress();
    const rc = prog.reviewCount;
    const now = Date.now();
    const notLast = list => list.filter(i => i.id !== lastId);

    if (weakMode[activeSection]) {
      const weak = items.filter(i => isWeak(stateOf(i), now));
      if (!weak.length) return { reason: "no-weak" };
      const pool = notLast(weak).length ? notLast(weak) : weak;
      const keysOf = i => [catOf(i)].concat(i.fact && i.fact.building ? ["building:" + i.fact.building] : []);
      const catWrong = {};
      weak.forEach(i => keysOf(i).forEach(k => { catWrong[k] = (catWrong[k] || 0) + stateOf(i).wrongCount; }));
      const ranked = pool.map(i => ({ i, score: stateOf(i).wrongCount + keysOf(i).reduce((a, k) => a + catWrong[k], 0) * 0.5 + Math.random() * 0.1 }))
        .sort((a, b) => b.score - a.score);
      return { item: pick(ranked.slice(0, 3).map(x => x.i)) };
    }

    // 1) facts still being learned that are due now
    const dueLearning = notLast(items.filter(i => { const s = stateOf(i); return isLearning(s) && s.due <= rc; }));
    if (dueLearning.length) return { item: pick(dueLearning) };

    // 2) reviews whose time has come (real elapsed days)
    const dueReviews = notLast(items.filter(i => isReviewDue(stateOf(i), now)));
    if (dueReviews.length) return { item: pick(dueReviews) };

    // 3) a new fact, if fewer than MAX_LEARNING are in progress
    const seen = items.filter(i => stateOf(i).seen);
    const unseen = items.filter(i => !stateOf(i).seen);
    const learningCount = seen.filter(i => isLearning(stateOf(i))).length;
    if (!noNew && unseen.length && (learningCount < MAX_LEARNING || seen.length === 0)) {
      const ordered = unseen.slice().sort((a, b) => difficultyOf(a) - difficultyOf(b));
      const freshFirst = ordered.filter(i => i.id !== lastId);
      return { item: freshFirst[0] || ordered[0] };
    }

    // 4) learning facts that are not due yet (keeps the learning phase going)
    const learning = items.filter(i => isLearning(stateOf(i)));
    const learningNotLast = notLast(learning);
    if (learningNotLast.length) {
      const minDue = Math.min(...learningNotLast.map(i => stateOf(i).due));
      return { item: pick(learningNotLast.filter(i => stateOf(i).due === minDue)) };
    }

    // 5) "practice anyway": reviews that are not due yet, soonest first
    if (practiceAnyway[activeSection] && seen.length) {
      const pool = notLast(seen).length ? notLast(seen) : seen;
      const sorted = pool.slice().sort((a, b) => stateOf(a).dueAt - stateOf(b).dueAt);
      return { item: pick(sorted.slice(0, 3)) };
    }

    if (learning.length) return { item: learning[0] };
    return { reason: "done" };
  }

  // a genuinely close approximate number (e.g. 25 for a 24 anchor): no strength gain, no reset, no weak spot – it simply comes back soon
  const CLOSE_RETRY_MS = 10 * 60 * 1000;
  function applyClose(item) {
    const s = stateOf(item), prog = progOfItem(item);
    if (s.box < SITS_BOX) { s.due = prog.reviewCount + LEARN_STEPS[Math.min(s.box, LEARN_STEPS.length - 1)]; s.dueAt = 0; }
    else s.dueAt = Date.now() + CLOSE_RETRY_MS;
    prog.reviewCount++;
  }

  function applyResult(item, correct) {
    const s = stateOf(item);
    const prog = progOfItem(item);
    const now = Date.now();
    const notDueYet = s.box >= SITS_BOX && s.dueAt > now; // extra practice of a review that is not due

    if (correct) {
      if (!notDueYet) {
        s.box = Math.min(s.box + 1, MAX_BOX);
        if (s.box < SITS_BOX) {
          s.due = prog.reviewCount + LEARN_STEPS[s.box];
          s.dueAt = 0;
        } else {
          s.due = prog.reviewCount;
          s.dueAt = now + REVIEW_DAYS[s.box] * DAY;          // real elapsed time – 1 / 3 / 7 / 14 days, no midnight edge
        }
      }
      if (s.box >= SITS_BOX) s.lastWrongAt = 0; // relearned → no longer a weak spot
    } else if (item.fact && item.fact.orientation) {
      // lower-confidence orientation item: step back gently, no weak-spot penalty
      s.box = Math.max(0, s.box - 1);
      s.due = prog.reviewCount + LEARN_STEPS[Math.min(s.box, LEARN_STEPS.length - 1)];
      s.dueAt = 0;
    } else {
      s.box = 0;
      s.due = prog.reviewCount + LEARN_STEPS[0];
      s.dueAt = 0;
      s.wrongCount++;
      s.lastWrongAt = now;
    }
    prog.reviewCount++;
  }

  // =====================================================
  // QUESTION BUILDING
  // =====================================================
  // Typed recall – ONLY where the numeric policy allows it. Nothing reaches the keyboard without numericLearningMode():
  // handover years / simple floor counts / key percentages exactly, service-charge rates as ≈ anchors; never prices, rents or unit counts.
  function typedSpec(item) {
    const mode = numericLearningMode(item);
    if (mode === "approxTyped") return item.type === "g" ? scTypedSpec(item) : null;
    if (mode !== "exactTyped") return null;
    if (item.type === "a" || item.type === "s") {
      if (item.type === "s" && (item.fact.type !== "fact" || item.fact.answer.length > 40)) return null;
      const answer = item.fact.answer;
      const tokens = answer.match(/\d[\d.,]*\d|\d/g) || [];
      if (tokens.length !== 1) return null;
      return { canonical: normalizeNumber(tokens[0]), template: answer.replace(tokens[0], "___"), decimal: tokens[0].includes(".") };
    }
    const value = answerOf(item.b, item.field);
    if (item.field === "completion") return { canonical: digitsOnly(value), template: "" };
    if (item.field === "floors" && /^\d{1,2}$/.test(String(value).trim())) return { canonical: String(value).trim(), template: "" };
    return null;
  }

  function makeOptions(item, hard) {
    const s = stateOf(item);
    const strong = hard || s.box >= 2;
    if (item.type !== "b") {
      const f = item.fact;
      if (f.order) return f.order.slice(); // e.g. below / within / above / far above – keep the natural order
      const wrong = (strong && f.close) ? f.close : f.distractors;
      return shuffle([f.answer, ...wrong.slice(0, 3)]);
    }
    if (numericLearningMode(item) === "approxBand") return unitBandOptions(item, strong);
    const field = item.field;
    const correct = answerOf(item.b, field);
    const pool = [...new Set(buildings.filter(x => hasValue(x, field)).map(x => answerOf(x, field)))].filter(v => v !== correct);
    let distractors;
    if (strong) {
      const target = numericAnswer(field, correct);
      const scored = pool.map(v => {
        const val = numericAnswer(field, v);
        return { v, dist: (target === null || val === null) ? 99999 : Math.abs(val - target) };
      }).sort((a, c) => a.dist - c.dist);
      distractors = shuffle(scored.slice(0, 5).map(x => x.v)).slice(0, 3);
    } else {
      distractors = shuffle(pool).slice(0, 3);
    }
    return shuffle([correct, ...distractors]);
  }

  // unit counts as bands: early on clearly different bands (~250 · ~550 · ~900), later the neighbouring bands
  function unitBandOptions(item, strong) {
    const own = numericAnchor(unitsValue(item.b.units), "units"), correct = unitsAnchorLabel(item.b);
    const seen = new Set([own]);
    const pool = [];
    buildings.filter(x => hasValue(x, "units") && unitsValue(x.units) !== null).forEach(x => {
      const a = numericAnchor(unitsValue(x.units), "units");
      if (!seen.has(a)) { seen.add(a); pool.push({ a, label: unitsAnchorLabel(x) }); }
    });
    let picks;
    if (strong) picks = shuffle(pool.sort((p, q) => Math.abs(p.a - own) - Math.abs(q.a - own)).slice(0, 4)).slice(0, 3);
    else {
      const far = pool.filter(p => Math.abs(p.a - own) >= Math.max(150, own * 0.3));
      picks = shuffle(far.length >= 3 ? far : pool).slice(0, 3);
      // keep the bands spread out
      if (far.length >= 3) { const sorted = far.sort((p, q) => p.a - q.a); const k = sorted.length; picks = shuffle([sorted[0], sorted[Math.floor(k / 2)], sorted[k - 1]]); }
    }
    return shuffle([correct].concat(picks.map(p => p.label)));
  }

  // Bonus: compare two buildings (only buildings already learned in this level)
  function makeCompare(lv) {
    const pool = levelPool(progress.currentLevel, true)
      .filter(b => factState(b.id, lv.field).seen && numericAnswer(lv.field, answerOf(b, lv.field)) !== null);
    if (pool.length < 2) return null;
    for (let attempt = 0; attempt < 30; attempt++) {
      const [a, b] = shuffle(pool).slice(0, 2);
      const va = numericAnswer(lv.field, answerOf(a, lv.field));
      const vb = numericAnswer(lv.field, answerOf(b, lv.field));
      if (va === vb) continue;
      if (lv.field === "units" && numericAnchor(va, "units") === numericAnchor(vb, "units")) continue;   // no precision traps (559 vs 556)
      const aWins = lv.higherWins ? va > vb : va < vb;
      return { kind: "compare", lv, a, b, winnerId: aWins ? a.id : b.id, picked: undefined };
    }
    return null;
  }

  // Bonus: reverse question – given the value, which building is it?
  function makeReverse(lv) {
    const learned = levelPool(progress.currentLevel, true).filter(b => factState(b.id, lv.field).seen);
    if (!learned.length) return null;
    for (let attempt = 0; attempt < 20; attempt++) {
      const target = pick(learned);
      const bands = lv.field === "units";
      const value = bands ? unitsAnchorLabel(target, true) : answerOf(target, lv.field);
      const others = shuffle(buildings.filter(b => hasValue(b, lv.field) && b.id !== target.id &&
        (bands ? unitsValue(b.units) !== null && numericAnchor(unitsValue(b.units), "units") !== numericAnchor(unitsValue(target.units), "units") : answerOf(b, lv.field) !== value)));
      if (others.length < 3) continue;
      return { kind: "reverse", lv, target, value, options: shuffle([target, ...others.slice(0, 3)]), picked: undefined };
    }
    return null;
  }

  // =====================================================
  // FLOW – one endless loop: pick → show → answer → update → recalculate. The player decides when to stop.
  // =====================================================
  function clearTimer() {
    if (advanceTimer) { clearTimeout(advanceTimer); advanceTimer = null; }
  }

  function nextItem() {
    clearTimer();
    play.brokenShow = false;
    if (test) { nextTestItem(); return; }
    if (sessionGate()) return;                         // a finished mission / interim debrief or a special event takes this slot
    if (journeyOn) { journeyNext(); return; }
    const r = sectionStep(false);
    if (!r.ok) { view = { kind: r.reason }; render(); }
  }

  // shows the next card of the active module – returns { ok } or { ok: false, reason }
  function sectionStep(noNew) {
    if (activeSection === "buildings" && !weakMode.buildings && bonusState.since >= BONUS_EVERY) {
      const lv = LEVELS[progress.currentLevel];
      const bonus = bonusState.toggle % 2 === 0 ? (makeCompare(lv) || makeReverse(lv)) : (makeReverse(lv) || makeCompare(lv));
      if (bonus) {
        bonusState.since = 0;
        bonusState.toggle++;
        view = bonus;
        render();
        return { ok: true };
      }
    }
    const next = pickNextItem(noNew);
    if (!next.item) return { ok: false, reason: next.reason };
    showItem(next.item);
    return { ok: true };
  }

  function showItem(item) {
    clearTimer();                                       // a pending auto-next never overrides a card that is already shown
    lastId = item.id;
    const s = stateOf(item);
    if (!s.seen) {
      view = { kind: "intro", item };
    } else if (item.type === "g" && item.fact.kind === "rate") {
      // service-charge rates: anchor MC → reverse (unique anchors only) → typed ≈ whole-AED broker anchor (correct ±0.5 · close ±1.5)
      const asked = scAsk(item, scLearnKind(s, item.fact));
      const spec = typedSpec(asked);
      view = spec
        ? { kind: "quiz", mode: "typed", item: asked, spec, picked: undefined, correct: undefined }
        : { kind: "quiz", mode: "mc", item: asked, options: makeOptions(asked), picked: undefined, correct: undefined };
    } else if (item.type === "o") {
      const asked = objAsk(item, objLearnKind(s, progOfItem(item).reviewCount));
      view = { kind: "quiz", mode: "mc", item: asked, options: makeOptions(asked), picked: undefined, correct: undefined };
    } else if (item.type === "l") {
      // Broker Lingo: recognise first, then recall (fill the gap / meaning → term) once it gets stronger
      const asked = lingoAsk(item, s.box >= TYPE_BOX ? 2 : 1);
      view = { kind: "quiz", mode: "mc", item: asked, options: makeOptions(asked), picked: undefined, correct: undefined };
    } else if (isMarketRecall(item)) {
      // market sale / rent ranges: anchors and simplified bands – the exact range is revealed afterwards
      const asked = mktAsk(item, mktLearnKind(s));
      view = { kind: "quiz", mode: "mc", item: asked, options: makeOptions(asked), picked: undefined, correct: undefined };
    } else {
      const spec = s.box >= TYPE_BOX ? typedSpec(item) : null;
      view = spec
        ? { kind: "quiz", mode: "typed", item, spec, picked: undefined, correct: undefined }
        : { kind: "quiz", mode: "mc", item, options: makeOptions(item), picked: undefined, correct: undefined };
    }
    if (view.kind === "quiz") view.t0 = Date.now();      // Instant-Recall clock (starts when the card is shown)
    render();
  }

  function finishIntro() {
    if (view.kind !== "intro") return;
    const s = stateOf(view.item);
    const prog = progOfItem(view.item);
    s.seen = true;
    s.box = 0;
    s.due = prog.reviewCount + 2;
    s.dueAt = 0;
    prog.reviewCount++;
    play.round.count++;
    if (journeyOn && focus) focus.n++;
    timerTouch();
    saveProgress();
    nextItem();
  }

  function answerChoice(value) {
    if (view.kind !== "quiz" || view.mode !== "mc" || view.picked !== undefined) return;
    view.picked = value;
    finishAnswer(value === correctAnswer(view.item));
  }

  function submitTyped(giveUp) {
    if (view.kind !== "quiz" || view.mode !== "typed" || view.picked !== undefined) return;
    const input = document.getElementById("answerInput");
    const typed = giveUp ? "" : (input && input.value ? String(input.value).trim() : "");
    if (!giveUp && !typed) { showToast("Type an answer – or tap “I don't know”"); return; }
    view.picked = giveUp ? null : typed;
    if (view.spec.approx) {
      // approximate anchors: correct · close (no strength gain, no reset) · wrong
      const verdict = giveUp ? "wrong" : judgeNumeric(view.spec, typed);
      finishAnswer(verdict === "correct", verdict === "close");
      return;
    }
    finishAnswer(!giveUp && normalizeNumber(typed) === normalizeNumber(view.spec.canonical));
  }

  function finishAnswer(correct, close) {
    close = !correct && !!close;                                       // only approximate numeric answers can be "close"
    if (view.test) { finishTestAnswer(correct, close); return; }
    view.correct = correct;
    view.close = close;
    const item = view.item, now = Date.now();
    const before = stateOf(item);
    const prevBox = before.box, wasWeak = isWeak(before, now);
    const wasDue = !(before.box >= SITS_BOX && before.dueAt > now);   // an early repeat of a delayed review is extra practice
    const approx = !!(view.spec && view.spec.approx);
    const instant = correct && wasDue && isInstantRecall(prevBox);    // measured before anything re-renders
    if (close) applyClose(item); else applyResult(item, correct);
    if (activeSection === "buildings") bonusState.since++;
    play.round.count++;
    registerAnswer(correct, item, false, close);
    if (journeyOn) { journeyAnswers++; sinceMixed++; if (focus) focus.n++; if (!focus || focus.kind !== "new") sinceNew++; }
    const section = MODULE_OF_TYPE[item.type];
    const opened = refreshUnlocks(section);
    advanceCurriculum();
    // 1) every XP / progression mutation of this answer …
    const fb = close ? metaClose() : metaAnswer(correct, item, prevBox, wasWeak, view.mode === "typed", wasDue, instant);
    if (approx && fb.ok && !fb.quiet && !fb.recovered && !fb.milestone && !fb.instant) fb.sub = "BROKER ANCHOR LOCKED";
    const chapter = opened >= 0 ? chapterOpened(section, opened) : null;
    const lv = levelSync(true);
    const mission = missionTrack(fb, correct, close);   // session mission + debrief stats (persisted with the save)
    saveProgress();
    // 2) … then one UI sync, 3) then the rewards in priority order (answer → level-up / ascension → chapter → mission ring)
    view.prevBox = prevBox;
    view.autoNext = correct && prevBox >= AUTO_NEXT_MIN_BOX && !(lv && lv.kind === "ascension");
    render();
    if (!close) pulse(correct);
    const minDelay = playRewards(fb, lv, chapter);
    if (mission) missionRingFX(mission);
    // AUTO-NEXT: a known card answered correctly moves on by itself in every module (tap the card to hold it);
    // not-yet-known cards: Buildings move on, explanation modules wait for "Continue"
    if (correct && !(lv && lv.kind === "ascension")) {
      const delay = view.autoNext ? AUTO_NEXT_MS : activeSection === "buildings" ? AUTO_ADVANCE_MS : 0;
      if (delay) advanceTimer = setTimeout(nextItem, Math.max(delay, minDelay));
    }
  }

  // ---------- Instant Recall: fast AND correct on knowledge that already exists (strength 2+). Never on new cards,
  // never on a mere early repeat, never if the app was in the background. The limit grows with what there is to read.
  function irLimitMs(v) {
    const f = (v.item && v.item.fact) || {};
    const text = (f.client || f.question || (v.item && v.item.field ? (levelForField(v.item.field) || {}).question : "") || "") + " " + (v.options || []).join(" ");
    let ms = IR_BASE_MS + text.length * IR_PER_CHAR_MS;
    ms = Math.max(IR_MIN_MS, Math.min(IR_MAX_MS, ms));
    return v.mode === "typed" ? ms + IR_TYPED_EXTRA_MS : ms;
  }
  if (typeof document.addEventListener === "function") document.addEventListener("visibilitychange", () => { if (document.hidden && view) view.timeVoid = true; });
  function isInstantRecall(prevBox) {
    if (prevBox < IR_MIN_BOX || !view.t0 || view.timeVoid) return false;
    const took = Date.now() - view.t0 - IR_READY_MS;
    return took <= irLimitMs(view);
  }

  // a chapter is acquired → the next one opens: +40 XP (counted in the session / debrief) and a short milestone
  function chapterOpened(section, li) {
    const xp = 40;
    awardXP(xp);
    play.round.xp += xp;
    const defs = lvlDefs(section);
    const cleared = defs[li - 1] || defs[li];
    // free practice: move straight on to the newly opened chapter
    if (!journeyOn && section === activeSection && lvlProg(section).currentLevel === li - 1) { lvlProg(section).currentLevel = li; renderLevels(); }
    return { section, li, xp, title: cleared ? cleared.title : "", next: defs[li] ? defs[li].title : "" };
  }

  function answerBonus(index) {
    if ((view.kind !== "compare" && view.kind !== "reverse") || view.picked !== undefined) return;
    let correct;
    if (view.kind === "compare") {
      view.picked = index === 0 ? view.a.id : view.b.id;
      correct = view.picked === view.winnerId;
    } else {
      const chosen = view.options[index];
      if (!chosen) return;
      view.picked = chosen.id;
      correct = chosen.id === view.target.id;
    }
    play.round.count++;
    registerAnswer(correct, null);
    timerTouch();
    const xp = correct ? 5 + comboBonus() : 0;
    if (correct) { awardXP(xp); play.round.xp += xp; }
    saveProgress();
    render();
    pulse(correct);
    if (correct) playCorrectFX({ label: "BONUS", sub: comboText().replace(" · ", ""), tier: isComboMilestone(play.combo) ? 3 : 1, xp, milestone: isComboMilestone(play.combo) });
    else playWrongFX("MISSED", comboBrokeText());
  }

  // accuracy per module + the session combo
  function registerAnswer(correct, item, inTest, close) {
    const p = item ? progOfItem(item) : sectionProgress();
    p.answered = (p.answered || 0) + 1;
    if (close) { play.answered++; if (!inTest) play.round.answered++; return; }   // close: counted, the combo is held (no break, no gain)
    if (correct) p.correct = (p.correct || 0) + 1;
    play.answered++;
    if (!inTest) play.round.answered++;
    play.lastBroken = 0;
    play.brokenShow = false;
    if (correct) {
      play.correct++;
      if (!inTest) play.round.correct++;
      play.combo++;
      if (play.combo > meta().bestCombo) meta().bestCombo = play.combo;
    } else {
      play.lastBroken = play.combo;
      play.brokenShow = play.combo >= 3;
      play.combo = 0;
    }
  }
  // small XP bonus at combo milestones (5, 10, 15 …)
  function comboBonus() { return play.combo > 0 && play.combo % 5 === 0 ? (play.combo % 10 === 0 ? 25 : 10) : 0; }
  function comboText() { return play.combo >= 2 ? " · COMBO x" + play.combo : ""; }
  function comboBrokeText() { return play.lastBroken >= 3 ? "COMBO x" + play.lastBroken + " BROKEN" : "RETURNED TO TRAINING"; }
  // combo presentation tiers (the combo itself is unchanged: consecutive correct answers in this session)
  const COMBO_TIERS = [[30, "SYSTEM SYNC"], [20, "ELITE RHYTHM"], [10, "FOCUS LOCKED"], [5, "MOMENTUM"]];
  function comboTier(n) { return COMBO_TIERS.find(x => n >= x[0]) || null; }
  function isComboMilestone(n) { return n === 5 || n === 10 || n === 20 || (n >= 30 && n % 10 === 0); }


  // =====================================================
  // OVERLAY (ascension, boss results, module challenge results)
  // =====================================================
  function showOverlay(o) {
    clearTimer();
    el.overlayKicker.textContent = o.kicker;
    el.overlayTitle.textContent = o.title;
    el.overlayText.textContent = o.text;
    el.overlayPrimary.textContent = o.primary;
    el.overlaySecondary.textContent = o.secondary || "";
    el.overlaySecondary.hidden = !o.secondary;
    el.overlayArt.innerHTML = o.art || "";
    el.overlayArt.hidden = !o.art;
    el.overlayBox.className = "overlay-box" + (o.tone ? " " + o.tone : "");
    el.overlay.classList.toggle("deep", o.tone === "ascension");
    overlayActions = { primary: o.onPrimary, secondary: o.onSecondary };
    el.overlay.hidden = false;
  }

  function closeOverlay(which) {
    el.overlay.hidden = true;
    const action = which === "primary" ? overlayActions.primary : overlayActions.secondary;
    overlayActions = { primary: null, secondary: null };
    if (action) action();
    else nextItem();
  }

  function setLevel(li) {
    cancelTest();
    lvlProg().currentLevel = li;
    saveProgress();
    lastId = null;
    bonusState.since = 0;
    nextItem();
  }

  function onLevelClick(li) {
    if (li === lvlProg().currentLevel) return;
    if (!isUnlocked(li)) {
      const prev = levelSits(li - 1);
      showToast("Chapter " + (li + 1) + " opens once Chapter " + li + " is taught (" + prev.sits + " / " + prev.total + " sit)");
      return;
    }
    journeyOn = false;
    focus = null;
    setLevel(li);
  }

  // =====================================================
  // MODULE CHALLENGES – optional. One pass through a chapter (or the module final), no hints, 90 %.
  // They never gate anything: only the Agent bosses do.
  // =====================================================
  function testNeed(total) { return Math.ceil(total * TEST_PASS); }

  function challengeTarget(section) {
    const fin = finalLevelIdx(section);
    const all = lvlDefs(section).every((d, li) => d.final || levelAcquired(li, section));
    if (fin >= 0 && all) return { li: fin, final: true };
    return { li: lvlProg(section).currentLevel, final: false };
  }

  function finalSample(section) {
    return section === "market" ? marketFinalSample().map(f => ({ type: "m", id: f.id, fact: f }))
      : section === "services" ? scFinalSample()
      : section === "objections" ? objFinalSample()
      : section === "views" ? viewFinalSample().map(f => ({ type: "v", id: f.id, fact: f }))
      : section === "lingo" ? lingoFinalSample()
      : section === "community" ? comFinalSample().map(f => ({ type: "c", id: f.id, fact: f }))
      : shuffle(allLearnItems().filter(i => MODULE_OF_TYPE[i.type] === section)).slice(0, 30);
  }

  function startTest() {
    const tg = challengeTarget(activeSection);
    if (!tg.final) {
      const items = requiredItems(tg.li);
      const seen = items.filter(i => stateOf(i).seen).length;
      if (seen < items.length) { showToast("Meet every item of this chapter first (" + seen + " / " + items.length + ")"); return; }
    }
    clearTimer();
    el.overlay.hidden = true;
    weakMode[activeSection] = false;
    setMode("train");
    test = { section: activeSection, li: tg.li, final: tg.final, challenge: true, idx: 0, correct: 0, missed: [], missedMods: [],
      items: tg.final ? finalSample(activeSection) : shuffle(requiredItems(tg.li)) };
    timerTouch(true);
    lastId = null;
    nextItem();
  }

  function cancelTest(message) {
    if (!test) return;
    test = null;
    if (message) showToast(message);
  }

  function nextTestItem() {
    if (test.idx >= test.items.length) { finishTest(); return; }
    const hard = !!test.boss;
    let it = test.items[test.idx];
    if (it.type === "o" && !it.base) it = objAsk(it, pick(hard ? OBJ_BOSS_KINDS : OBJ_TEST_KINDS));
    if (it.type === "l" && !it.base) it = lingoAsk(it, hard || Math.random() < 0.5 ? 2 : 1);
    if (isMarketRecall(it) && !it.base) it = mktAsk(it, "anchor");          // exams: anchor levels, closer distractors when hard
    if (it.type === "g" && it.fact.kind === "rate" && !it.base) it = scAsk(it, hard ? (it.fact.v.typed ? "typed" : it.fact.v.reverse ? "reverse" : "mc") : scRandomKind(it.fact));
    test.items[test.idx] = it;
    const spec = test.lightning ? null : typedSpec(it);   // the numeric policy decides – bosses and challenges included; lightning stays MC
    const base = { kind: "quiz", test: true, testNo: test.idx + 1, testTotal: test.items.length, item: it, picked: undefined, correct: undefined };
    view = spec ? Object.assign(base, { mode: "typed", spec }) : Object.assign(base, { mode: "mc", options: makeOptions(it, !test.lightning) });
    view.t0 = Date.now();
    render();
  }

  function finishTestAnswer(correct, close) {
    view.correct = correct;
    view.close = !!close;
    // Instant Recall also counts in mixed recall, lightning rounds and calls – never in boss exams or module challenges
    const instant = correct && !!(test.mixed || test.lightning || test.call) && isInstantRecall(stateOf(view.item).box);
    if (correct) {
      test.correct++;
    } else if (close) {
      // close approximate anchor: no exam point, but no weak-spot penalty either
      test.close = (test.close || 0) + 1;
    } else {
      // not known after all → back into learning, marked as a weak spot
      test.missed.push(view.item.type === "b" ? view.item.b.name : view.item.fact.question);
      test.missedMods.push(MODULE_OF_TYPE[view.item.type]);
      const st = stateOf(view.item);
      st.box = 0;
      st.due = progOfItem(view.item).reviewCount + LEARN_STEPS[0];
      st.dueAt = 0;
      st.wrongCount++;
      st.lastWrongAt = Date.now();
    }
    test.idx++;
    registerAnswer(correct, view.item, true, close);
    const fb = close ? metaClose() : metaTestAnswer(correct, instant);
    if (instant) test.ir = (test.ir || 0) + 1;
    if (view.spec && view.spec.approx && fb.ok && !fb.quiet && !fb.milestone && !fb.instant && fb.tier !== 5) fb.sub = "BROKER ANCHOR LOCKED";
    const mission = missionTrack(fb, correct, close);
    saveProgress();
    view.autoNext = correct;
    render();
    if (!close) pulse(correct);
    if (fb.close) playCloseFX(fb); else if (fb.ok) playCorrectFX(fb); else playWrongFX(fb.label, fb.sub, fb.boss);
    if (mission) missionRingFX(mission);
    if (correct) advanceTimer = setTimeout(nextItem, AUTO_NEXT_MS);   // exams keep the same crisp rhythm
  }

  function finishTest() {
    const t = test;
    test = null;
    if (t.boss || t.mixed || t.lightning || t.call) { finishSpecial(t); return; }
    const total = t.items.length, need = testNeed(total);
    const p = lvlProg(t.section), defs = lvlDefs(t.section);
    const name = t.final ? MODULE_NAME[t.section] + " final challenge" : "Chapter " + (t.li + 1) + " – " + defs[t.li].title;
    if (t.correct >= need) {
      const first = !p.passed[t.li];
      p.passed[t.li] = true;
      const xp = first ? (t.final ? 300 : 150) : 40;
      awardXP(xp);
      saveProgress();
      celebrate();
      showOverlay({ kicker: "Module challenge cleared", title: t.correct + " / " + total, text: name + ". +" + xp + " XP." + (t.missed.length ? " " + t.missed.length + " missed – they went back into training." : ""),
        tone: "victory", primary: "Continue Journey", secondary: "Keep practicing", onPrimary: () => continueJourney(), onSecondary: () => nextItem() });
    } else {
      saveProgress();
      showOverlay({ kicker: "Module challenge", title: "Not yet – " + t.correct + " / " + total, text: name + ": " + need + " / " + total + " needed (90 %). Every missed question is now a weak spot.",
        tone: "fail", primary: "Train weak spots", secondary: "Close",
        onPrimary: () => { weakMode[activeSection] = true; journeyOn = false; lastId = null; nextItem(); }, onSecondary: () => nextItem() });
    }
    view = { kind: "pause" };
    render();
  }

  // =====================================================
  // JOURNEY – pure knowledge strength over every unique learning item of all 8 modules (852).
  // Each item grows step by step: new → first correct → short gap → sits → later review → long-gap mastery.
  // Exams and question variants reuse these items and never add to the total.
  // =====================================================
  const STEP_POINTS = [0, 0.12, 0.25, 0.4, 0.6, 1];
  function itemPoints(st) { return st.seen ? STEP_POINTS[Math.min(Math.max(st.box, 0), MASTERED_BOX)] : 0; }

  function scoreFacts(states) {
    let solid = 0, soft = 0, points = 0, seen = 0;
    states.forEach(st => {
      points += itemPoints(st);
      if (!st.seen) return;
      seen++;
      if (st.box >= MASTERED_BOX) solid++;
      else if (st.box >= SITS_BOX) soft++;
    });
    const total = states.length;
    return { solid, soft, seen, points, total, pct: total ? points / total * 100 : 0 };
  }

  const MODULE_ORDER = ["buildings", "secondary", "market", "community", "lingo", "views", "services", "objections"];
  const moduleItemCache = {};
  function moduleItems(section) {
    if (!moduleItemCache[section]) moduleItemCache[section] = allLearnItems().filter(i => MODULE_OF_TYPE[i.type] === section);
    return moduleItemCache[section];
  }

  function journey() {
    const sections = MODULE_ORDER.map(k => Object.assign({ key: k, name: MODULE_NAME[k] }, scoreFacts(moduleItems(k).map(stateOf))));
    const sum = key => sections.reduce((a, g) => a + g[key], 0);
    const total = sum("total"), points = sum("points"), solid = sum("solid"), seen = sum("seen");
    return { sections, total, points, solid, seen, consolidating: seen - solid, remaining: total - seen, pct: total ? Math.min(100, points / total * 100) : 0 };
  }

  // one module: strength per chapter, counts, accuracy, weak categories
  function moduleStats(section) {
    section = section || activeSection;
    const defs = lvlDefs(section), p = lvlProg(section), now = Date.now();
    const groups = [];
    defs.forEach((lv, li) => { if (!lv.final) groups.push(Object.assign({ name: "Ch " + (li + 1) + " " + lv.title }, scoreFacts(requiredItems(li, section).map(stateOf)))); });
    const items = moduleItems(section), states = items.map(stateOf);
    const sc = scoreFacts(states);
    const weak = items.filter(i => isWeak(stateOf(i), now));
    return Object.assign(sc, {
      groups,
      fresh: states.filter(st => !st.seen).length,
      learning: states.filter(st => st.seen && st.box < SITS_BOX).length,
      sits: sc.soft,
      mastered: sc.solid,
      accuracy: p.answered ? Math.round(p.correct / p.answered * 100) : null,
      challenges: Object.keys(p.passed).filter(k => p.passed[k]).length,
      weak: weak.length,
      weakCats: [...new Set(weak.map(catOf))],
      weakBuildings: [...new Set(weak.map(i => i.type === "m" ? i.fact.building : i.type === "g" && i.fact.kind === "rate" ? (SC_RECORDS.find(r => r.id === i.fact.recs[0]) || {}).building : null).filter(Boolean))]
    });
  }

  function fmtPct(v) { return (Math.floor(v * 10) / 10).toFixed(1); }

  let shownJourney = null;
  function animateDecimal(node, from, to) {
    const raf = typeof requestAnimationFrame === "function" ? requestAnimationFrame : null;
    if (!raf || from === null || from === to) { node.textContent = fmtPct(to); return; }
    const start = Date.now(), dur = 1100;
    const tick = () => {
      const t = Math.min(1, (Date.now() - start) / dur);
      node.textContent = fmtPct(from + (to - from) * (1 - Math.pow(1 - t, 3)));
      if (t < 1) raf(tick);
    };
    raf(tick);
  }

  function renderJourney(j) {
    animateDecimal(el.journeyPct, shownJourney, j.pct);
    shownJourney = j.pct;
    el.journeyFill.style.width = j.pct + "%";
    el.journeySoft.style.width = (j.total ? j.seen / j.total * 100 : 0) + "%";
    el.journeyCount.innerHTML = "<span><b>" + j.solid + "</b> / " + j.total + " mastered</span><span><b>" + j.consolidating + "</b> consolidating</span><span><b>" + j.remaining + "</b> remaining</span>";
    if (el.meter.classList.contains("open")) el.breakdown.innerHTML = journeyDetailsHTML(j);
  }

  function journeyDetailsHTML(j) {
    const kv = (name, value) => '<div class="bd-row kv"><span class="bd-name">' + esc(name) + '</span><span class="bd-pct">' + esc(value) + "</span></div>";
    let html = '<div class="bd-head">All modules</div>' + j.sections.map(g =>
      '<div class="bd-row' + (g.key === activeSection ? " on" : "") + '"><span class="bd-name">' + esc(g.name) + "<small>" + g.solid + " / " + g.total + " mastered · " + (g.seen - g.solid) + " consolidating</small></span>" +
      '<span class="bd-bar"><em style="width:' + (g.total ? g.seen / g.total * 100 : 0) + '%"></em><b style="width:' + g.pct + '%"></b></span>' +
      '<span class="bd-pct">' + Math.floor(g.pct) + " %</span></div>").join("");
    const k = moduleStats();
    html += '<div class="bd-head">' + esc(MODULE_NAME[activeSection]) + " · chapters</div>" + k.groups.map(g =>
      '<div class="bd-row"><span class="bd-name">' + esc(g.name) + '</span><span class="bd-bar"><em style="width:' + (g.total ? g.seen / g.total * 100 : 0) + '%"></em><b style="width:' + g.pct + '%"></b></span>' +
      '<span class="bd-pct">' + Math.floor(g.pct) + " %</span></div>").join("");
    html += kv("New / Learning / Sits / Mastered", k.fresh + " / " + k.learning + " / " + k.sits + " / " + k.mastered) +
      kv("Accuracy", k.accuracy === null ? "–" : k.accuracy + " %") +
      kv("Module challenges cleared", String(k.challenges));
    const note = text => '<div class="bd-note">' + text + "</div>";
    html += note("Weak spots: <strong>" + esc(k.weakCats.length ? k.weakCats.join(", ") : "none right now") + "</strong>");
    if (activeSection === "market") html += note("Weak buildings: <strong>" + esc(k.weakBuildings.length ? k.weakBuildings.join(", ") : "none right now") + "</strong>") +
      note("Market data updated " + esc(MARKET_UPDATED.label) + ' <span class="fresh ' + marketFreshness() + '">' + marketFreshness() + "</span>. " + esc(MARKET_DISCLAIMER) + " " + marketFacts.filter(f => f.orientation).length + " orientation-only values are shown but never tested.");
    if (activeSection === "services") html += note("Weak buildings: <strong>" + esc(k.weakBuildings.length ? k.weakBuildings.join(", ") : "none right now") + "</strong>") +
      note("Strict rates / reference only: " + SC_RECORDS.filter(r => r.strictTestable).length + " / " + SC_RECORDS.filter(r => !r.strictTestable).length) +
      note("<strong>Rule:</strong> " + esc(SC_RULE));
    if (activeSection === "secondary") html += note("Training aid based on your curriculum. Always confirm current DLD / RERA rules, lender and developer requirements and your brokerage's procedures.");
    if (activeSection === "objections") html += note("Learn the pattern, not the exact words: objection → calm response → why it works → what to avoid → follow-up question.");
    if (activeSection === "community") html += note("Drive times are approximate learning references. " + esc(FUTURE_NOTE));
    if (activeSection === "views") html += note("Not strictly tested (no questions, no effect on progress):<br>" +
        VIEW_BUILDINGS.filter(b => b.status !== "STRICT").map(b => "<strong>" + esc(b.building) + "</strong> – " + esc(b.display)).join("<br>")) +
      note(esc(VIEW_NOTE) + " Source class: " + esc(VIEW_SOURCE) + ".");
    return html;
  }

  // the active module: strength, open chapter, what is waiting – details stay one tap away
  function renderModule() {
    const k = moduleStats(), p = lvlProg();
    const parts = [k.fresh ? k.fresh + " new" : "", k.learning ? k.learning + " learning" : "", k.weak ? '<span class="mb-weak">' + k.weak + " weak</span>" : ""].filter(Boolean);
    el.modbar.innerHTML = '<div class="mb-top"><span class="mb-name">' + esc(MODULE_NAME[activeSection]) + '</span><span class="mb-pct">' + Math.floor(k.pct) + "<small>\u00a0%</small></span></div>" +
      '<div class="mb-track"><em style="width:' + (k.total ? k.seen / k.total * 100 : 0) + '%"></em><b style="width:' + k.pct + '%"></b></div>' +
      '<div class="mb-ch">Chapter ' + (p.currentLevel + 1) + " · " + esc(lvlDefs()[p.currentLevel].title) + "</div>" +
      '<div class="mb-meta">' + (parts.length ? parts.join(" · ") : k.mastered + " / " + k.total + " mastered") + (k.accuracy === null ? "" : "<span>Accuracy " + k.accuracy + "\u00a0%</span>") + "</div>" +
      (activeSection === "market" ? '<div class="mb-fresh">Market data ' + esc(MARKET_UPDATED.label) + ' <span class="fresh ' + marketFreshness() + '">' + marketFreshness() + "</span></div>" : "") +
      '<div class="mb-actions"><button class="mb-start" type="button" data-mod="start">Train ' + esc(MODULE_NAME[activeSection]) + '</button><button class="mb-more" type="button" data-mod="more">' + (bodyHas("mod-more") ? "Less" : "More details") + "</button></div>";
  }

  function toggleMeter() {
    const open = !el.meter.classList.contains("open");
    el.meter.classList.toggle("open", open);
    el.meter.setAttribute("aria-expanded", open ? "true" : "false");
    el.meterToggle.textContent = open ? "Hide details" : "Details";
    if (open) el.breakdown.innerHTML = journeyDetailsHTML(journey());
  }

  // =====================================================
  // EFFECTS – gold sparks on a correct answer, gold dust for big moments
  // =====================================================
  function fxOn() {
    if (!el.fx || typeof document.createElement !== "function") return false;
    try {
      if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return false;
    } catch (e) { /* ignore */ }
    return true;
  }

  function celebrate() {
    if (!fxOn()) return;
    for (let i = 0; i < 46; i++) {
      const d = document.createElement("span");
      d.className = "dust";
      d.style.left = Math.random() * 100 + "vw";
      d.style.setProperty("--dx", (Math.random() * 120 - 60) + "px");
      d.style.setProperty("--r", (Math.random() * 720 - 360) + "deg");
      d.style.setProperty("--t", (1.6 + Math.random() * 1.6) + "s");
      d.style.animationDelay = Math.random() * 0.5 + "s";
      el.fx.appendChild(d);
      setTimeout(() => d.remove(), 3800);
    }
  }

  // =====================================================
  // RENDERING
  // =====================================================
  function badgeHTML(status, label) {
    return '<span class="badge ' + status + '">' + esc(label || status.charAt(0).toUpperCase() + status.slice(1)) + "</span>";
  }

  // Top of the card: label + title (+ the question in client mode)
  const SEC_TYPE_LABEL = { single: "Choose the correct one", sequence: "Sequence", scenario: "Scenario", risk: "Deal killer / risk" };

  // where a card belongs: "Chapter 3 · Driving Connectivity" in training, the exam name inside a boss / challenge
  function chapterLabel(level, category) { return "Chapter " + level + " · " + category; }
  function testLabel(item) {
    if (!test) return "";
    if (test.boss) return "⚔ Boss · Level " + test.boss + " – " + test.bossName;
    if (test.mixed) return "Mixed recall · " + (MODULE_NAME[MODULE_OF_TYPE[item.type]] || "");
    if (test.lightning) return "Lightning round · " + (test.idx + 1) + " / " + test.items.length;
    if (test.call) return (test.call === "owner" ? "Owner call · " : "Client call · ") + (MODULE_NAME[MODULE_OF_TYPE[item.type]] || "");
    return test.final ? "Final challenge" : "Chapter " + (test.li + 1) + " challenge";
  }
  function headHTML(item, status, withQuestion) {
    const h = headHTMLBase(item, status, withQuestion);
    return view.test && test && (test.boss || test.mixed || test.lightning || test.call) ? h.replace('<div class="card-area">', '<div class="card-area boss-tag">') : h;
  }

  // KNOWLEDGE STRENGTH – five dots straight from the memory box (no second system): 1 seen right · 2 · 3 sits ·
  // 4 still there after a day · 5 still there days later. A miss drains them honestly; a weak point carries a quiet "Target" tag.
  function strengthHTML(item) {
    const s = stateOf(item), box = Math.min(s.box, 5);
    const answered = view.picked !== undefined && typeof view.prevBox === "number";
    const prev = answered ? Math.min(view.prevBox, 5) : box;
    const target = isWeak(s, Date.now());
    let dots = "";
    for (let i = 1; i <= 5; i++) dots += '<i class="' + (i <= box ? "on" + (i > prev ? " gain" : "") : i <= prev ? "lost" : "") + '"></i>';
    return '<span class="strength' + (s.box > 5 ? " locked" : "") + '" aria-label="Strength ' + box + ' of 5">' + (target ? '<em class="tgt">Target</em>' : "") + dots + "</span>";
  }
  function headHTMLBase(item, status, withQuestion) {
    const badge = view.test ? badgeHTML("new", view.testNo + " / " + view.testTotal) : view.kind === "quiz" ? strengthHTML(item) : badgeHTML(status);
    if (item.type === "m") return marketHeadHTML(item, badge);
    if (item.type === "c") return communityHeadHTML(item, badge);
    if (item.type === "l") return lingoHeadHTML(item, badge);
    if (item.type === "v") return viewHeadHTML(item, badge);
    if (item.type === "o") return objHeadHTML(item, badge);
    if (item.type === "g") return scHeadHTML(item, badge);
    if (item.type === "s") {
      const f = item.fact;
      const where = view.test ? testLabel(item) : chapterLabel(f.level, f.category);
      let html = '<div class="card-top"><div class="card-area">' + esc(where) + "</div>" + badge + "</div>";
      if (SEC_TYPE_LABEL[f.type]) html += '<div class="qtype">' + esc(SEC_TYPE_LABEL[f.type]) + "</div>";
      if (f.setup && f.setup.length) html += '<ul class="setup">' + f.setup.map(l => "<li>" + esc(l) + "</li>").join("") + "</ul>";
      const asClient = f.type === "client" || (settings.clientMode && (f.type === "fact" || f.type === "single"));
      html += asClient
        ? '<div class="client-label">Client asks</div><h1 class="card-name area-q">“' + esc(f.question) + '”</h1>'
        : '<h1 class="card-name area-q">' + esc(f.question) + "</h1>";
      return html;
    }
    const lv = levelForField(item.field);
    let html = '<div class="card-top"><div class="card-area">' + esc(view.test ? testLabel(item) : "Buildings · " + lv.title) + "</div>" + badge + "</div>" +
      '<h1 class="card-name">' + esc(item.b.name.toUpperCase()) + "</h1>";
    if (withQuestion) {
      html += settings.clientMode
        ? '<div class="client-label">Client asks</div><div class="client-q">“' + esc(lv.client(item.b.name)) + '”</div>'
        : '<div class="question">' + esc(lv.question) + "</div>";
    }
    return html;
  }

  const CLS_CLASS = { "OFFICIAL": "official", "PROCESS": "process", "BROKERAGE-SPECIFIC": "brokerage", "BANK-SPECIFIC": "bank", "DEVELOPER-SPECIFIC": "developer" };

  // ---------- Community Expert cards ----------
  const COM_TYPE_LABEL = {
    single: "Choose the correct one", truefalse: "True or false", connectivity: "What comes next / connectivity",
    comparison: "Comparison", scenario: "Scenario", client: "Client question"
  };
  const COM_CLS_CLASS = { "OFFICIAL": "official", "APPROXIMATE": "approx", "CONCEPT": "process", "FUTURE": "future", "CLIENT APPLICATION": "brokerage" };
  function comClsLabel(c) { return c === "APPROXIMATE" ? "APPROX." : c; }

  function communityHeadHTML(item, badge) {
    const f = item.fact;
    const where = view.test
      ? testLabel(item)
      : chapterLabel(f.level, f.category);
    let html = '<div class="card-top"><div class="card-area">' + esc(where) + "</div>" + badge + "</div>";
    const tags = [];
    if (COM_TYPE_LABEL[f.type]) tags.push('<span class="qtype" style="margin:0">' + esc(COM_TYPE_LABEL[f.type]) + "</span>");
    if (f.classification === "FUTURE") tags.push('<span class="cls future">FUTURE</span>');
    if (f.classification === "APPROXIMATE") tags.push('<span class="cls approx">APPROX.</span>');
    if (tags.length) html += '<div class="head-badges">' + tags.join("") + "</div>";
    if (f.setup && f.setup.length) html += '<ul class="setup">' + f.setup.map(l => "<li>" + esc(l) + "</li>").join("") + "</ul>";
    const asClient = f.type === "client" || (settings.clientMode && !!f.client);
    html += asClient
      ? '<div class="client-label">Client asks</div><h1 class="card-name area-q">“' + esc(f.type === "client" ? f.question : f.client) + '”</h1>'
      : '<h1 class="card-name area-q">' + esc(f.question) + "</h1>";
    return html;
  }

  function communityAnswerHTML(item, cls) {
    const f = item.fact;
    return '<div class="big-fact sec ' + (cls || "") + '"><div class="fact-label">' + (f.type === "client" || f.type === "scenario" ? "Best response" : "Correct answer") + "</div>" +
      '<div class="big-value text">' + esc(f.answer) + "</div>" +
      '<p class="explain">' + esc(f.explanation) + "</p>" +
      (f.classification === "FUTURE" ? '<p class="future-note">◆ ' + esc(FUTURE_NOTE) + "</p>" : "") +

      (extra ? '<div class="fact-extra">' + esc(extra) + "</div>" : "") + "</div>";

  // Memory hint (Buildings only) – one short line, computed only from the data above
  function hintFor(b, field) {
    if (field === "completion") {
      const year = completionYear(b.completion);
      if (!year) return "";
      const same = buildings.filter(x => x.id !== b.id && completionYear(x.completion) === year).map(x => x.name);
      if (!same.length) return "The only building from <strong>" + year + "</strong>";
      return "<strong>" + esc(same.slice(0, 3).join(" · ") + (same.length > 3 ? " …" : "")) + "</strong> also " + year;
    }
    let line = "";
    const val = valueOf(field, b[field]);
    if (val !== null) {
      const ranked = buildings.filter(x => valueOf(field, x[field]) !== null);
      const rank = ranked.filter(x => valueOf(field, x[field]) > val).length + 1;
      if (field === "floors") {
        line = (rank === 1 ? "<strong>The tallest</strong>" : "<strong>#" + rank + " tallest</strong>") +
          " of " + ranked.length + " (by tallest tower).";
      } else {
        let closest = null;
        ranked.filter(x => x.id !== b.id).forEach(x => {
          const d = Math.abs(valueOf(field, x[field]) - val);
          if (!closest || d < closest.d) closest = { x, d };
        });
        line = "<strong>#" + rank + "</strong> of " + ranked.length + " by units";
        if (closest) {
          line += closest.d === 0
            ? " – same as <strong>" + esc(closest.x.name) + "</strong>."
            : " – closest: " + esc(closest.x.name) + " (" + esc(closest.x[field]) + ").";
        }
      }
    }
    if (b.note) line += (line ? "<br>" : "") + "Note: <strong>" + esc(b.note) + "</strong>";
    return line;
  }

  function hintHTML(item) {
    if (item.type !== "b" || view.test) return "";
    const h = hintFor(item.b, item.field);
    return h ? '<p class="hint">' + h + "</p>" : "";

    const item = view.item;
    const answered = view.picked !== undefined;
    let html = headHTML(item, statusOf(item), true);

    if (view.mode === "typed") {
      const spec = view.spec;
      if (spec.template) html += '<div class="type-template">' + esc(spec.template).replace("___", "<strong>___</strong>") + "</div>";
      const cls = answered ? (view.correct ? " ok" : view.close ? " close" : " bad") : "";
      html += '<div class="type-row"><input class="answer-input' + cls + '" id="answerInput" type="text" inputmode="' + (spec.decimal ? "decimal" : "numeric") + '" enterkeyhint="done" autocorrect="off" spellcheck="false" ' +
        'autocomplete="off" placeholder="Type it…" value="' + esc(answered && view.picked !== null ? view.picked : "") + '"' +
        (answered ? " disabled" : "") + ">" +
        (answered ? "" : '<button class="btn btn-primary" type="button" data-action="check">Check</button>') + "</div>";
    } else {
      const correctValue = correctAnswer(item);
      html += '<div class="options' + (item.type !== "b" ? " single" : "") + '">';
      view.options.forEach((opt, i) => {
        let cls = "btn opt";

          if (opt === correctValue) cls += " correct";

      });
      html += "</div>";

    if (!answered) {
      html += '<button class="btn btn-link" type="button" data-action="dont-know">I don\'t know – show me</button>';
    } else if (view.correct && view.autoNext && !view.held) {
      // AUTO-NEXT: known and correct – no explanation wall, the next card is already on its way (tap the card to hold it)
      const approx = view.mode === "typed" && view.spec && view.spec.approx;
      // approximate numbers keep their exact reference visible even in the quick line
      const ref = approx ? "≈ AED " + view.spec.anchor + " · exact AED " + scFmt(view.spec.exact) + " / sq ft / year"
        : numericLearningMode(item) === "approxBand" ? unitsAnchorLabel(item.b, true) + " · exact " + item.b.units
        : item.fact && item.fact.range ? "Exact working range: " + String(item.fact.range).replace(/^approx\.\s*/i, "") : "";
      html += '<div class="result-line good quick">Correct' + (approx ? ' <span class="anchor-lock">Broker anchor locked</span>' : "") +
        (ref ? '<span class="quick-ref">' + esc(ref) + "</span>" : "") + '<span class="hold-hint">tap to hold</span></div>';
    } else if (view.correct) {
      const bank = item.type === "s" || item.type === "m" || item.type === "c" || item.type === "l" || item.type === "v" || item.type === "o" || item.type === "g";
      const approx = view.mode === "typed" && view.spec && view.spec.approx;
      html += '<div class="result-line good">Correct!' + (approx ? ' <span class="anchor-lock">Broker anchor locked</span>' : "") + "</div>" +
        (view.mode === "typed" || bank || numericLearningMode(item) === "approxBand" ? answerBoxHTML(item, "ok") : "") + hintHTML(item);
      if ((bank && !view.test) || view.held) html += '<div class="spacer"></div><button class="btn btn-primary" type="button" data-action="next">Continue</button>';

      html += '<div class="result-line close">Close – target anchor ' + esc(formatBrokerAnchor(view.spec.exact, view.spec.context)) + "</div>" + answerBoxHTML(item, "ok") +

      html += answerBoxHTML(item, "ok") + hintHTML(item) +

        '<button class="btn btn-primary" type="button" data-action="next">Continue</button>';

    return html;

      html += '<button class="' + cls + '" type="button" data-action="bonus" data-index="' + i + '"' +

        '</span><span class="compare-name">' + esc(bld.name) + "</span>" +
        (c.picked !== undefined ? '<span class="compare-val">' + esc(answerOf(bld, c.lv.field)) + "</span>" : "") + "</button>";
    });
    html += "</div>";
    if (c.picked !== undefined) html += bonusResultHTML(c.picked === c.winnerId);
    return html;
  }

  function renderReverse() {
    const r = view;
    let html = '<div class="card-top"><div class="card-area">Bonus question</div><span class="badge">Reverse</span></div>' +
      '<h1 class="card-name small">' + esc(r.lv.reverse(r.value)) + "</h1>" +
      '<div class="options" style="margin-top:28px">';
    r.options.forEach((bld, i) => {
      let cls = "btn opt";
      if (r.picked !== undefined) {
        if (bld.id === r.target.id) cls += " correct";
        else if (bld.id === r.picked) cls += " incorrect";
        else cls += " dim";
      }
      html += '<button class="' + cls + '" type="button" data-action="bonus" data-index="' + i + '"' +
        (r.picked !== undefined ? " disabled" : "") + '><span class="key">' + (i + 1) + "</span>" + esc(bld.name) + "</button>";
    });
    html += "</div>";
    if (r.picked !== undefined) html += bonusResultHTML(r.picked === r.target.id);
    return html;
  }

  function bonusResultHTML(ok) {
    return '<div class="result-line ' + (ok ? "good" : "low") + '">' + (ok ? "Correct!" : "Not quite.") + "</div>" +
      '<div class="spacer"></div><button class="btn btn-primary" type="button" data-action="next">Next</button>';
  }

  function renderMessage(title, text, buttons) {
    return '<div class="spacer"></div><div class="msg-glyph" aria-hidden="true"></div><h1 class="card-name small">' + title + "</h1>" +
      '<p class="hint">' + text + "</p>" +
      (buttons || []).map((b, i) => '<button class="btn ' + (i === 0 ? "btn-primary" : "btn-link") + '" type="button" data-action="' + b[1] + '">' + b[0] + "</button>").join("") +
      '<div class="spacer"></div>';
  }

  function render() {
    let html;
    if (view.kind === "intro") html = renderIntro();
    else if (view.kind === "quiz") html = renderQuiz();
    else if (view.kind === "compare") html = renderCompare();
    else if (view.kind === "reverse") html = renderReverse();
    else if (view.kind === "done") {
      html = renderMessage("All clear in " + esc(MODULE_NAME[activeSection]),
        "Everything you have learned here sits for now. Reviews return with time – that spacing is what turns knowledge into mastery.",
        [["Continue Journey", "journey"], ["Practice anyway", "practice"]]);
    } else if (view.kind === "clear") {
      const info = agentInfo();
      const btns = [];
      if (info.bossAvail) btns.push(["⚔ Boss exam · Level " + info.bossAvail.lv, "boss"]);
      if (seenItems(null).filter(i => stateOf(i).box >= 1).length >= 5) btns.push(["Mixed recall", "mixed"]);
      btns.push(["Free practice", "free"]);
      html = renderMessage("Everything is consolidated",
        "No reviews, weak spots or new knowledge are waiting right now. Your next reviews unlock with time – spacing is what builds mastery." +
        (info.bossAvail ? " The " + esc(info.bossAvail.name) + " is waiting at the gate." : ""), btns);
    } else if (view.kind === "no-weak") {
      html = renderMessage("No weak spots right now", "Nothing you answered wrong recently is still open.", [["Back to training", "weak-off"]]);
    } else if (view.kind === "pause") {
      html = renderMessage("Session paused", "Pick it up whenever you like – nothing resets, nothing expires.", [["Continue Journey", "journey"]]);
    } else {
      html = renderMessage("Nothing for this filter", "This chapter has no items for the selected filter.", [["Show all", "clear-filter"]]);
    }
    el.card.innerHTML = html;
    if (view !== lastRenderedView) {
      el.card.classList.remove("enter");
      void el.card.offsetWidth;
      el.card.classList.add("enter");
      lastRenderedView = view;
    } else {
      el.card.classList.remove("enter");
    }

    if (view.kind === "quiz" && view.mode === "typed" && view.picked === undefined && !booting && !introActive) {
      const input = document.getElementById("answerInput");
      if (input && typeof input.focus === "function") input.focus();
    }
    renderLevels();
    renderModule();
    updateStats();
    syncProgressUI();
    renderTrainCtx();
  }

  // the ONE progress sync: Agent HUD, hero (level, journey, XP, quest) and the Journey meter – from one calculation.
  // Called after every XP / progression mutation of an event has finished.
  function syncProgressUI() {
    const j = journey(), info = agentInfo(j);
    renderJourney(j);
    renderHero(info);
    renderHud(info);
    return info;
  }

  function renderLevels() {
    el.levels.classList.toggle("scroll", activeSection !== "buildings");
    const lp = lvlProg();
    let html = "";
    lvlDefs().forEach((lv, li) => {
      if (lv.final) return;
      const s = levelSits(li);
      const pct = s.total ? Math.round(s.sits / s.total * 100) : 0;
      const unlocked = isUnlocked(li);
      let cls = "level";
      if (li === lp.currentLevel) cls += " active";
      if (!unlocked) cls += " locked";
      html += '<button class="' + cls + '" type="button" data-level="' + li + '">' +
        '<div class="level-num">Chapter ' + (li + 1) + (unlocked ? "" : " · locked") + "</div>" +
        '<div class="level-title">' + esc(lv.title) + "</div>" +
        '<div class="level-bar"><div class="level-fill" style="width:' + pct + '%"></div></div>' +
        '<div class="level-count">' + s.sits + " / " + s.total + " sit" + (lp.passed[li] ? " · ✓" : "") + "</div></button>";
    });
    el.levels.innerHTML = html;
    // keep the open chapter in view in the swipeable row
    const scrollKey = activeSection + ":" + lp.currentLevel;
    if (activeSection !== "buildings" && lastScrolledLevel !== scrollKey && typeof el.levels.querySelector === "function") {
      const a = el.levels.querySelector(".level.active");
      if (a) el.levels.scrollLeft = Math.max(0, a.offsetLeft - el.levels.offsetLeft - 8);
      lastScrolledLevel = scrollKey;
    }

  let lastScrolledLevel = null;
  let lastMastered = null, lastCombo = 0;

  function updateStats() {
    let fresh = 0, learning = 0, mastered = 0;
    sectionItems().forEach(i => {
      const st = statusOf(i);
      if (st === "new") fresh++;
      else if (st === "learning") learning++;
      else mastered++;
    });
    el.statNew.textContent = fresh;
    el.statLearning.textContent = learning;
    el.statMastered.textContent = mastered;
    el.statCombo.textContent = play.combo ? "x" + play.combo : "0";
    if (lastMastered && lastMastered.section === activeSection && mastered > lastMastered.n) bump(el.statMastered);
    if (play.combo > lastCombo && play.combo % 5 === 0) bump(el.statCombo);
    const cb = el.comboBadge, tier = comboTier(play.combo);
    if (play.combo >= 5) {                       // the combo only appears once it means something
      cb.hidden = false;
      cb.className = "combo-badge " + (tier ? "c" + tier[0] : "c0");
      cb.innerHTML = "<b>COMBO x" + play.combo + "</b>" + (tier ? "<span>" + tier[1] + "</span>" : "");
      if (play.combo > lastCombo) restartAnim(cb, "up");
    } else if (play.brokenShow && play.lastBroken >= 5) {
      cb.hidden = false;
      cb.className = "combo-badge broken";
      cb.innerHTML = "<b>COMBO x" + play.lastBroken + " BROKEN</b>";
    } else cb.hidden = true;
    lastMastered = { section: activeSection, n: mastered };
    lastCombo = play.combo;

    if (test) {
      const tPct = Math.round(test.idx / test.items.length * 100);
      el.toolbarInfo.innerHTML = "<span>" + (test.boss ? "Boss exam" : test.mixed ? "Mixed recall" : test.lightning ? "Lightning round" : test.call ? "Call" : "Module challenge") + ": <strong>" + test.idx + " / " + test.items.length + "</strong></span>" +
        "<span>" + test.correct + " right" + '<span class="round-bar"><span class="round-fill" style="width:' + tPct + '%"></span></span></span>';
    } else {
      const sched = schedulingItems(), now = Date.now();
      const lead = journeyOn && focus ? '<span class="mode-tag">Journey</span>' + esc(FOCUS_LABEL[focus.kind] || "") + (focus.kind === "new" ? " · Ch " + (focus.li + 1) : "")
        : weakMode[activeSection] ? '<span class="mode-tag free">Practice</span>Weak spots <strong>' + sched.filter(i => isWeak(stateOf(i), now)).length + "</strong>"
        : '<span class="mode-tag free">Practice</span>Due now <strong>' + dueNowCount(sched) + "</strong>";
      const mp = missionProgress();
      el.toolbarInfo.innerHTML = "<span>" + lead + "</span><span>Mission <strong>" + mp.done + "/" + mp.goals + "</strong> goals</span>";
    }
    el.testBtn.classList.toggle("on", !!(test && test.challenge));
    el.weakBtn.classList.toggle("on", !!weakMode[activeSection]);
    el.clientBtn.classList.toggle("on", !!settings.clientMode);

    const rate = play.answered ? Math.round(play.correct / play.answered * 100) : 0;
    el.sessionInfo.textContent = (play.answered ? play.answered + " answered · " + rate + " % right" : "No answers yet this session") + (meta().bestCombo ? " · Best combo x" + meta().bestCombo : "");
  }

  function bump(node) {
    node.classList.remove("bump");
    void node.offsetWidth;
    node.classList.add("bump");
  }

  // the card itself: a correct answer is handled by the reward layer (snap / impact by tier) – only a miss shakes it here
  function pulse(correct) {
    el.card.classList.remove("flash-ok", "flash-bad");
    if (correct) return;
    void el.card.offsetWidth;
    el.card.classList.add("flash-bad");
  }

  function showToast(text) {
    el.toast.textContent = text;
    el.toast.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.toast.classList.remove("show"), 1800);
  }

  function primaryAction() {
    if (view.kind === "intro") finishIntro();
    else if (view.kind === "quiz" && view.picked !== undefined) nextItem();
    else if (view.kind === "quiz" && view.mode === "typed") {
      const input = document.getElementById("answerInput");
      if (input && typeof input.focus === "function") input.focus();
    }
    else if ((view.kind === "compare" || view.kind === "reverse") && view.picked !== undefined) nextItem();
    else if (view.kind === "pause" || view.kind === "done" || view.kind === "clear") continueJourney();
  }

  // =====================================================
  // SECTIONS (Buildings | Area Knowledge)
  // =====================================================
  const SECTION_LABEL = { buildings: "Buildings", secondary: "Secondary Deals", market: "Market Intelligence", community: "Community Expert", lingo: "Broker Lingo", views: "Views & Orientation", objections: "Objection Handling", services: "Service Charges" };
  const FILTER_KEY = { buildings: "filter", secondary: "secFilter", market: "mktFilter", community: "comFilter", lingo: "lingFilter", views: "viewFilter", objections: "objFilter", services: "scFilter" };
  function getFilter(section) { return { buildings: filter, secondary: secFilter, market: mktFilter, community: comFilter, lingo: lingFilter, views: viewFilter, objections: objFilter, services: scFilter }[section]; }
  function setFilter(section, v) {
    if (section === "secondary") secFilter = v; else if (section === "market") mktFilter = v; else if (section === "community") comFilter = v;
    else if (section === "lingo") lingFilter = v; else if (section === "views") viewFilter = v; else if (section === "objections") objFilter = v;
    else if (section === "services") scFilter = v; else filter = v;
  }

  function rebuildFilter() {
    let opts;
    if (activeSection === "services") {
      opts = [["all", "All"], ["strict", "Strict testable"], ["reference", "Reference only"], ["offplan", "Off-plan"], ["lower", "Lower cost"], ["mid", "Mid cost"], ["higher", "Higher cost"]];
      el.filterSelect.setAttribute("aria-label", "Service charge filter");
    } else if (activeSection === "objections") {
      opts = [["all", "All"]].concat(Object.keys(OBJ_FILTERS).map(k => [k, OBJ_FILTERS[k]]));
      el.filterSelect.setAttribute("aria-label", "Objection filter");
    } else if (activeSection === "views") {
      opts = [["all", "All views"]].concat(Object.keys(VIEW_CATS).map(c => [c, VIEW_CATS[c]]));
      el.filterSelect.setAttribute("aria-label", "View category filter");
    } else if (activeSection === "lingo") {
      opts = [["all", "All items"], ["term", "Terms"], ["phrase", "Phrases"], ["client", "Client questions"]];
      el.filterSelect.setAttribute("aria-label", "Broker Lingo filter");
    } else if (activeSection === "community") {
      opts = [["all", "All items"], ["OFFICIAL", "Official"], ["APPROXIMATE", "Approx."], ["CONCEPT", "Concept"], ["FUTURE", "Future"], ["CLIENT APPLICATION", "Client application"]];
      el.filterSelect.setAttribute("aria-label", "Community classification filter");
    } else if (activeSection === "market") {
      opts = [["all", "All buildings"]].concat(marketData.filter(b => !b.excluded).map(b => [b.building, b.building]));
      el.filterSelect.setAttribute("aria-label", "Market building filter");

      el.filterSelect.setAttribute("aria-label", "Secondary question type");
