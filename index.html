      el.filterSelect.setAttribute("aria-label", "Filter buildings");
    }
    el.filterSelect.innerHTML = opts.map(o => '<option value="' + esc(o[0]) + '">' + esc(o[1]) + "</option>").join("");
    el.filterSelect.value = getFilter(activeSection);
  }

  function applySectionUI() {
    el.tabs.querySelectorAll("[data-section]").forEach(t => {
      const on = t.dataset.section === activeSection;
      t.classList.toggle("active", on);
      t.setAttribute("aria-selected", on ? "true" : "false");
    });
    el.resetBtn.textContent = "Reset " + MODULE_NAME[activeSection] + " progress…";
    el.filterSelect.disabled = journeyOn;
    rebuildFilter();
    updateUndoButton();
  }

  // the module switch itself – no new card yet
  function switchSection(section) {
    clearTimer();
    activeSection = section;
    lastId = null;
    bonusState.since = 0;
    saveProgress();
    applySectionUI();
  }

  // manual navigation = free practice in that module (Continue Journey hands control back to the engine)
  function setSection(section) {
    if (!SECTION_LABEL[section]) return;
    journeyOn = false;
    focus = null;
    if (section === activeSection) { applySectionUI(); render(); return; }
    cancelTest(test ? "Exam stopped" : "");
    if (!el.overlay.hidden) { el.overlay.hidden = true; overlayActions = { primary: null, secondary: null }; }
    switchSection(section);
    nextItem();
  }

  // =====================================================
  // EVENTS
  // =====================================================
  // TAP TO HOLD: during the auto-next window a tap anywhere on the card stops it and opens the explanation
  function holdCard() {
    if (!advanceTimer || !view.autoNext || view.held || view.picked === undefined) return false;
    clearTimer();
    view.held = true;
    render();
    return true;
  }
  el.card.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-action]");
    if (!btn || btn.disabled) { holdCard(); return; }       // tapping the card or an answered (disabled) option holds it
    const action = btn.dataset.action;
    const idx = Number(btn.dataset.index);
    if (action === "got-it") finishIntro();
    else if (action === "answer") answerChoice(view.options[idx]);
    else if (action === "check") submitTyped(false);
    else if (action === "dont-know") view.mode === "typed" ? submitTyped(true) : answerChoice(null);
    else if (action === "next") nextItem();
    else if (action === "bonus") answerBonus(idx);
    else if (action === "practice") { practiceAnyway[activeSection] = true; nextItem(); }
    else if (action === "weak-off") { weakMode[activeSection] = false; lastId = null; nextItem(); }
    else if (action === "journey") continueJourney();
    else if (action === "boss") startBoss(agentInfo().bossAvail);
    else if (action === "mixed") startMixed();
    else if (action === "free") startFreePractice();
    else if (action === "clear-filter") { setFilter(activeSection, "all"); el.filterSelect.value = "all"; lastId = null; nextItem(); }
  });

  el.meter.addEventListener("click", toggleMeter);

  el.levels.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-level]");
    if (btn) onLevelClick(Number(btn.dataset.level));
  });

  el.tabs.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-section]");
    if (btn) setSection(btn.dataset.section);
  });

  el.skipBtn.addEventListener("click", () => skipFromKey());

  el.filterSelect.addEventListener("change", () => {
    setFilter(activeSection, el.filterSelect.value);
    journeyOn = false;
    focus = null;
    lastId = null;
    nextItem();
  });

  el.testBtn.addEventListener("click", () => {
    if (test) {
      if (window.confirm("Stop this exam? It will not count.")) { cancelTest("Exam stopped"); nextItem(); }
      return;
    }
    startTest();
  });

  el.weakBtn.addEventListener("click", () => {
    if (test) { showToast("Finish or stop the exam first"); return; }
    journeyOn = false;
    focus = null;
    weakMode[activeSection] = !weakMode[activeSection];
    lastId = null;
    showToast(weakMode[activeSection] ? "Weak spots: only items you got wrong recently" : "Back to normal training");
    nextItem();
  });

  el.clientBtn.addEventListener("click", () => {
    settings.clientMode = !settings.clientMode;
    saveProgress();
    showToast(settings.clientMode ? "Client mode on – questions as a client would ask" : "Client mode off");
    render();
  });

  el.overlayPrimary.addEventListener("click", () => closeOverlay("primary"));
  el.overlaySecondary.addEventListener("click", () => closeOverlay("secondary"));

  // ---------- Reset (protected, per module, with backup) ----------
  const BACKUP_KEYS = { buildings: BACKUP_KEY, area: AREA_BACKUP_KEY, secondary: SEC_BACKUP_KEY, market: MKT_BACKUP_KEY, community: COM_BACKUP_KEY,
    lingo: LING_BACKUP_KEY, views: VIEW_BACKUP_KEY, objections: OBJ_BACKUP_KEY, services: SC_BACKUP_KEY };
  const memoryBackups = {};

  function writeBackup(section, data) {
    memoryBackups[section] = JSON.parse(JSON.stringify(data));
    try { localStorage.setItem(BACKUP_KEYS[section], JSON.stringify(data)); } catch (e) { /* memory backup only */ }
  }

  function readBackup(section) {
    try {
      const raw = localStorage.getItem(BACKUP_KEYS[section]);
      if (raw) return JSON.parse(raw);
    } catch (e) { /* ignore */ }
    return memoryBackups[section] || null;
  }

  function updateUndoButton() {
    el.undoResetBtn.hidden = !readBackup(activeSection);
  }

  function progressOf(section) { return section === "area" ? areaProgress : lvlProg(section); }
  function setPool(section, p) {
    if (section === "secondary") secProgress = p; else if (section === "market") mktProgress = p; else if (section === "community") comProgress = p;
    else if (section === "lingo") lingProgress = p; else if (section === "views") viewProgress = p; else if (section === "objections") objProgress = p;
    else if (section === "services") scProgress = p; else progress = p;
  }
  const NORMALIZE = { buildings: normalize, secondary: normalizeSec, market: normalizeMkt, community: normalizeCom, lingo: normalizeLing, views: normalizeView, objections: normalizeObj, services: normalizeSc };

  el.resetBtn.addEventListener("click", () => {
    const section = activeSection;
    const what = MODULE_NAME[section];
    const others = MODULE_ORDER.filter(x => x !== section).map(x => MODULE_NAME[x]);
    const typed = window.prompt("This deletes ALL " + what.toUpperCase() + " progress.\n" + others.slice(0, -1).join(", ") + " and " + others[others.length - 1] +
      " progress is NOT affected.\n\nType RESET to confirm:");
    if (typed === null) return;
    if (typed.trim().toUpperCase() !== "RESET") { showToast("Reset cancelled – progress kept"); return; }
    cancelTest();
    writeBackup(section, progressOf(section));
    setPool(section, section === "buildings" ? freshProgress() : freshPool());
    afterProgressChange();
    showToast(what + " progress reset – you can restore it");
  });

  el.undoResetBtn.addEventListener("click", () => {
    const section = activeSection;
    const backup = readBackup(section);
    if (!backup) return;
    if (!window.confirm("Restore your " + MODULE_NAME[section] + " progress from the backup?")) return;
    setPool(section, NORMALIZE[section](backup));
    memoryBackups[section] = null;
    try { localStorage.removeItem(BACKUP_KEYS[section]); } catch (e) { /* ignore */ }
    afterProgressChange();
    showToast("Progress restored");
  });

  // after reset / restore / import: re-derive chapters + curriculum, keep the level honest (no celebration)
  function afterProgressChange() {
    prepareProgress();
    meta().cur = 0;
    advanceCurriculum();
    levelSync(false);
    saveProgress();
    journeyOn = false;
    focus = null;
    lastId = null;
    applySectionUI();
    nextItem();
  }

  // ---------- Export / Import (move progress between Mac and iPhone) ----------
  function encodeStore() {
    const json = JSON.stringify(storeSnapshot());
    return "CA6:" + btoa(unescape(encodeURIComponent(json)));
  }

  function decodeStore(code) {
    const clean = String(code).trim().replace(/\s+/g, "");
    const prefix = clean.slice(0, 4);
    if (prefix !== "CA3:" && prefix !== "CA4:" && prefix !== "CA5:" && prefix !== "CA6:") return null;   // older codes stay importable
    try {
      const data = JSON.parse(decodeURIComponent(escape(atob(clean.slice(4)))));
      if (!data || !data.buildings || !data.areaFacts) return null;
      if (Number(prefix.charAt(2)) !== data.version) return null;
      return data;
    } catch (e) {
      return null;
    }
  }

  el.exportBtn.addEventListener("click", () => {
    const code = encodeStore();
    let copied = false;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(code).then(() => showToast("Progress code copied"), () => {});
        copied = true;
      }
    } catch (e) { /* fall back to the prompt */ }
    window.prompt("Your progress code" + (copied ? " (already copied)" : "") +
      ".\nOn the other device: Import progress → paste it.", code);
  });

  el.importBtn.addEventListener("click", () => {
    const code = window.prompt("Paste a progress code from your other device:");
    if (code === null) return;
    const data = decodeStore(code);
    if (!data) { showToast("That code doesn't look right – nothing changed"); return; }
    if (!window.confirm("Replace the progress on this device with the imported progress?\n\n" +
      "Your current progress is saved as a backup (Restore backup).")) return;
    cancelTest();
    MODULE_ORDER.forEach(sec => writeBackup(sec, lvlProg(sec)));
    writeBackup("area", areaProgress);
    progress = normalize(data.buildings);
    areaProgress = normalizeArea(data.areaFacts);
    // older codes: the modules they did not know yet start at zero
    secProgress = normalizeSec(data.secondaryFacts);
    mktProgress = normalizeMkt(data.marketFacts);
    comProgress = normalizeCom(data.communityFacts);
    lingProgress = normalizeLing(data.brokerLingoProgress);
    viewProgress = normalizeView(data.viewsProgress);
    objProgress = normalizeObj(data.objectionsProgress);
    scProgress = normalizeSc(data.serviceChargesProgress);
    settings = normalizeSettings(data.settings);
    mergeAreaIntoCommunity(); // older codes: their Area progress counts for Community
    afterProgressChange();
    showToast("Progress imported");
  });

  // Remember whether a button got focus from a mouse/finger or from the Tab key.
  let lastPointerDown = 0;
  document.addEventListener("pointerdown", (e) => {
    lastPointerDown = Date.now();
    const btn = e.target && typeof e.target.closest === "function" ? e.target.closest("button") : null;
    if (btn && btn.dataset) btn.dataset.pointerFocus = "1"; // also when it already had focus
  }, true);
  document.addEventListener("keydown", (e) => { if (e.code === "Tab") lastPointerDown = 0; }, true);
  document.addEventListener("focusin", (e) => {
    const t = e.target;
    if (t && t.dataset) t.dataset.pointerFocus = Date.now() - lastPointerDown < 800 ? "1" : "0";
  }, true);

  // True when a button was reached with Tab (not just clicked/tapped before)
  function keyboardFocused(node) {
    return !!(node && node.tagName === "BUTTON" && node.dataset && node.dataset.pointerFocus === "0");
  }

  function skipFromKey() {
    if (test && view.kind === "quiz" && view.picked === undefined) { showToast("In an exam: answer or tap “I don't know”"); return; }
    nextItem();
  }

  // ---------- Keyboard ----------
  document.addEventListener("keydown", (e) => {
    const active = document.activeElement;
    if (active && active.tagName === "SELECT") return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;

    if (active && active === el.meter && (e.code === "Space" || e.code === "Enter" || e.code === "NumpadEnter")) {
      e.preventDefault();
      toggleMeter();
      return;
    }

    if (active && active.tagName === "INPUT") {
      if (e.code === "Enter" || e.code === "NumpadEnter") {
        e.preventDefault();
        if (view.kind === "quiz" && view.picked === undefined) submitTyped(false);
        else { active.blur(); primaryAction(); }
      } else if (e.code === "Escape") {
        active.blur();
      }
      return;
    }

    if (introActive) { e.preventDefault(); endIntro(); return; }

    if (!el.settingsPanel.hidden) {
      if (e.code === "Escape") el.settingsPanel.hidden = true;
      return;
    }

    if (!el.debrief.hidden) {
      if (e.code === "Space" || e.code === "Enter" || e.code === "NumpadEnter") { e.preventDefault(); closeDebrief("go"); }
      else if (e.code === "Escape") closeDebrief("end");
      return;
    }

    if (!el.overlay.hidden) {
      if (e.code === "Space" || e.code === "Enter" || e.code === "NumpadEnter") {
        if (keyboardFocused(active)) return; // let the focused button do its own action
        e.preventDefault();
        closeOverlay("primary");
      }
      else if (e.code === "Escape") closeOverlay("secondary");
      return;
    }

    if (e.code === "Space" || e.code === "Enter" || e.code === "NumpadEnter") {
      if (keyboardFocused(active)) return; // Tab-focused button: the browser presses it
      e.preventDefault();
      if (active && active.tagName === "BUTTON") active.blur();
      primaryAction();
      return;
    }
    if (e.code === "ArrowRight") { e.preventDefault(); skipFromKey(); return; }

    const digit = /^(Digit|Numpad)([0-4])$/.exec(e.code);
    if (!digit) return;
    const n = Number(digit[2]);

    if (view.kind === "quiz" && view.picked === undefined) {
      e.preventDefault();
      if (n === 0) view.mode === "typed" ? submitTyped(true) : answerChoice(null);
      else if (view.mode === "mc" && n <= view.options.length) answerChoice(view.options[n - 1]);
    } else if (view.kind === "compare" && view.picked === undefined && (n === 1 || n === 2)) {
      e.preventDefault();
      answerBonus(n - 1);
    } else if (view.kind === "reverse" && view.picked === undefined && n >= 1 && n <= view.options.length) {
      e.preventDefault();
      answerBonus(n - 1);
    }
  });

  // Carry Area Knowledge progress over to Community Expert – once. The Area save itself is kept untouched.
  function mergeAreaIntoCommunity() {
    if (settings.areaMerged) return 0;
    let moved = 0;
    Object.keys(AREA_TO_COMMUNITY).forEach(aid => {
      const a = areaProgress.facts[aid];
      if (!a || !a.seen) return;
      const c = comState(AREA_TO_COMMUNITY[aid]);
      if (!c.seen || a.box > c.box) {
        Object.assign(c, JSON.parse(JSON.stringify(a)));
        moved++;
      }
    });
    settings.areaMerged = true;
    return moved;
  }

  // =====================================================
  // CURRICULUM – one chronological order of chapters across all modules. It decides what NEW knowledge comes next.
  // Foundation → area / community → buildings → views → market & prices → service charges → client language →
  // secondary process → deals → negotiation → objections. A step is done once it is taught (every item met, 90 % sit);
  // long-term mastery keeps growing through reviews. Nothing here depends on the calendar.
  // =====================================================
  const CURRICULUM_STEPS = [
    ["community", [0, 1, 2]], ["buildings", [0]], ["lingo", [0]],                                       // foundation
    ["community", [3, 4, 5, 6, 7, 8]], ["buildings", [1, 2]], ["views", [0, 1, 2]], ["lingo", [1]],     // area, buildings, orientation
    ["market", [0, 1, 2, 3, 4, 5]], ["services", [0, 1, 2, 3]], ["lingo", [2, 3]], ["community", [9]], ["views", [3]], // prices & clients
    ["secondary", [0, 1, 2, 3, 4, 5]], ["market", [6, 7, 8]], ["lingo", [4, 5]],                        // deals
    ["secondary", [6, 7, 8, 9]], ["objections", [0, 1, 2, 3, 4, 5, 6, 7]]                                // negotiation, objections, advanced
  ].reduce((out, [section, levels]) => out.concat(levels.map(li => ({ section, li }))), []);

  function stepAcquired(st) { return !!lvlProg(st.section).passed[st.li] || levelAcquired(st.li, st.section); }
  function currentStep() { return CURRICULUM_STEPS[meta().cur] || null; }
  // moves the curriculum forward (never back) and opens the chapter of the next step
  function advanceCurriculum() {
    const m = meta();
    while (m.cur < CURRICULUM_STEPS.length && stepAcquired(CURRICULUM_STEPS[m.cur])) m.cur++;
    const st = currentStep();
    if (st && lvlProg(st.section).reached < st.li) lvlProg(st.section).reached = st.li;
    return st;
  }

  // =====================================================
  // CONTINUE JOURNEY – one evergreen decision engine. Every time a card is needed it picks the most valuable activity:
  // 1 due reviews → 2 weak spots → 3 items being consolidated → 4 new curriculum knowledge → 5 mixed recall → 6 boss gate.
  // Activities run in short blocks inside one module, then the engine recalculates. No daily state and no daily finish line.
  // Real elapsed time only matters for memory: reviews come back after 1 / 3 / 7 / 14 days.
  // =====================================================
  let journeyOn = false;     // Continue Journey drives the session (manual tab = free practice)
  let focus = null;          // current block: { section, kind, li, n, max }
  let journeyAnswers = 0, sinceNew = 0, sinceMixed = 0, bossOfferAt = -999;
  const STARVE_AFTER = 24;   // after this many review answers, new knowledge gets its turn even if reviews remain
  const FOCUS_LABEL = { review: "Review queue", weak: "Weak spots", learn: "Consolidating", new: "New knowledge", free: "Free practice" };

  function sectionCounts(section, now) {
    let due = 0, weak = 0, learning = 0, seen = 0;
    moduleItems(section).forEach(it => {
      const st = stateOf(it);
      if (!st.seen) return;
      seen++;
      if (isReviewDue(st, now)) due++;
      if (isLearning(st)) learning++;
      if (isWeak(st, now)) weak++;
    });
    return { due, weak, learning, seen };
  }
  function learnedCount() { return allLearnItems().filter(i => { const st = stateOf(i); return st.seen && st.box >= 1; }).length; }
  function newAvailable(step) { return !!step && requiredItems(step.li, step.section).some(i => !stateOf(i).seen); }

  function chooseFocus(skip) {
    const now = Date.now(), c = {};
    MODULE_ORDER.forEach(sec => { c[sec] = sectionCounts(sec, now); });
    const ok = (sec, kind) => !skip.has(sec + ":" + kind);
    const step = advanceCurriculum();
    const fresh = newAvailable(step) || (!!step && c[step.section].learning === 0 && !stepAcquired(step));
    if (focus && focus.n < focus.max && ok(focus.section, focus.kind)) {
      const cf = c[focus.section];
      const valid = focus.kind === "review" ? cf.due + cf.learning > 0 : focus.kind === "weak" ? cf.weak > 0 : focus.kind === "learn" ? cf.learning > 0
        : focus.kind === "new" ? !!step && step.section === focus.section && step.li === focus.li
        : !fresh && MODULE_ORDER.every(sec => c[sec].due + c[sec].weak + c[sec].learning === 0);   // free practice yields to real work
      if (valid) return focus;
    }
    const mk = (kind, section, max, li) => ({ kind, section, max, li, n: 0 });
    const best = key => MODULE_ORDER.filter(sec => c[sec][key] > 0 && ok(sec, key === "due" ? "review" : key === "learning" ? "learn" : key)).sort((a, b) => c[b][key] - c[a][key])[0];
    if (fresh && sinceNew >= STARVE_AFTER && ok(step.section, "new")) return mk("new", step.section, 10, step.li);   // no starvation
    let sec;
    if ((sec = best("due"))) return mk("review", sec, Math.min(12, c[sec].due + 3));
    if ((sec = best("weak"))) return mk("weak", sec, Math.min(8, c[sec].weak + 1));
    if ((sec = best("learning"))) return mk("learn", sec, 10);
    const info = agentInfo();
    const learned = learnedCount();
    if (info.bossAvail && info.potential > info.level && journeyAnswers - bossOfferAt >= 40 && !skip.has("boss")) return { kind: "boss" };
    if (learned >= 12 && sinceMixed >= 45 && !skip.has("mixed")) return { kind: "mixed" };
    if (fresh && ok(step.section, "new")) return mk("new", step.section, 12, step.li);
    if (info.bossAvail && journeyAnswers - bossOfferAt >= 40 && !skip.has("boss")) return { kind: "boss" };
    if (learned >= 5 && sinceMixed >= 10 && !skip.has("mixed")) return { kind: "mixed" };
    return null;
  }

  function enterFocus(f) {
    const changed = !focus || focus.section !== f.section || focus.kind !== f.kind || focus.li !== f.li;
    focus = f;
    if (f.section !== activeSection) switchSection(f.section);
    if (getFilter(f.section) !== "all") { setFilter(f.section, "all"); el.filterSelect.value = "all"; }
    MODULE_ORDER.forEach(sec => { weakMode[sec] = false; practiceAnyway[sec] = false; });
    weakMode[f.section] = f.kind === "weak";
    practiceAnyway[f.section] = f.kind === "free";
    if (f.kind === "new") {
      const p = lvlProg(f.section);
      if (p.reached < f.li) p.reached = f.li;
      p.currentLevel = f.li;
      sinceNew = 0;
    }
    if (changed) showToast("Mission · " + FOCUS_LABEL[f.kind] + " · " + MODULE_NAME[f.section] + (f.kind === "new" ? " – Chapter " + (f.li + 1) : ""));
  }

  function journeyNext() {
    const skip = new Set();
    for (let guard = 0; guard < 16; guard++) {
      const f = chooseFocus(skip);
      if (!f) break;
      if (f.kind === "boss") { bossOfferAt = journeyAnswers; offerBoss(); return; }
      if (f.kind === "mixed") { sinceMixed = 0; if (startMixed(true)) return; skip.add("mixed"); continue; }
      if (f !== focus) enterFocus(f);
      if (sectionStep(f.kind !== "new" && f.kind !== "free").ok) return;
      skip.add(f.section + ":" + f.kind);
      focus = null;
    }
    focus = null;
    view = { kind: "clear" };
    render();
  }

  function continueJourney() {
    if (!el.overlay.hidden) { el.overlay.hidden = true; overlayActions = { primary: null, secondary: null }; }
    timerTouch(true);
    if (meta().timer.paused) { meta().timer.paused = false; timerTouch(); }
    if (test) { scrollToCard(); return; }                      // finish the running exam first
    const wasOn = journeyOn;
    journeyOn = true;
    setMode("train");
    applySectionUI();
    if (wasOn && (view.kind === "intro" || (view.kind === "quiz" && view.picked === undefined))) { render(); scrollToCard(); return; }
    focus = null;
    sysAck(wasOn ? "JOURNEY RESUMED" : "TRAINING SEQUENCE ACTIVE");
    nextItem();
    scrollToCard();
  }

  function startFreePractice() {
    const now = Date.now();
    const sec = MODULE_ORDER.slice().sort((a, b) => sectionCounts(b, now).seen - sectionCounts(a, now).seen)[0];
    journeyOn = true;
    enterFocus({ kind: "free", section: sec, max: 12, n: 0 });
    if (!sectionStep(true).ok) { focus = null; view = { kind: "clear" }; render(); }
  }

  // =====================================================
  // AGENT SYSTEM – the only rank. Level from Journey via levelThreshold() (99 equal steps of 100/99 %), capped by the first
  // boss not yet defeated; an earned level is never taken away (Knowledge Recovery instead).
  // XP is a lifetime performance score: it never moves the level.
  // =====================================================
  const AGENT_MAJOR = { 1: "Rookie Agent", 10: "Creek Scout", 20: "Area Agent", 30: "Client Specialist", 40: "Market Operator", 50: "Deal Maker",
    60: "Negotiator", 70: "Senior Broker", 80: "Creek Harbour Expert", 90: "Elite Agent", 100: "Creek Harbour Master" };
  const AGENT_MINOR = { 5: "Hustler", 15: "Building Apprentice", 25: "Area Insider", 35: "Buyer Specialist", 45: "Pricing Specialist", 55: "Transaction Specialist",
    65: "Objection Specialist", 75: "Closing Specialist", 85: "Master Broker", 95: "Shadow Tycoon" };
  const ALL_MODULES = ["buildings", "secondary", "market", "community", "lingo", "views", "services", "objections"];
  const BOSSES = [
    { lv: 10, name: "Foundation Boss", mods: ["community", "buildings", "lingo"], size: 25 },
    { lv: 20, name: "Area Boss", mods: ["community", "buildings", "views", "lingo"], size: 25 },
    { lv: 30, name: "Building Boss", mods: ["buildings", "views", "community", "services", "market"], size: 30 },
    { lv: 40, name: "Market Boss", mods: ["market", "services", "buildings", "views"], size: 30 },
    { lv: 50, name: "Pricing & Clients Boss", mods: ["market", "services", "lingo", "community"], size: 35 },
    { lv: 60, name: "Deals Boss", mods: ["secondary", "market", "lingo"], size: 35 },
    { lv: 70, name: "Broker Communication Boss", mods: ["lingo", "objections", "secondary"], size: 40 },
    { lv: 80, name: "Negotiation Boss", mods: ["objections", "secondary", "lingo", "market"], size: 40 },
    { lv: 90, name: "Elite Specialist Boss", mods: ALL_MODULES, size: 50 },
    { lv: 100, name: "Creek Harbour Master Exam", mods: ALL_MODULES, size: 80 }
  ];
  const MODULE_OF_TYPE = { b: "buildings", s: "secondary", m: "market", c: "community", l: "lingo", v: "views", g: "services", o: "objections" };
  const MODULE_NAME = { buildings: "Buildings", secondary: "Secondary Deals", market: "Market Intelligence", community: "Community Expert", lingo: "Broker Lingo",
    views: "Views & Orientation", services: "Service Charges", objections: "Objection Handling" };

  function normalizeMeta(m) {
    const o = m && typeof m === "object" ? m : {};
    const fx = o.fx && typeof o.fx === "object" ? o.fx : {};
    const tm = o.timer && typeof o.timer === "object" ? o.timer : {};
    return {
      xp: typeof o.xp === "number" && o.xp >= 0 ? o.xp : 0,
      bosses: o.bosses && typeof o.bosses === "object" ? o.bosses : {},
      lastLevel: typeof o.lastLevel === "number" ? o.lastLevel : 0,
      earned: typeof o.earned === "number" && o.earned >= 1 ? Math.min(100, Math.floor(o.earned)) : 0,   // highest Agent Level legitimately earned (0 = derive on load)
      cur: typeof o.cur === "number" && o.cur >= 0 ? o.cur : 0,                      // curriculum position
      bestCombo: typeof o.bestCombo === "number" ? o.bestCombo : 0,
      mission: normalizeMission(o.mission),                                          // the running session mission (resumable, replaceable)
      best: normalizeBest(o.best),                                                   // personal session bests (shown only when beaten)
      fx: { motion: ["full", "medium", "reduced"].includes(fx.motion) ? fx.motion : "", sound: !!fx.sound, glow: fx.glow === "high" ? "high" : "normal" },
      timer: { session: +tm.session || 0, lifetime: +tm.lifetime || 0, paused: !!tm.paused, lastActivity: +tm.lastActivity || 0 }
    };
  }
  function meta() { if (!settings.meta) settings.meta = normalizeMeta(null); return settings.meta; }

  // every unique learning item of all 8 modules (the 852 the Journey counts) – built once
  let allItemsCache = null;
  function allLearnItems() {
    if (allItemsCache) return allItemsCache;
    const out = [];
    LEVELS.forEach(lv => buildings.filter(b => hasValue(b, lv.field)).forEach(b => out.push({ type: "b", id: b.id + ":" + lv.field, bid: b.id, b, field: lv.field })));
    secondaryFacts.forEach(f => out.push({ type: "s", id: f.id, fact: f }));
    marketFacts.filter(f => !f.orientation).forEach(f => out.push({ type: "m", id: f.id, fact: f }));
    communityFacts.forEach(f => out.push({ type: "c", id: f.id, fact: f }));
    brokerLingo.forEach(f => out.push({ type: "l", id: f.id, fact: f }));
    viewFacts.forEach(f => out.push({ type: "v", id: f.id, fact: f }));
    scFacts.forEach(f => out.push({ type: "g", id: f.id, fact: f }));
    objFacts.forEach(f => out.push({ type: "o", id: f.id, fact: f }));
    allItemsCache = out;
    return out;
  }
  function progOfItem(item) { return lvlProg(MODULE_OF_TYPE[item.type]); }

  function milestoneTitle(level) {
    let best = 1;
    Object.keys(AGENT_MAJOR).concat(Object.keys(AGENT_MINOR)).map(Number).forEach(k => { if (k <= level && k > best) best = k; });
    return AGENT_MAJOR[best] || AGENT_MINOR[best];
  }
  function nextAscension(level) {
    const k = Object.keys(AGENT_MAJOR).map(Number).filter(x => x > level).sort((a, b) => a - b)[0];
    return k ? { lv: k, name: AGENT_MAJOR[k] } : null;
  }
  function bandOf(level) { return level >= 100 ? 10 : Math.floor(level / 10); }

  // ---------- THE canonical level math (the only place Journey % ↔ Agent Level is defined) ----------
  // 100 levels spread evenly over 0–100 % Journey: 99 equal intervals of 100/99 %. Level 1 starts at 0 %,
  // Level 100 only at exactly 100 % (and only once the final boss has fallen – see agentInfo).
  const LEVEL_EPS = 1e-9;
  function levelThreshold(level) {
    const L = Math.max(1, Math.min(100, Math.round(level)));
    return L >= 100 ? 100 : (L - 1) * 100 / 99;
  }
  function potentialLevelFromJourney(pct) {
    if (pct >= 100 - LEVEL_EPS) return 100;
    return Math.max(1, Math.min(99, 1 + Math.floor(pct * 99 / 100 + LEVEL_EPS)));
  }
  // 0…1 inside the level's own Journey interval
  function levelProgressWithinCurrentLevel(pct, level) {
    if (level >= 100) return 1;
    const lo = levelThreshold(level), hi = levelThreshold(level + 1);
    return Math.max(0, Math.min(1, (pct - lo) / (hi - lo)));
  }
  function bossCap() {
    const b = meta().bosses;
    for (const B of BOSSES) {
      if (B.lv === 100) return b[100] ? 100 : 99;
      if (!b[B.lv]) return B.lv;
    }
    return 100;
  }

  // the Agent: earned level (never lost), live knowledge level (honest, may fall), boss gates
  function agentInfo(jIn) {
    const j = jIn || journey();
    const m = meta(), b = m.bosses;
    const potential = potentialLevelFromJourney(j.pct);
    const cap = bossCap();
    const live = Math.min(potential, cap);                                   // what the knowledge earns right now
    const earned = m.earned >= 1 ? Math.min(m.earned, cap) : 0;             // what was legitimately reached before
    const level = Math.max(live, earned, 1);
    const recovery = level > 1 && level < 100 && j.pct < levelThreshold(level) - LEVEL_EPS;
    const gated = !recovery && level < 100 && potential > level;
    const gateBoss = BOSSES.find(B => !b[B.lv]) || null;
    let bossAvail = null;
    if (gateBoss) {
      if (gateBoss.lv < 100 && level >= gateBoss.lv) bossAvail = gateBoss;
      if (gateBoss.lv === 100 && level >= 99 && j.pct >= 100 - LEVEL_EPS) bossAvail = gateBoss;
    }
    const lastDefeated = BOSSES.filter(B => b[B.lv]).pop() || null;
    // the bar: the real Journey interval of the displayed level – in recovery, the way back up to its threshold
    const into = level >= 100 || gated ? 1 : recovery ? levelProgressWithinCurrentLevel(j.pct, level - 1) : levelProgressWithinCurrentLevel(j.pct, level);
    const target = level >= 100 ? 100 : recovery ? levelThreshold(level) : levelThreshold(level + 1);
    const toGo = level >= 100 || gated ? 0 : Math.max(0, target - j.pct);
    return { level, live, potential, cap, gated, recovery, title: milestoneTitle(level), next: nextAscension(level), band: bandOf(level), bossAvail, gateBoss, lastDefeated, into, target, toGo, j };
  }
  // truthful distance text: "0.28 % Journey to Lv 2"
  function fmtGap(v) { return (Math.max(0.01, Math.round(v * 100) / 100)).toFixed(2); }
  function fmtPct2(v) { return (Math.round(v * 100) / 100).toFixed(2); }

  // =====================================================
  // THE ASCENSION CORE – an original obsidian artifact that grows more complex with every 10-level band (11 forms).
  // Pure SVG; the motion lives in CSS so Reduced Motion can switch it off.
  // =====================================================
  const CORE_FORMS = ["Dormant Core", "Awakened Core", "Resonant Core", "Architect Core", "Arc Core", "Golden Core",
    "Ascendant Core", "Sovereign Core", "Elite Core", "Master Core", "Creek Harbour Master Core"];
  const CORE_ENERGY = ["#4E52B8", "#5A61D6", "#6774F2", "#6F86FF", "#8466FF", "#8F63FF", "#8A58FF", "#7A5CFF", "#7C5CFF", "#8F7CFF", "#A48DFF"];
  const CORE_SPARK = ["#6E78D8", "#7F92F0", "#8EAAFF", "#98B9FF", "#4FA3FF", "#6DB6FF", "#58C4FF", "#62CCFF", "#3FD0FF", "#7FE0FF", "#A6ECFF"];

  function coreSVG(band, pre) {
    band = Math.max(0, Math.min(10, band | 0));
    const id = (pre || "cr") + band;
    const E = CORE_ENERGY[band], S = CORE_SPARK[band];
    const gold = band >= 5, plat = band >= 10;
    const edge = plat ? "url(#" + id + "p)" : gold ? "url(#" + id + "m)" : "#8790B4";
    const pt = (r, deg) => { const a = deg * Math.PI / 180; return (r * Math.sin(a)).toFixed(2) + " " + (-r * Math.cos(a)).toFixed(2); };
    const star = (n, ro, ri, rot) => { let d = ""; for (let i = 0; i < n * 2; i++) d += (i ? " L" : "M") + pt(i % 2 ? ri : ro, rot + i * 180 / n); return d + " Z"; };
    const vb = band <= 1 ? 76 : band <= 3 ? 86 : band <= 6 ? 94 : 100;   // early forms are framed closer – smaller structure, never lost in empty space
    let s = '<svg class="core b' + band + '" viewBox="' + (-vb) + " " + (-vb) + " " + (2 * vb) + " " + (2 * vb) + '" role="img" aria-label="' + CORE_FORMS[band] + '"><defs>' +
      '<radialGradient id="' + id + 'g"><stop offset="0" stop-color="' + E + '" stop-opacity=".95"/><stop offset=".38" stop-color="' + E + '" stop-opacity=".32"/><stop offset="1" stop-color="' + E + '" stop-opacity="0"/></radialGradient>' +
      '<radialGradient id="' + id + 'h"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".35" stop-color="' + S + '"/><stop offset="1" stop-color="' + E + '" stop-opacity="0"/></radialGradient>' +
      '<linearGradient id="' + id + 'm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8E6D38"/><stop offset=".35" stop-color="#F7E7C1"/><stop offset=".6" stop-color="#C9A86A"/><stop offset="1" stop-color="#9C7A43"/></linearGradient>' +
      '<linearGradient id="' + id + 'p" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B9C0CE"/><stop offset=".4" stop-color="#FFFFFF"/><stop offset=".7" stop-color="#EAD5A2"/><stop offset="1" stop-color="#A2AABB"/></linearGradient>' +
      "</defs>";
    // energy field
    s += '<circle class="c-aura" r="' + (40 + band * 4.6) + '" fill="url(#' + id + 'g)" opacity="' + (0.3 + band * 0.055).toFixed(2) + '"/>';
    if (band >= 4) s += '<circle class="c-spin-rev" r="82" fill="none" stroke="' + S + '" stroke-opacity=".28" stroke-width=".7" stroke-dasharray="1 5"/>' +
      '<circle class="c-spin" r="86" fill="none" stroke="' + E + '" stroke-opacity=".18" stroke-width=".6" stroke-dasharray="26 14"/>';
    if (band >= 9) s += '<circle class="c-spin" r="93" fill="none" stroke="' + edge + '" stroke-opacity=".5" stroke-width=".5" stroke-dasharray="2 4"/>';
    // abstract skyline crown – towers rising from a ring (Sovereign and above)
    if (band >= 7) {

  function metaAnswer(correct, item, prevBox, wasWeak, typed, wasDue, instant) {
    const st = stateOf(item);
    timerTouch();
    if (!correct) {
      // a miss is marked very quietly as a target – the strong moment is TARGET CLEARED later
      return { ok: false, label: "TARGET ACQUIRED", sub: play.lastBroken >= 5 ? "COMBO x" + play.lastBroken + " BROKEN" : "", soft: true };
    }
    // repeating a delayed review before it is due: the memory box rightly stays – so only a small practice reward
    const practice = wasDue === false && st.box === prevBox;
    instant = !!instant && !practice;
    const xp = practice ? PRACTICE_XP : xpForAnswer(item, prevBox, st.box, wasWeak, typed) + comboBonus() + (instant ? IR_XP : 0);
    awardXP(xp);
    play.round.xp += xp;
    const recovered = !practice && wasWeak && st.box >= SITS_BOX && prevBox < SITS_BOX;
    const stageLabel = feedbackLabel(true, prevBox, st.box, typed);
    const mastered = stageLabel === "MASTERY ACHIEVED", milestone = isComboMilestone(play.combo);
    const stage = !practice && st.box > prevBox && ["RETENTION CONFIRMED", "KNOWLEDGE UPGRADED", "MASTERY CONFIRMED"].includes(stageLabel);
    const base = { ok: true, xp, prevBox, box: st.box, instant, recovered, milestone, practice,
      secured: !practice && prevBox < SITS_BOX && st.box >= SITS_BOX, review: !practice && prevBox >= SITS_BOX && wasDue !== false };
    if (practice) return Object.assign(base, { quiet: true, tier: 1, label: "", sub: "" });
    if (mastered) return Object.assign(base, { tier: 4, label: stageLabel, sub: instant ? "INSTANT RECALL" : "" });
    if (recovered) return Object.assign(base, { tier: 3, label: "TARGET CLEARED", sub: "WEAK POINT ELIMINATED" + (instant ? " · INSTANT" : "") });
    if (instant) return Object.assign(base, { tier: 2, label: "INSTANT RECALL", sub: stage ? stageLabel : milestone ? "COMBO x" + play.combo : "" });
    if (stage) return Object.assign(base, { tier: 2, label: stageLabel, sub: milestone ? "COMBO x" + play.combo : "" });
    if (milestone) return Object.assign(base, { tier: 3, label: "COMBO x" + play.combo, sub: comboTier(play.combo)[1] });
    return Object.assign(base, { quiet: true, tier: 1, label: "", sub: "" });
  }
  // a close approximate number: restrained amber feedback, a small XP nod, no red failure
  const CLOSE_XP = 2;
  function metaClose() {
    timerTouch();
    awardXP(CLOSE_XP);
    if (!test) play.round.xp += CLOSE_XP;
    return { ok: false, close: true, label: "CLOSE", sub: "ANCHOR ALMOST LOCKED", xp: CLOSE_XP };
  }
  // inside boss exams, mixed recall and module challenges – kept fast for long exams
  function metaTestAnswer(correct, instant) {
    timerTouch();
    const boss = !!(test && test.boss);
    if (!correct) return boss ? { ok: false, label: "HIT TAKEN", sub: comboBrokeText(), boss } : { ok: false, label: "TARGET ACQUIRED", sub: "", soft: true };
    const xp = (test && (test.boss || test.mixed || test.lightning || test.call) ? 12 : 6) + comboBonus() + (instant ? IR_XP : 0);
    awardXP(xp);
    const milestone = isComboMilestone(play.combo);
    if (boss) return { ok: true, label: "CRITICAL HIT", sub: play.combo >= 5 ? "COMBO x" + play.combo : "", tier: 5, xp, milestone, fast: true };
    if (instant) return { ok: true, label: "INSTANT RECALL", sub: milestone ? "COMBO x" + play.combo : "", tier: 2, xp, instant: true, milestone, fast: true };
    if (milestone) return { ok: true, label: "COMBO x" + play.combo, sub: comboTier(play.combo)[1], tier: 3, xp, milestone, fast: true };
    return { ok: true, quiet: true, label: "", sub: "", tier: 1, xp, fast: true };
  }

  // ---------- reward sequencing: one answer can trigger several rewards – they play in order, never on top of each other
  // 1 answer impact (now) · 2 level-up (after the hit lands) · 3 chapter milestone (after the level-up) · combo / XP live in the HUD
  const LEVELUP_AT = 380, LEVELUP_MS = 1250, CHAPTER_MS = 1050;
  function later(ms, fn) { if (ms > 0 && fxOn()) setTimeout(fn, ms); else fn(); }
  function playRewards(fb, lv, chapter) {
    if (fb.close) playCloseFX(fb); else if (fb.ok) playCorrectFX(fb); else playWrongFX(fb.label, fb.sub);
    // returns the EARLIEST moment (ms) the next card may appear: a level-up is always seen in full first
    let at = 0, minDelay = 0;
    if (lv && lv.kind === "level") {
      later(LEVELUP_AT, () => showLevelUp(lv.from, lv.info));
      at = LEVELUP_AT + LEVELUP_MS - 150;
      minDelay = LEVELUP_AT + LEVELUP_MS + 100;
    }
    if (chapter) {
      later(at || 420, () => showChapterClear(chapter));
      minDelay = Math.max(minDelay, (at || 420) + 400);
    }
    return minDelay;
  }

  // the HUD is the reward center while training (the big core is hidden) – the core reacts only when it can be seen
  function heroVisible() { return uiMode === "command" && heroInView; }
  const HUD_REACT = ["r-ok", "r-hard", "r-gold", "r-bad", "r-recover", "r-near"];
  function hudReact(kind) {
    if (!el.hud || !el.hud.classList) return;
    el.hud.classList.remove(...HUD_REACT);
    restartAnim(el.hud, "r-" + kind);
  }
  function hudReactCorrect(hard) { hudReact(hard ? "hard" : "ok"); }
  function hudReactCombo() { restartAnim(el.hud, "combo-hit"); }
  function hudReactMastery() { hudReact("gold"); }
  function hudReactWrong() { hudReact("bad"); }
  // core in the Command Center, HUD everywhere else
  function agentReact(kind) {
    if (heroVisible()) { coreReact(kind === "hard" || kind === "near" ? "ok" : kind === "recover" ? "gold" : kind); return; }
    if (kind === "near") { hudReact("near"); return; }
    if (kind === "combo") hudReactCombo();
    else if (kind === "gold") hudReactMastery();
    else if (kind === "bad") hudReactWrong();
    else if (kind === "recover") hudReact("recover");
    else hudReactCorrect(kind === "hard");
  }

  // NORMAL AGENT LEVEL-UP – a ~1.2 s, non-blocking event above the question (ten-level ascensions stay much bigger)
  function levelUpY() {
    if (typeof el.card.querySelector !== "function" || typeof window.innerHeight !== "number") return null;
    const opt = el.card.querySelector(".opt") || el.card.querySelector(".answer-input");
    const vh = window.innerHeight, cap = vh * 0.34;
    const y = opt ? Math.min(cap, opt.getBoundingClientRect().top - 78) : cap;
    return Math.max(150, y);
  }
  function showLevelUp(from, info) {
    el.fxBurst.classList.add("yield");                       // the answer label steps aside for the bigger event
    el.fxLevel.innerHTML = '<div class="lu-in"><div class="lu-k">Level up</div>' +
      '<div class="lu-n"><span>' + from + '</span><i>→</i><b>' + info.level + "</b></div>" +
      '<div class="lu-t">' + esc(info.title) + "</div>" + (info.gated ? '<div class="lu-g">⚔ Boss gate ahead</div>' : "") + "</div>";
    const y = levelUpY();
    el.fxLevel.style.top = y === null ? "" : y + "px";
    restartAnim(el.fxLevel, "play");
    screenFlash("level");
    risingParticles(el.fxLevel, 26);
    if (heroVisible()) coreReact("gold");
    sound("level");
  }
  function risingParticles(anchor, n) {
    const count = fxBudget(n);
    if (!count || !fxOn() || typeof anchor.getBoundingClientRect !== "function") return;
    const r = anchor.getBoundingClientRect(), cx = window.innerWidth / 2, cy = (r.top || window.innerHeight * 0.34) + 40;
    for (let i = 0; i < count; i++) {
      const d = fxNode("rise", cx + (Math.random() - 0.5) * Math.min(300, window.innerWidth * 0.8), cy + Math.random() * 30, 1300);
      d.style.setProperty("--dx", (Math.random() - 0.5) * 40 + "px");
      d.style.setProperty("--dy", -(90 + Math.random() * 120) + "px");
      d.style.animationDelay = (Math.random() * 0.25).toFixed(2) + "s";
      d.style.background = d.style.color = ["#FFFFFF", "#9FD0FF", "#F3DFB0", "#C8B2FF"][i % 4];
    }
  }
  // CHAPTER CLEARED – a smaller, restrained blue / gold milestone
  function showChapterClear(c) {
    el.fxMile.innerHTML = '<div class="mi-in"><b>Chapter cleared</b><span>' + esc(MODULE_NAME[c.section] + (c.title ? " · " + c.title : "")) + "</span><em>+" + c.xp + " XP" + (c.next ? " · next: " + esc(c.next) : "") + "</em></div>";
    restartAnim(el.fxMile, "play");
    if (!heroVisible()) hudReact("gold");
  }

  // ---------- level-ups & ascensions ----------
  // commits the earned level (it only ever rises) and reports what to celebrate:
  // null · { kind: "level", from, info } · { kind: "ascension" } (the ascension overlay is already open)
  function levelSync(celebrateIt) {
    const m = meta();
    const info = agentInfo();                       // without an earned value yet this is simply the live level (migration)
    if (info.level > m.earned) m.earned = info.level;
    if (m.lastLevel < 1 || !celebrateIt || info.level < m.lastLevel) { m.lastLevel = info.level; return null; }
    if (info.level === m.lastLevel) return null;
    const from = m.lastLevel;
    m.lastLevel = info.level;
    saveProgress();
    if (bandOf(info.level) > bandOf(from)) { sound("ascend"); showAscension(bandOf(from), info, null); return { kind: "ascension", from, info }; }
    return { kind: "level", from, info };
  }

  // the ascension sequence: the old core slows, energy collapses inward, a flash – and the new form appears
  function showAscension(fromBand, info, boss) {
    celebrate();
    let pull = "";
    for (let i = 0; i < 14; i++) pull += '<i style="--a:' + (i * 360 / 14) + 'deg;--d:' + (i % 4) * 0.06 + 's"></i>';
    showOverlay({
      kicker: boss ? "Boss defeated · " + boss.bossName : "Ascension complete",
      title: "Level " + info.level,
      text: info.title + " · " + CORE_FORMS[info.band] + (bandOf(info.level) > fromBand ? " awakens" : "") + ". Journey " + fmtPct(info.j.pct) + " % · " + meta().xp.toLocaleString("en-US") + " XP" +
        (boss ? " · " + boss.correct + " / " + boss.items.length + " – the gate is open." : "."),
      art: '<div class="asc"><div class="asc-old">' + coreSVG(fromBand, "ao") + '</div><div class="asc-ring"></div><div class="asc-pull">' + pull + '</div><div class="asc-flash"></div><div class="asc-new">' + coreSVG(info.band, "an") + "</div></div>",
      tone: "ascension",
      primary: "Continue Journey", secondary: "Close",
      onPrimary: () => continueJourney(), onSecondary: () => nextItem()
    });
  }

  // BOSS DEFEATED · GATE OPEN – stronger than a level-up, lighter than an ascension. The Core stays exactly what it is;
  // only when the opened gate releases stored Journey into a HIGHER band does the real ascension follow.
  function showBossVictory(t, fromLevel, fromBand, info, xp) {
    const bandUp = info.band > fromBand;
    let shards = "";
    for (let i = 0; i < 10; i++) shards += '<i style="--a:' + (i * 36 + 8) + 'deg;--d:' + (i % 3) * 0.05 + 's"></i>';
    const lvLine = info.level > fromLevel ? " Level " + fromLevel + " → Level " + info.level + " unlocked." : " Level " + info.level + " confirmed – the road to Level " + Math.min(100, info.level + 1) + " is open.";
    showOverlay({
      kicker: "Boss defeated", title: t.bossName,
      text: "Gate open." + lvLine + " +" + xp.toLocaleString("en-US") + " XP · " + t.correct + " / " + t.items.length + " correct." + (bandUp ? " Your Core is ready to ascend." : ""),
      art: '<div class="bv"><div class="bv-hp"><i></i></div><div class="bv-core">' + coreSVG(fromBand, "bv") + '</div><div class="bv-shards">' + shards + '</div><div class="bv-gate"></div><div class="bv-tag">GATE OPEN</div></div>',
      tone: "victory bosswin",
      primary: bandUp ? "Ascend" : "Continue Journey", secondary: bandUp ? "" : "Close",          // a real band change always plays
      onPrimary: () => bandUp ? (sound("ascend"), showAscension(fromBand, info, null)) : continueJourney(),
      onSecondary: () => bandUp ? showAscension(fromBand, info, null) : nextItem()
    });
    if (fxOn()) celebrate();
    if (heroVisible()) coreReact("gold"); else hudReact("gold");
  }

  // ---------- boss exams & mixed recall (reuse the exam engine) ----------
  function seenItems(mods) {
    return allLearnItems().filter(it => (!mods || mods.includes(MODULE_OF_TYPE[it.type])) && stateOf(it).seen);
  }
  // how demanding an item is as a boss question (random tie-break keeps every exam different)
  function hardness(i) {
    const f = i.fact || {};
    let h = Math.random();
    if (typedSpec(i) || numericLearningMode(i) === "approxTyped" || numericLearningMode(i) === "approxBand") h += 1;   // recall under the numeric policy
    if (/scenario|risk|client|sequence|calc|investor|comparison|yield|position/.test((f.type || "") + " " + (f.kind || ""))) h += 1;
    if (i.type === "o" || i.type === "l") h += 0.6;                                                            // reasoning / recall variants
    return h;
  }
  // balanced across the boss's modules, only knowledge you have actually learned, hardest material first
  function bossItems(B) {
    let base = seenItems(B.mods).filter(i => stateOf(i).box >= 1);
    if (base.length < B.size) base = seenItems(B.mods);
    const by = {};
    base.map(i => ({ i, h: hardness(i) })).sort((a, b) => a.h - b.h).forEach(({ i }) => { const m = MODULE_OF_TYPE[i.type]; (by[m] = by[m] || []).push(i); });
    const out = [];
    let mods = Object.keys(by);
    while (out.length < B.size && mods.length) {
      mods.forEach(m => { if (out.length < B.size && by[m].length) out.push(by[m].pop()); });
      mods = mods.filter(m => by[m].length);
    }
    if (out.length < B.size) {
      const have = new Set(out.map(i => i.type + i.id));
      shuffle(seenItems(null).filter(i => !have.has(i.type + i.id))).slice(0, B.size - out.length).forEach(i => out.push(i));
    }
    return shuffle(out);
  }
  function startBoss(B) {
    if (!B) return;
    const items = bossItems(B);
    if (items.length < Math.min(B.size, 20)) { showToast("Not enough trained knowledge for this boss yet"); return; }
    beginSpecialTest({ boss: B.lv, bossName: B.name, items });
  }
  function startMixed(quick) {
    const items = shuffle(seenItems(null).filter(i => stateOf(i).box >= 1)).slice(0, quick ? 8 : 10);
    if (items.length < 5) { showToast("Train a little more first – mixed recall uses what you've already learned"); return false; }
    beginSpecialTest({ mixed: true, items });
    return true;
  }
  function offerBoss() {
    const info = agentInfo(), B = info.bossAvail;
    showOverlay({
      kicker: "Boss gate · Level " + B.lv, title: B.name,
      text: (info.potential > info.level ? "Your knowledge has outgrown Level " + B.lv + ". " : "") + B.size + " hard questions from what you have learned – typed recall, reverse recall, calculations, scenarios and objection reasoning. No hints. 90 % opens the gate.",
      art: '<div class="boss-core">' + coreSVG(info.band, "bo") + "</div>", tone: "boss",
      primary: "⚔ Enter the boss exam", secondary: "Keep training",
      onPrimary: () => startBoss(B), onSecondary: () => nextItem()
    });
  }
  function beginSpecialTest(o) {
    cancelTest();
    clearTimer();
    if (!el.overlay.hidden) { el.overlay.hidden = true; overlayActions = { primary: null, secondary: null }; }
    weakMode[activeSection] = false;
    test = Object.assign({ section: activeSection, li: -1, idx: 0, correct: 0, missed: [], missedMods: [] }, o);
    setMode("train");
    timerTouch(true);
    lastId = null;
    nextItem();
    scrollToCard();
  }
  function finishSpecial(t) {
    const total = t.items.length, need = testNeed(total);
    const mods = {};
    t.missedMods.forEach(m => { mods[m] = (mods[m] || 0) + 1; });
    const weakTxt = Object.keys(mods).sort((a, b) => mods[b] - mods[a]).map(m => MODULE_NAME[m] + " (" + mods[m] + ")").join(", ");
    if (t.lightning || t.call) {
      // special events are part of the flow: a short confirmation, then training goes on
      saveProgress();
      if (t.lightning) burst("checkpoint", "LIGHTNING ROUND", t.correct + " / " + total + (t.ir ? " · " + t.ir + " instant" : "") + (t.missed.length ? " · " + t.missed.length + " back into training" : ""));
      else burst("checkpoint", t.correct ? "CALL HANDLED" : "CALL LOGGED", t.correct ? "PROFESSIONAL ANSWER LOCKED IN" : "BACK INTO TRAINING");
      nextItem();
      return;
    }
    if (t.mixed) {
      // mixed recall is part of the flow: a checkpoint, then play goes on
      const xp = t.correct * 5 + (t.correct === total ? 20 : 0);
      awardXP(xp);
      saveProgress();
      burst("checkpoint", "MIXED RECALL", t.correct + " / " + total + " · +" + xp + " XP" + (t.missed.length ? " · " + t.missed.length + " back into training" : ""));
      nextItem();
      return;
    }
    if (t.correct >= need) {
      const m = meta();
      // 1 mark the boss · 2 the real XP · 3 recalculate the Agent · 4 compare the Core band.
      // BOSS VICTORY = the level gate opened. ASCENSION = the Core band really changed. Two separate events.
      const fromLevel = Math.max(1, m.lastLevel), fromBand = bandOf(fromLevel);
      m.bosses[t.boss] = true;
      const xp = 500 + t.boss * 10;
      awardXP(xp);
      missionBossDefeated(t.boss);
      const info = agentInfo();
      m.lastLevel = info.level;
      if (info.level > m.earned) m.earned = info.level;
      saveProgress();
      sound("boss");
      showBossVictory(t, fromLevel, fromBand, info, xp);
    } else {
      saveProgress();
      showOverlay({
        kicker: "Boss exam failed · Level " + t.boss,
        title: t.correct + " / " + total,
        text: "The gate holds – you need " + need + " / " + total + " (90 %). " + (weakTxt ? "Weak modules: " + weakTxt + ". " : "") + "Every missed question is now a weak spot. Retrain – the boss waits.",
        art: '<div class="fail-core">' + coreSVG(agentInfo().band, "fc") + "</div>", tone: "fail",
        primary: "Train weak spots", secondary: "Close", onPrimary: () => continueJourney(), onSecondary: () => nextItem()
      });
    }
    view = { kind: "pause" };
    render();
  }

  // ---------- focus timer: session based – a long pause starts a new session, midnight means nothing ----------
  const IDLE_PAUSE_MS = 5 * 60 * 1000, NEW_SESSION_MS = 30 * 60 * 1000;
  let timerLast = 0, timerSaveAt = 0, timerRunning = false;
  function timerTouch(startNew) {
    const t = meta().timer, now = Date.now();
    if (startNew && now - t.lastActivity > NEW_SESSION_MS) t.session = 0;
    t.lastActivity = now;
    if (!t.paused && !timerRunning) { timerRunning = true; timerLast = now; }
  }
  function timerTick() {
    const t = meta().timer, now = Date.now();
    if (timerRunning) {
      const dt = now - timerLast;
      if (dt > 0 && dt < 15000) { t.session += dt; t.lifetime += dt; }
      timerLast = now;
      if (t.paused || now - t.lastActivity > IDLE_PAUSE_MS || (typeof document.hidden === "boolean" && document.hidden)) timerRunning = false;
    }
    if (now - timerSaveAt > 20000 && timerRunning) { timerSaveAt = now; saveProgress(); }
    const node = document.getElementById("focusTime");
    if (node) node.textContent = fmtClock(t.session);
    const st = document.getElementById("focusState");
    if (st) st.textContent = t.paused ? "paused" : timerRunning ? "running" : "idle";
  }
  function fmtClock(ms) { const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = s % 60; return [h, m, x].map(v => String(v).padStart(2, "0")).join(":"); }
  function fmtDur(ms) { const m = Math.round(ms / 60000); return m < 60 ? m + " min" : Math.floor(m / 60) + "h " + (m % 60) + "m"; }
  if (typeof window.setInterval === "function") window.setInterval(timerTick, 1000);
  function toggleTimer() {
    const t = meta().timer;
    t.paused = !t.paused;
    if (t.paused) { timerTick(); timerRunning = false; } else timerTouch();
    saveProgress();
    renderHero();
  }

  // =====================================================
  // SESSION LAYER – Mission → Training → immediate feedback → competence gain → Debrief.
  // Nothing expires: a mission waits until it is done, and can be swapped for a fresh one at any time without penalty.
  // =====================================================
  const GOAL_TEXT = { secure: n => "Secure " + n + (n === 1 ? " fact" : " facts"), clear: n => "Clear " + n + (n === 1 ? " target" : " targets"),
    ir: n => n + " Instant " + (n === 1 ? "Recall" : "Recalls"), review: n => "Complete " + n + " due " + (n === 1 ? "review" : "reviews"), boss: (n, lv) => "Defeat the Level " + lv + " boss" };
  function newSeg() { const j = journey(), m = meta(); return { a: 0, c: 0, ir: 0, sec: 0, clr: 0, combo: 0, j0: j.pct, xp0: m.xp }; }
  function normalizeSeg(s) {
    const o = s && typeof s === "object" ? s : {};
    const num = v => typeof v === "number" && isFinite(v) && v >= 0 ? v : 0;
    return { a: num(o.a), c: num(o.c), ir: num(o.ir), sec: num(o.sec), clr: num(o.clr), combo: num(o.combo), j0: num(o.j0), xp0: num(o.xp0) };
  }
  function normalizeMission(o) {
    if (!o || typeof o !== "object" || !Array.isArray(o.goals) || !o.goals.length) return null;
    const goals = o.goals.filter(g => g && ["secure", "clear", "ir", "review", "boss"].includes(g.k)).slice(0, 3).map(g => ({ k: g.k, t: Math.max(1, g.t | 0), n: Math.max(0, g.n | 0) }));
    if (!goals.length) return null;
    return { goals, boss: o.boss | 0, done: !!o.done, ans: Math.max(0, o.ans | 0), event: !!o.event,
      pending: o.pending === "complete" || o.pending === "interim" ? o.pending : "", seg: normalizeSeg(o.seg) };
  }
  function normalizeBest(o) {
    const b = o && typeof o === "object" ? o : {};
    return { set: !!b.set, combo: Math.max(0, b.combo | 0), ir: Math.max(0, b.ir | 0), sec: Math.max(0, b.sec | 0) };
  }
  // built from the current learning state – 2–3 reachable goals (≈ 15–25 answers); a waiting boss is the mission on its own
  function makeMission(noBoss) {
    const info = agentInfo(), now = Date.now();
    const base = { boss: 0, done: false, ans: 0, event: false, pending: "", seg: newSeg() };
    if (info.bossAvail && !noBoss) return Object.assign(base, { goals: [{ k: "boss", t: 1, n: 0 }], boss: info.bossAvail.lv });
    let weak = 0, due = 0, known = 0, open = 0;
    allLearnItems().forEach(it => {
      const s = stateOf(it);
      if (isWeak(s, now)) weak++;
      if (isReviewDue(s, now)) due++;
      if (s.seen && s.box >= IR_MIN_BOX) known++;
      if (s.box < SITS_BOX) open++;
    });
    const goals = [];
    if (weak) goals.push({ k: "clear", t: Math.min(2, weak), n: 0 });
    if (due >= 3) goals.push({ k: "review", t: Math.min(6, due), n: 0 });
    if (open && goals.length < 3) goals.push({ k: "secure", t: goals.length >= 2 ? 2 : goals.length ? 3 : 4, n: 0 });
    if (known >= 8 && goals.length < 3) goals.push({ k: "ir", t: goals.length >= 2 ? 3 : 4, n: 0 });
    if (!goals.length) goals.push({ k: "ir", t: 3, n: 0 });
    return Object.assign(base, { goals });
  }
  function currentMission() {
    const m = meta();
    if (!m.mission) m.mission = makeMission();
    return m.mission;
  }
  // a goal never becomes impossible: if fewer targets / reviews exist now than it still asks for, it shrinks to what is left
  function missionSanitize(mi) {
    if (!mi || mi.done) return mi;
    const now = Date.now();
    let weak = 0, due = 0;
    allLearnItems().forEach(it => { const s = stateOf(it); if (isWeak(s, now)) weak++; if (isReviewDue(s, now)) due++; });
    mi.goals.forEach(g => {
      if (g.k === "clear") g.t = Math.max(g.n, Math.min(g.t, g.n + weak));
      if (g.k === "review") g.t = Math.max(g.n, Math.min(g.t, g.n + due));
      if (g.k === "boss" && !agentInfo().bossAvail && !meta().bosses[mi.boss]) g.t = Math.max(g.t, 1);
    });
    mi.goals = mi.goals.filter(g => g.t > 0);
    if (missionDoneNow(mi) && !mi.done) { mi.done = true; mi.pending = mi.pending || "complete"; }
    return mi;
  }
  function missionDoneNow(mi) { return mi.goals.length > 0 && mi.goals.every(g => g.n >= g.t); }
  function missionProgress() {
    const mi = meta().mission;
    if (!mi) return { done: 0, goals: 0, frac: 0 };
    const t = mi.goals.reduce((a, g) => a + g.t, 0), n = mi.goals.reduce((a, g) => a + Math.min(g.n, g.t), 0);
    return { done: mi.goals.filter(g => g.n >= g.t).length, goals: mi.goals.length, frac: t ? n / t : 0, complete: mi.done };
  }
  // every answer feeds the mission and the debrief stats; returns what changed for the HUD ring (null if nothing to show)
  function missionTrack(fb, correct, close) {
    if (test && (test.boss || test.challenge)) return null;     // exams have their own result screen – they never trigger a debrief
    const mi = currentMission(), s = mi.seg;
    const before = missionProgress().frac;
    s.a++; mi.ans++;
    if (correct) s.c++;
    s.combo = Math.max(s.combo, play.combo);
    const bump = (k, by) => { const g = mi.goals.find(x => x.k === k); if (g && g.n < g.t) g.n += by || 1; };
    if (fb && fb.ok) {
      if (fb.secured) { bump("secure"); s.sec++; }
      if (fb.recovered) { bump("clear"); s.clr++; }
      if (fb.instant) { bump("ir"); s.ir++; }
      if (fb.review) bump("review");
    }
    let justDone = false;
    if (!mi.done && missionDoneNow(mi)) { mi.done = true; mi.pending = "complete"; justDone = true; }
    else if (!mi.done && !mi.pending && s.a >= INTERIM_DEBRIEF_EVERY) mi.pending = "interim";
    const after = missionProgress().frac;
    return after > before || justDone ? { frac: after, justDone } : null;
  }
  function missionBossDefeated(lv) {
    const mi = meta().mission;
    if (!mi) return;
    const g = mi.goals.find(x => x.k === "boss");
    if (g && (!mi.boss || mi.boss === lv)) { g.n = 1; if (missionDoneNow(mi)) { mi.done = true; mi.pending = "complete"; } }
  }
  function missionRingFX(r) {
    if (!el.hudRing) return;
    restartAnim(el.hudRing, r.justDone ? "closing" : "tick");
    if (r.justDone) { hudReact("gold"); sound("level"); }
  }
  // swap the mission for a fresh one that fits the current learning state – no penalty, no message about loss
  function replaceMission() {
    const m = meta();
    const hadBoss = m.mission && m.mission.boss && !m.mission.done;
    m.mission = makeMission(hadBoss);
    saveProgress();
    renderHero();
    renderHud();
  }

  // the next card slot: a debrief that is due, or (rarely) a special event – otherwise normal training goes on
  const sessionEvents = { chance: EVENT_CHANCE };
  function sessionGate() {
    if (test || !journeyOn) return false;
    const mi = currentMission();
    if (mi.pending) { showDebrief(mi.pending); return true; }
    if (!mi.event && !mi.done && mi.ans >= EVENT_MIN_ANSWERS && Math.random() < sessionEvents.chance) return startEvent();
    return false;
  }

  // ---------- SPECIAL EVENTS – rare, at most one per mission, built only from questions that already exist ----------
  function eventPools() {
    const seen = allLearnItems().filter(it => { const s = stateOf(it); return s.seen && s.box >= 1; });
    const now = Date.now();
    const owner = seen.filter(it => it.type === "m" && /^(I have|My|I own)\b/i.test(it.fact.client || it.fact.question || ""));
    const client = seen.filter(it => it.type === "o" || (it.fact && it.fact.type === "client" && it.type !== "m") || (it.type === "l" && it.fact.client));
    const lightning = seen.filter(it => stateOf(it).box >= SITS_BOX && !isWeak(stateOf(it), now));
    return { owner, client, lightning };
  }
  function startEvent() {
    const P = eventPools(), kinds = [];
    if (P.lightning.length >= 5) kinds.push("lightning");
    if (P.client.length) kinds.push("client");
    if (P.owner.length) kinds.push("owner");
    if (!kinds.length) return false;
    const mi = currentMission();
    mi.event = true;
    const k = pick(kinds);
    if (k === "lightning") {
      burst("sys", "LIGHTNING ROUND", "");
      beginSpecialTest({ lightning: true, ir: 0, items: shuffle(P.lightning).slice(0, 5) });
    } else {
      burst("sys", k === "owner" ? "INCOMING · OWNER CALL" : "INCOMING · CLIENT CALL", "");
      beginSpecialTest({ call: k, ir: 0, items: [pick(k === "owner" ? P.owner : P.client)] });
    }
    return true;
  }

  // ---------- DEBRIEF – the real end of a session: what objectively got better ----------
  const MISSION_XP = 50;
  function showDebrief(kind) {
    clearTimer();
    const m = meta(), mi = currentMission(), s = mi.seg, j = journey();
    const complete = kind === "complete";
    let bonus = 0;
    if (complete) bonus += MISSION_XP;
    const precise = s.a >= 10 && s.c / s.a >= 0.8;
    if (precise) bonus += 25;                                         // the precision bonus of the old checkpoint lives here now
    if (bonus) awardXP(bonus);
    // personal session bests – only shown when actually beaten (the very first debrief just sets the baseline)
    const B = m.best, beaten = [];
    if (B.set) {
      if (s.combo > B.combo && s.combo >= 5) beaten.push("Best combo ×" + s.combo);
      if (s.ir > B.ir) beaten.push(s.ir + " Instant Recalls");
      if (s.sec > B.sec) beaten.push(s.sec + " facts secured");
    }
    B.combo = Math.max(B.combo, s.combo); B.ir = Math.max(B.ir, s.ir); B.sec = Math.max(B.sec, s.sec); B.set = true;
    const dj = j.pct - s.j0, xp = m.xp - s.xp0;
    debriefState = { kind };
    const stat = (n, label, fmt) => '<div class="db-stat"><b data-to="' + n + '" data-fmt="' + (fmt || "") + '">0</b><span>' + label + "</span></div>";
    el.debriefBody.innerHTML =
      '<div class="db-kicker">' + (complete ? "Mission complete" : "Session checkpoint") + "</div>" +
      (complete ? '<div class="db-goals">' + mi.goals.map(g => "<span>✓ " + esc(GOAL_TEXT[g.k](g.t, mi.boss)) + "</span>").join("") + "</div>" : "") +
      '<div class="db-hero">' + stat(s.sec, "Facts secured") + stat(s.clr, "Targets cleared") + stat(Math.round(dj * 100) / 100, "Journey", "pct") + "</div>" +
      '<div class="db-small">' + s.a + " questions · " + s.c + " correct · " + s.ir + " Instant Recall" + (s.ir === 1 ? "" : "s") + " · best combo ×" + s.combo + " · +" + xp.toLocaleString("en-US") + " XP</div>" +
      (bonus ? '<div class="db-bonus">' + [complete ? "+" + MISSION_XP + " XP mission" : "", precise ? "+25 XP precision" : ""].filter(Boolean).join(" · ") + "</div>" : "") +
      (beaten.length ? '<div class="db-best"><span>New personal best</span>' + beaten.map(esc).join(" · ") + "</div>" : "");
    if (complete) { m.mission = makeMission(); } else { mi.pending = ""; mi.seg = newSeg(); }
    if (complete) m.mission.seg = newSeg();
    saveProgress();
    el.debrief.hidden = false;
    restartAnim(el.debrief, "play");
    debriefCount();
    sound(complete ? "level" : "ok");
    syncProgressUI();
  }
  let debriefState = null;
  function debriefCount() {
    const nodes = el.debriefBody.querySelectorAll ? el.debriefBody.querySelectorAll("[data-to]") : [];
    const live = typeof requestAnimationFrame === "function" && motionMode() !== "reduced";
    nodes.forEach((n, i) => {
      const to = Number(n.dataset.to), pct = n.dataset.fmt === "pct";
      const fmt = v => pct ? (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(2) + " %" : String(Math.round(v));
      if (!live) { n.textContent = fmt(to); return; }
      n.textContent = fmt(0);
      setTimeout(() => countTo(n, 0, to, fmt, true), 250 + i * 160);
    });
  }
  function closeDebrief(action) {
    if (el.debrief.hidden) return;
    el.debrief.hidden = true;
    debriefState = null;
    if (action === "end") { journeyOn = false; focus = null; setMode("command"); renderHero(); return; }
    nextItem();
  }

  // ---------- current quest: a live snapshot, no day counters ----------
  function questInfo(info) {
    const now = Date.now();
    let reviews = 0, weak = 0, consolidating = 0, learned = 0;
    allLearnItems().forEach(it => {
      const st = stateOf(it);
      if (!st.seen) return;
      if (st.box >= 1) learned++;
      if (isReviewDue(st, now)) reviews++;
      if (isLearning(st)) consolidating++;
      if (isWeak(st, now)) weak++;
    });
    const step = currentStep();
    return { reviews, weak, consolidating, fresh: newAvailable(step), done: !step, mixed: learned >= 5, step, info };
  }

  // ---------- the hero: a status chamber. The core is only rebuilt when its band (or the boss signal) changes,
  // so its slow rotations never jump; the status around it updates after every answer.
  let heroCoreKey = "";
  function renderHero(infoIn) {
    const info = infoIn || agentInfo(), q = questInfo(info), m = meta(), j = info.j;

      '<div class="hero-line"><span>Journey <b>' + fmtPct(j.pct) + ' %</b></span><span><b class="gold">' + m.xp.toLocaleString("en-US") + "</b> XP</span></div>";
    // the SESSION MISSION replaces the old quest list – 2–3 goals, one button

    html += bossMission ? '<button class="cta boss" type="button" data-hero="boss">⚔ Enter the boss exam</button>'
      : '<button class="cta" type="button" data-hero="continue">' + (mi.ans ? "Resume mission" : "Start mission") + "</button>";
    html += '<div class="hero-links">' + (bossMission ? '<button type="button" data-hero="continue">Train first</button>' : info.bossAvail ? '<button type="button" class="boss-link" data-hero="boss">⚔ Level ' + info.bossAvail.lv + " boss</button>" : "") +
      '<button type="button" data-hero="newmission">New mission</button>' + (q.mixed ? '<button type="button" data-hero="mixed">Mixed recall</button>' : "") + "</div>";
    html += '<div class="hero-timer"><span>Focus time <b id="focusTime">' + fmtClock(m.timer.session) + '</b> <i id="focusState">' + (m.timer.paused ? "paused" : timerRunning ? "running" : "idle") + "</i></span>" +
      '<button class="tbtn" type="button" data-hero="pause">' + (m.timer.paused ? "Resume" : "Pause") + "</button></div>";
    el.heroBody.innerHTML = html;
  }

  // bring the card under the HUD – only when it is not already comfortably in view (no jerking)
  function scrollToCard() {
    try {
      const wrap = el.card.parentNode, r = el.card.getBoundingClientRect();
      const top = uiMode === "train" ? 92 : 12;
      if (r.top >= top && r.top < window.innerHeight * 0.35) return;
      wrap.scrollIntoView({ behavior: motionMode() === "reduced" ? "auto" : "smooth", block: "start" });
    } catch (e) { /* ignore */ }
  }

  // ---------- settings ----------
  function renderSettings() {
    const fx = meta().fx, mode = motionMode();
    const seg = (key, val, label, on) => '<button type="button" class="seg' + (on ? " on" : "") + '" data-set="' + key + '" data-val="' + val + '">' + label + "</button>";
    el.settingsBody.innerHTML = '<div class="set-h">[ System settings ]</div>' +
      '<div class="set-row"><span>Motion</span><div>' + seg("motion", "full", "Full", mode === "full") + seg("motion", "medium", "Medium", mode === "medium") + seg("motion", "reduced", "Reduced", mode === "reduced") + "</div></div>" +
      '<div class="set-row"><span>Sound</span><div>' + seg("sound", "off", "Off", !fx.sound) + seg("sound", "on", "On", fx.sound) + "</div></div>" +
      '<div class="set-row"><span>Glow</span><div>' + seg("glow", "normal", "Normal", fx.glow !== "high") + seg("glow", "high", "High", fx.glow === "high") + "</div></div>" +
      '<p class="set-note">Reduced turns off particles, shakes, flashes and the ascension sequence. Sound uses tiny generated tones – nothing is downloaded.</p>' +
      '<p class="set-note">Numbers are learned as broker anchors (≈ AED 24 / sq ft, ~550 units, ≈ AED 1.8M) – the exact working reference is shown with every answer. Years and key percentages stay exact.</p>' +
      '<p class="set-note">Lifetime focus time: <strong>' + fmtDur(meta().timer.lifetime) + "</strong></p>";
  }
  function openSettings() { renderSettings(); el.settingsPanel.hidden = false; }

  el.hero.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-hero]");
    if (!btn) return;
    const a = btn.dataset.hero;
    if (a === "continue") continueJourney();
    else if (a === "boss") startBoss(agentInfo().bossAvail);
    else if (a === "mixed") startMixed(false);
    else if (a === "pause") toggleTimer();
    else if (a === "newmission") replaceMission();
  });
  el.settingsBtn.addEventListener("click", () => openSettings());
  el.settingsPanel.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-set]");
    if (!btn) { if (e.target === el.settingsPanel) el.settingsPanel.hidden = true; return; }
    const fx = meta().fx, k = btn.dataset.set, v = btn.dataset.val;
    if (k === "close") { el.settingsPanel.hidden = true; return; }
    if (k === "motion") fx.motion = v;
    if (k === "sound") { fx.sound = v === "on"; if (fx.sound) sound("ok"); }
    if (k === "glow") fx.glow = v;
    applyFxClasses();
    saveProgress();
