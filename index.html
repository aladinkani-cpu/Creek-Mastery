<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creek Academy – Agent System</title>
<style>
  /* =====================================================
     CREEK ACADEMY – AGENT SYSTEM
     obsidian · graphite · midnight indigo · restrained violet · electric highlights · champagne gold used sparingly
     ===================================================== */
  :root {
    --bg: #050508;
    --graphite: #0E0F17;
    --panel: rgba(16, 16, 28, 0.86);
    --panel-2: rgba(9, 9, 16, 0.94);
    --line: rgba(150, 156, 210, 0.13);
    --line-2: rgba(150, 156, 210, 0.22);
    --pearl: #F4F1EA;
    --text: #E6E5EE;
    --muted: #8B8DA4;
    --dim: #5D6078;
    --violet: #7C5CFF;
    --violet-soft: rgba(124, 92, 255, 0.28);
    --electric: #5EA8FF;
    --gold: #D4B47A;
    --gold-bright: #F3DFB0;
    --gold-deep: #9C7A43;
    --champagne: linear-gradient(115deg, #8E6D38 0%, #D4B47A 22%, #F7E7C1 42%, #D9BC84 58%, #A8854C 80%, #E9D3A0 100%);
    --success: #5CC9A7;
    --wrong: #FF4D6A;
    --warning: #E5A85A;
    --serif: "Didot", "Bodoni 72", "Bodoni MT", "Playfair Display", Georgia, serif;
    --sans: "Avenir Next", "Avenir", "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background:
      radial-gradient(70% 38% at 50% -4%, rgba(84, 62, 190, 0.26) 0%, rgba(5, 5, 8, 0) 70%),
      radial-gradient(55% 40% at 108% 46%, rgba(46, 92, 190, 0.10) 0%, rgba(5, 5, 8, 0) 70%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    letter-spacing: 0.005em;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
    padding: 22px 16px 32px;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0.028;
    background-image: linear-gradient(rgba(150, 160, 255, 0.7) 1px, transparent 1px), linear-gradient(90deg, rgba(150, 160, 255, 0.7) 1px, transparent 1px);
    background-size: 48px 48px;
  }
  .app { position: relative; z-index: 1; width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  button { font-family: var(--sans); }
  :focus-visible { outline: 2px solid var(--electric); outline-offset: 2px; }

  /* ---------- header ---------- */
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .eyebrow { font-size: 9.5px; letter-spacing: 0.34em; text-transform: uppercase; color: var(--muted); }
  .brand {
    margin-top: 5px; font-family: var(--serif); font-size: 28px; line-height: 1; letter-spacing: 0.03em; white-space: nowrap;
    background: var(--champagne); background-size: 260% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .gear {
    flex: 0 0 auto; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; cursor: pointer;
    color: var(--muted); background: var(--panel); border: 1px solid var(--line-2);
  }
  .gear svg { width: 18px; height: 18px; }
  .gear:hover { color: var(--pearl); }

  /* ---------- the Agent System: a status chamber around the Ascension Core ---------- */
  .hero {
    --core: clamp(188px, 59vw, 236px);
    position: relative; overflow: hidden; border-radius: 26px; padding: 14px 14px 14px;
    background:
      radial-gradient(70% 34% at 50% 26%, rgba(110, 82, 255, 0.22) 0%, rgba(8, 8, 14, 0) 72%),
      linear-gradient(180deg, #0D0D19 0%, #060609 100%);
    border: 1px solid var(--line-2);
    box-shadow: 0 30px 70px -36px rgba(0, 0, 0, 1), inset 0 1px 0 rgba(255, 255, 255, 0.04);
  }
  .hero::before, .hero::after { content: ""; position: absolute; width: 12px; height: 12px; border: 1px solid rgba(94, 168, 255, 0.55); pointer-events: none; z-index: 2; }
  .hero::before { top: 9px; left: 9px; border-right: none; border-bottom: none; }
  .hero::after { bottom: 9px; right: 9px; border-left: none; border-top: none; }
  .hero.band5, .hero.band6, .hero.band7, .hero.band8, .hero.band9, .hero.band10 { border-color: rgba(212, 180, 122, 0.28); }
  .hero-sys { position: relative; z-index: 2; display: flex; justify-content: space-between; gap: 8px; padding: 0 6px; font-size: 9.5px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--electric); }
  .hero-sys span:last-child { color: var(--muted); letter-spacing: 0.2em; }
  .hero-sys span.gate { color: #FF8FA3; }
  .chamber { position: relative; width: calc(var(--core) * 1.25); height: calc(var(--core) * 1.12); margin: -6px auto 0; }
  .chamber-svg { position: absolute; left: 0; top: calc(var(--core) * -0.065); width: 100%; height: auto; aspect-ratio: 1; overflow: visible; opacity: 0.9; }
  .chamber-svg .ch-spin { animation: cspin 180s linear infinite; }
  .chamber-svg .ch-rev { animation: cspin 120s linear infinite reverse; }
  .chamber-svg .ch-node { animation: cspin 48s linear infinite; }
  .chamber::before { content: ""; position: absolute; left: 50%; top: 50%; width: 92%; height: 92%; transform: translate(-50%, -54%); border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, rgba(124, 92, 255, 0.16) 0%, rgba(94, 168, 255, 0.06) 42%, rgba(0, 0, 0, 0) 68%); }
  .chamber.boss-ready::before { background: radial-gradient(circle, rgba(124, 92, 255, 0.14) 0%, rgba(150, 20, 60, 0.18) 52%, rgba(0, 0, 0, 0) 70%); animation: gateHaze 4s ease-in-out infinite; }
  .chamber.boss-ready .chamber-svg .ch-ring { stroke: rgba(255, 77, 106, 0.32); }
  @keyframes gateHaze { 0%, 100% { opacity: 0.75; } 50% { opacity: 1; } }
  .hero-core { position: absolute; left: 50%; top: 50%; width: var(--core); height: var(--core); transform: translate(-50%, -54%); }
  .hero-core .core { width: 100%; height: 100%; display: block; overflow: visible; }
  .hero-core.react-ok { animation: reactOk 0.75s var(--ease); }
  .hero-core.react-combo { animation: reactCombo 1.1s var(--ease); }
  .hero-core.react-gold { animation: reactGold 1.2s var(--ease); }
  .hero-core.react-bad { animation: reactBad 0.6s steps(1); }
  @keyframes reactOk { 0% { filter: none; } 30% { filter: brightness(1.55) drop-shadow(0 0 14px rgba(140, 170, 255, 0.8)); } 100% { filter: none; } }
  @keyframes reactCombo { 0% { filter: none; } 25% { filter: brightness(1.9) saturate(1.3) drop-shadow(0 0 22px rgba(150, 120, 255, 0.9)); } 70% { filter: brightness(1.35) drop-shadow(0 0 12px rgba(150, 120, 255, 0.6)); } 100% { filter: none; } }
  @keyframes reactGold { 0% { filter: none; } 22% { filter: brightness(2.1) sepia(0.35) drop-shadow(0 0 26px rgba(243, 223, 176, 0.95)); } 100% { filter: none; } }
  @keyframes reactBad { 0% { filter: none; } 10% { filter: brightness(0.45) hue-rotate(-60deg) saturate(2) drop-shadow(0 0 10px rgba(255, 51, 85, 0.8)); transform: translate(-51%, -54%); }
    25% { filter: brightness(0.6) hue-rotate(-40deg); transform: translate(-49%, -54%); } 45% { filter: brightness(0.8); transform: translate(-50%, -54%); } 100% { filter: none; } }
  .motes i { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #C9BDFF; box-shadow: 0 0 6px #8F7CFF; opacity: 0; animation: mote 7s ease-in-out infinite; }
  @keyframes mote { 0% { opacity: 0; transform: translateY(8px); } 30% { opacity: 0.7; } 100% { opacity: 0; transform: translateY(-34px); } }
  .hero-body { position: relative; z-index: 2; margin-top: calc(var(--core) * -0.17); }
  .hero-id { text-align: center; }
  .hero-lv { display: flex; justify-content: center; align-items: baseline; gap: 10px; }
  .hero-lv span { font-size: 10px; letter-spacing: 0.4em; text-transform: uppercase; color: var(--muted); }
  .hero-lv b { font-family: var(--serif); font-weight: 400; font-size: 58px; line-height: 0.92; color: var(--pearl); text-shadow: 0 0 26px rgba(124, 92, 255, 0.65), 0 2px 0 rgba(0, 0, 0, 0.6); }
  .hero-title {
    margin-top: 4px; font-size: 13px; font-weight: 700; letter-spacing: 0.3em; text-transform: uppercase;
    background: var(--champagne); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hero-form { margin-top: 3px; font-size: 9.5px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--dim); }
  .hero-bar { position: relative; margin: 12px 4px 0; height: 6px; border-radius: 999px; background: rgba(255, 255, 255, 0.06); overflow: hidden; box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.7); }
  .hero-bar i { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: linear-gradient(90deg, #4B36C9, #5EA8FF 70%, #D9E8FF); transition: width 1.2s var(--ease); }
  .hero-bar.gated i { background: linear-gradient(90deg, #6B1530, #FF4D6A); }
  .hero-bar.recovery i { background: linear-gradient(90deg, #6E4E16, #F3C76B); }
  .hero-req { margin-top: 6px; text-align: center; font-size: 11.5px; color: var(--muted); }
  .qchip { display: inline-flex; align-items: baseline; gap: 6px; font-size: 11px; letter-spacing: 0.04em; color: var(--text); padding: 5px 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--line-2); }
  .qchip b { font-family: var(--serif); font-weight: 400; font-size: 15px; color: var(--pearl); }
  .qchip.flag { color: #CFE3FF; border-color: rgba(94, 168, 255, 0.35); }
  .qchip.weak { border-color: rgba(255, 77, 106, 0.35); }
  .qchip.zero { opacity: 0.4; }
  .qchip.boss { color: var(--muted); }
  .qchip.boss.on { color: #FFC2CC; border-color: rgba(255, 77, 106, 0.6); background: rgba(255, 77, 106, 0.08); animation: bossPulse 2.6s ease-in-out infinite; }
  @keyframes bossPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255, 77, 106, 0.4); } 50% { box-shadow: 0 0 0 5px rgba(255, 77, 106, 0); } }
  .cta {
    position: relative; overflow: hidden; display: block; width: 100%; margin-top: 14px; min-height: 54px; border: none; border-radius: 16px; cursor: pointer;
    font-size: 13.5px; font-weight: 800; letter-spacing: 0.28em; text-transform: uppercase; color: #140E04;
    background: var(--champagne); background-size: 220% 100%; animation: sheen 12s ease-in-out infinite;
    box-shadow: 0 16px 32px -16px rgba(212, 180, 122, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.55), inset 0 -1px 0 rgba(90, 60, 20, 0.35);
    transition: transform 0.18s var(--ease), box-shadow 0.25s var(--ease);
  }
  .cta::after { content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 45%; pointer-events: none;
    background: linear-gradient(100deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.55) 50%, rgba(255, 255, 255, 0) 100%); transform: skewX(-18deg); transition: left 0.7s var(--ease); }
  .cta::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.25s var(--ease);
    background: radial-gradient(60% 120% at 50% 50%, rgba(255, 250, 235, 0.55) 0%, rgba(255, 250, 235, 0) 70%); }
  .cta:hover::after, .cta:focus-visible::after { left: 115%; }
  .cta:active { transform: scale(0.985); box-shadow: 0 8px 20px -12px rgba(212, 180, 122, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.55); }
  .cta:active::before { opacity: 1; }
  @keyframes sheen { 0%, 100% { background-position: 100% 0; } 50% { background-position: 0 0; } }
  /* Command Center: level line + the session mission + one button */
  .hero-line { margin-top: 8px; display: flex; justify-content: space-between; gap: 10px; font-size: 11px; letter-spacing: 0.08em; color: var(--muted); }
  .hero-line b { font-family: var(--mono); font-weight: 600; color: var(--pearl); }
  .hero-line b.gold { color: var(--gold-bright); }
  .mission { margin-top: 12px; padding: 12px 14px 10px; border: 1px solid var(--line); border-radius: 16px; background: rgba(0, 0, 0, 0.24); }
  .mission.boss { border-color: rgba(255, 77, 106, 0.4); }
  .mi-h { display: flex; justify-content: space-between; align-items: baseline; font-size: 9.5px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--electric); }
  .mi-h em { font-style: normal; font-family: var(--mono); letter-spacing: 0.04em; color: var(--muted); }
  .mi-goals { list-style: none; margin-top: 8px; display: grid; gap: 7px; }
  .mi-goals li { display: flex; align-items: center; gap: 10px; font-size: 13.5px; color: var(--text); min-width: 0; }
  .mi-goals li span { flex: 1; min-width: 0; }
  .mi-goals li b { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--muted); }
  .mi-goals li i { flex: 0 0 auto; width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid rgba(150, 130, 255, 0.45); }
  .mi-goals li.done { color: var(--muted); }
  .mi-goals li.done i { border-color: var(--gold-bright); background: radial-gradient(circle, var(--gold-bright) 0 38%, transparent 42%); }
  .mi-goals li.done b { color: var(--gold-bright); }
  .hero-links { margin-top: 6px; display: flex; justify-content: center; gap: 4px 18px; flex-wrap: wrap; }
  .hero-links button { min-height: 36px; padding: 0 4px; border: 0; background: none; color: var(--muted); font: inherit; font-size: 10px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; cursor: pointer; }
  .hero-links button:hover { color: var(--pearl); }
  .hero-links .boss-link { color: #FF8FA3; }
  .cta.boss { color: #FFE3E8; background: linear-gradient(180deg, #3D0A18, #1A040A); border: 1px solid rgba(255, 77, 106, 0.6); }
  .cta.ghost { color: #CFE3FF; background: transparent; border: 1px solid rgba(94, 168, 255, 0.28); }
  .hero-timer { margin-top: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-size: 11px; color: var(--muted); }
  .hero-timer b { font-family: var(--mono); color: var(--pearl); font-weight: 600; letter-spacing: 0.04em; }
  .hero-timer i { font-style: normal; font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--electric); }
  .tbtn { margin-left: auto; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text); background: transparent;
    border: 1px solid var(--line-2); border-radius: 999px; padding: 7px 14px; min-height: 34px; cursor: pointer; }

  /* ---------- the opening sequence: the System recognises its agent ---------- */
  .intro { position: fixed; inset: 0; z-index: 70; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #020205;
    animation: introGone 0.6s ease 4.2s forwards; }          /* safety: even without script the layer dissolves */
  .intro.play { animation: introOut 0.6s cubic-bezier(0.6, 0, 0.3, 1) 2.75s forwards; }
  .intro.quick { animation: introOut 0.35s ease 0.25s forwards; }
  .intro.gone { animation: introOut 0.35s ease forwards; }
  @keyframes introOut { 0% { opacity: 1; } 100% { opacity: 0; visibility: hidden; pointer-events: none; } }
  @keyframes introGone { to { opacity: 0; visibility: hidden; pointer-events: none; } }
  .intro-stage { position: relative; width: min(92vw, 420px); display: flex; flex-direction: column; align-items: center; text-align: center; }
  .in-energy { position: absolute; left: 50%; top: 118px; width: 340px; height: 340px; margin: -170px 0 0 -170px; border-radius: 50%; opacity: 0;
    background: radial-gradient(circle, rgba(124, 92, 255, 0.45) 0%, rgba(94, 168, 255, 0.14) 38%, rgba(0, 0, 0, 0) 68%); animation: inEnergy 2.6s ease 0.25s both; }
  @keyframes inEnergy { 0% { opacity: 0; transform: scale(0.4); } 50% { opacity: 1; } 100% { opacity: 0.85; transform: scale(1); } }
  .in-lines { position: absolute; left: 50%; top: 118px; width: 300px; height: 300px; margin: -150px 0 0 -150px; opacity: 0; animation: inLines 1s ease 0.45s both; }
  .in-lines .il-spin { animation: cspin 40s linear infinite; }
  @keyframes inLines { from { opacity: 0; transform: scale(1.12) rotate(-8deg); } to { opacity: 0.85; transform: none; } }
  .in-core { position: relative; width: 196px; height: 196px; margin-top: 20px; opacity: 0; animation: inCore 1.2s cubic-bezier(0.2, 1.1, 0.3, 1) 1.15s both; }
  .in-core .core { width: 100%; height: 100%; overflow: visible; }
  @keyframes inCore { 0% { opacity: 0; transform: scale(0.55); filter: brightness(3) blur(6px); } 60% { opacity: 1; filter: brightness(1.4) blur(0); } 100% { opacity: 1; transform: none; filter: none; } }
  .in-pulse { position: absolute; left: 50%; top: 118px; width: 180px; height: 180px; margin: -90px 0 0 -90px; border-radius: 50%; border: 1px solid rgba(220, 210, 255, 0.8); opacity: 0;
    animation: inPulse 0.9s ease-out 2.3s both; }
  @keyframes inPulse { 0% { opacity: 0; transform: scale(0.6); } 8% { opacity: 0.9; } 100% { opacity: 0; transform: scale(2.1); } }
  .in-brand { margin-top: 16px; font-family: var(--serif); font-size: 26px; letter-spacing: 0.32em; color: var(--pearl); text-indent: 0.32em; animation: inFade 0.6s ease 0.7s both; }
  .in-sys { margin-top: 8px; font-size: 9.5px; letter-spacing: 0.42em; text-transform: uppercase; color: var(--electric); text-indent: 0.42em; animation: inFade 0.5s ease 0.95s both; }
  .in-sys::after { content: ""; display: inline-block; width: 6px; height: 6px; margin-left: 8px; border-radius: 50%; background: var(--electric); box-shadow: 0 0 8px var(--electric); animation: inBlink 0.5s steps(1) 0.95s 4; vertical-align: 1px; }
  .in-line { margin-top: 22px; padding: 0 12px; font-family: var(--serif); font-size: 19px; line-height: 1.4; color: var(--text); font-style: italic; animation: inFade 0.6s ease 1.45s both; }
  .in-status { margin-top: 18px; display: flex; flex-direction: column; align-items: center; gap: 2px; animation: inFade 0.5s ease 1.9s both; }
  .in-status span { font-size: 9px; letter-spacing: 0.4em; text-transform: uppercase; color: var(--muted); text-indent: 0.4em; }
  .in-status b { font-family: var(--serif); font-weight: 400; font-size: 34px; line-height: 1.1; color: var(--pearl); text-shadow: 0 0 22px rgba(124, 92, 255, 0.7); }
  .in-status i { font-style: normal; font-size: 12px; font-weight: 700; letter-spacing: 0.3em; text-transform: uppercase; color: var(--gold-bright); text-indent: 0.3em; }
  .in-status em { margin-top: 4px; font-style: normal; font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--muted); }
  .in-confirm { margin-top: 14px; font-size: 9px; letter-spacing: 0.36em; text-transform: uppercase; color: var(--gold); text-indent: 0.36em; animation: inFade 0.4s ease 2.3s both; }
  @keyframes inFade { from { opacity: 0; transform: translateY(6px); letter-spacing: 0.5em; } to { opacity: 1; transform: none; } }
  @keyframes inBlink { 50% { opacity: 0.15; } }
  .intro-skip { position: absolute; right: 16px; bottom: max(18px, env(safe-area-inset-bottom)); min-height: 40px; padding: 8px 18px; border-radius: 999px; cursor: pointer;
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase; color: var(--muted); background: rgba(255, 255, 255, 0.03); border: 1px solid var(--line-2); }
  .intro.quick .intro-stage * { animation: none !important; opacity: 1; }
  .app.reveal > * { animation: reveal 0.7s var(--ease) both; }
  .app.reveal > *:nth-child(2) { animation-delay: 0.06s; } .app.reveal > *:nth-child(3) { animation-delay: 0.14s; } .app.reveal > *:nth-child(n+4) { animation-delay: 0.2s; }
  @keyframes reveal { from { opacity: 0; transform: translateY(10px); filter: blur(2px); } to { opacity: 1; transform: none; filter: none; } }

  /* ---------- the Ascension Core ---------- */
  .core .c-spin { animation: cspin 70s linear infinite; }
  .core .c-spin-rev { animation: cspin 95s linear infinite reverse; }
  .core .c-spin-fast { animation: cspin 26s linear infinite reverse; }
  .core .c-orbit { animation: cspin 34s linear infinite; }
  .core .c-orbit-rev { animation: cspin 47s linear infinite reverse; }
  .core .c-orbit-slow { animation: cspin 120s linear infinite; }
  .core .c-aura { animation: caura 6s ease-in-out infinite; }
  .core.b0 .c-aura { animation-duration: 9s; }
  .core .c-heart { animation: cheart 3.4s ease-in-out infinite; }
  .core .c-flicker { opacity: 0.15; animation: cflick 3.6s linear infinite; }
  .core .f1 { animation-delay: 0.9s; } .core .f2 { animation-delay: 1.8s; } .core .f3 { animation-delay: 2.7s; }
  .core .c-twinkle { animation: ctw 3.2s ease-in-out infinite; }
  .core .c-dust { opacity: 0.2; animation: ctw 7s ease-in-out infinite; }
  .core .c-crack { animation: cheart 5s ease-in-out infinite; }
  .core .c-halo { animation: cheart 6s ease-in-out infinite; }
  .core .t1 { animation-delay: 0.8s; } .core .t2 { animation-delay: 1.6s; } .core .t3 { animation-delay: 2.4s; }
  @keyframes cspin { to { transform: rotate(360deg); } }
  @keyframes caura { 0%, 100% { transform: scale(0.95); opacity: 0.85; } 50% { transform: scale(1.04); opacity: 1; } }
  @keyframes cheart { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
  @keyframes cflick { 0%, 100% { opacity: 0.12; } 8% { opacity: 0.95; } 12% { opacity: 0.25; } 16% { opacity: 0.85; } 24% { opacity: 0.12; } }
  @keyframes ctw { 0%, 100% { opacity: 0.15; } 50% { opacity: 1; } }

  /* ---------- knowledge journey ---------- */
  .journey { position: relative; border-radius: 20px; padding: 14px 16px 12px; cursor: pointer; background: var(--panel); border: 1px solid var(--line); }
  .journey:hover { border-color: var(--line-2); }
  .jr-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .jr-label { font-size: 9.5px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--muted); }
  .jr-pct b { font-family: var(--serif); font-weight: 400; font-size: 28px; color: var(--pearl); font-variant-numeric: lining-nums tabular-nums; }
  .jr-pct small { margin-left: 3px; font-size: 12px; color: var(--muted); }
  .jr-track { position: relative; margin-top: 8px; height: 6px; border-radius: 999px; background: rgba(255, 255, 255, 0.06); overflow: hidden; }
  .jr-track i { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 999px; transition: width 1.2s var(--ease); }
  .jr-soft { background: rgba(124, 92, 255, 0.22); }
  .jr-fill { background: linear-gradient(90deg, var(--violet), var(--electric)); }
  .jr-foot { margin-top: 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .jr-counts { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 11.5px; color: var(--muted); }
  .jr-counts b { color: var(--pearl); font-weight: 600; }
  .jr-toggle { flex: 0 0 auto; font-size: 9.5px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--electric); }
  .meter-details { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.45s var(--ease); }
  .journey.open .meter-details { grid-template-rows: 1fr; }
  .meter-details > div { overflow: hidden; min-width: 0; }
  .breakdown { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 9px; }
  .bd-head { margin-top: 6px; font-size: 9.5px; letter-spacing: 0.26em; text-transform: uppercase; color: var(--electric); }
  .bd-row { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr) 40px; align-items: center; gap: 10px; font-size: 12.5px; }
  .bd-row.kv { grid-template-columns: minmax(0, 1fr) auto; }
  .bd-name { color: var(--text); min-width: 0; overflow-wrap: anywhere; }
  .bd-name small { display: block; margin-top: 1px; font-size: 10.5px; color: var(--muted); }
  .bd-row.on .bd-name { color: var(--gold-bright); }
  .bd-bar { position: relative; height: 4px; border-radius: 999px; background: rgba(255, 255, 255, 0.06); overflow: hidden; }
  .bd-bar em, .bd-bar b { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 999px; }
  .bd-bar em { background: rgba(124, 92, 255, 0.25); }
  .bd-bar b { background: linear-gradient(90deg, var(--violet), var(--electric)); }
  .bd-pct { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .bd-row.kv .bd-pct { color: var(--text); }
  .bd-note { font-size: 11.5px; color: var(--muted); line-height: 1.5; }
  .bd-note strong { color: var(--text); font-weight: 600; }

  /* ---------- modules ---------- */
  .tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 3px; padding: 4px; border-radius: 20px; background: var(--panel-2); border: 1px solid var(--line); }
  .tab { min-width: 0; min-height: 40px; padding: 8px 4px; border: none; border-radius: 16px; background: transparent; color: var(--muted);
    font-size: 11.5px; font-weight: 600; letter-spacing: 0.02em; line-height: 1.2; cursor: pointer; transition: background 0.3s var(--ease), color 0.3s var(--ease); }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--pearl); background: linear-gradient(180deg, rgba(124, 92, 255, 0.28), rgba(124, 92, 255, 0.12)); box-shadow: inset 0 0 0 1px rgba(150, 130, 255, 0.4); }

  .modbar { padding: 2px 4px 0; }
  .mb-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .mb-name { font-family: var(--serif); font-size: 22px; color: var(--pearl); line-height: 1.1; overflow-wrap: anywhere; }
  .mb-pct { font-family: var(--serif); font-size: 20px; color: var(--gold-bright); white-space: nowrap; }
  .mb-pct small { font-family: var(--sans); font-size: 11px; color: var(--muted); }
  .mb-track { position: relative; margin-top: 8px; height: 3px; border-radius: 999px; background: rgba(255, 255, 255, 0.06); overflow: hidden; }
  .mb-track em, .mb-track b { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 999px; transition: width 0.9s var(--ease); }
  .mb-track em { background: rgba(212, 180, 122, 0.22); }
  .mb-track b { background: var(--champagne); }
  .mb-meta { margin-top: 7px; display: flex; flex-wrap: wrap; gap: 3px 12px; font-size: 11px; color: var(--muted); }
  .mb-weak { color: #FF8FA3; }
  .mb-fresh { margin-top: 4px; font-size: 10.5px; color: var(--muted); }

  .levels { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .levels.scroll { display: flex; overflow-x: auto; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; scrollbar-width: none; padding-bottom: 2px;
    -webkit-mask-image: linear-gradient(90deg, #000 86%, transparent); mask-image: linear-gradient(90deg, #000 86%, transparent); }
  .levels.scroll::-webkit-scrollbar { display: none; }
  .levels.scroll .level { flex: 0 0 148px; scroll-snap-align: start; }
  .level { min-width: 0; text-align: left; padding: 10px 12px 11px; border-radius: 14px; cursor: pointer; color: var(--text);
    background: var(--panel); border: 1px solid var(--line); transition: border-color 0.3s var(--ease); }
  .level:hover { border-color: var(--line-2); }
  .level.active { border-color: rgba(150, 130, 255, 0.55); background: linear-gradient(180deg, rgba(124, 92, 255, 0.16), rgba(16, 16, 28, 0.9)); }
  .level.locked { opacity: 0.4; }
  .level-num { font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
  .level.active .level-num { color: var(--electric); }
  .level-title { margin-top: 3px; font-family: var(--serif); font-size: 15.5px; line-height: 1.15; overflow-wrap: anywhere; }
  .level-bar { margin-top: 8px; height: 3px; border-radius: 999px; background: rgba(255, 255, 255, 0.06); overflow: hidden; }
  .level-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--violet), var(--electric)); transition: width 0.8s var(--ease); }
  .level-count { margin-top: 5px; font-size: 10.5px; color: var(--muted); }

  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .stat { text-align: center; padding: 2px 4px; border-left: 1px solid var(--line); }
  .stat:first-child { border-left: none; }
  .stat-label { font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
  .stat-value { margin-top: 2px; font-family: var(--serif); font-size: 22px; color: var(--pearl); font-variant-numeric: tabular-nums; }
  .stat.learning .stat-value { color: var(--warning); }
  .stat.mastered .stat-value { color: var(--gold-bright); }
  .stat.combo .stat-value { color: #B9A8FF; }
  .stat-value.bump { animation: bump 0.5s var(--ease); }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.3); } 100% { transform: scale(1); } }

  .toolbar { display: flex; flex-direction: column; align-items: stretch; gap: 8px; min-width: 0; }
  .toolbar-info { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 4px 12px; flex-wrap: wrap; min-width: 0; }
  .toolbar-info strong { color: var(--text); font-weight: 600; }
  .mode-tag { display: inline-block; margin-right: 7px; padding: 2px 7px; border-radius: 6px; font-size: 9px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #CFE3FF; background: rgba(94, 168, 255, 0.12); border: 1px solid rgba(94, 168, 255, 0.35); }
  .mode-tag.free { color: var(--muted); background: transparent; border-color: var(--line-2); }
  .round-bar { display: inline-block; vertical-align: middle; width: 48px; height: 3px; margin-left: 6px; border-radius: 999px; background: rgba(255, 255, 255, 0.07); overflow: hidden; }
  .round-fill { display: block; height: 100%; border-radius: 999px; background: var(--electric); transition: width 0.5s var(--ease); }
  .toolbar-chips { display: flex; gap: 6px; min-width: 0; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; padding-bottom: 1px; }
  .toolbar-chips::-webkit-scrollbar { display: none; }
  @media (max-width: 420px) { .toolbar-chips { -webkit-mask-image: linear-gradient(90deg, #000 88%, transparent); mask-image: linear-gradient(90deg, #000 88%, transparent); } }
  .toolbar-chips > * { flex: 0 0 auto; }
  .chip, select.chip { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: var(--text); background: var(--panel); border: 1px solid var(--line-2);
    border-radius: 999px; padding: 6px 11px; min-height: 32px; cursor: pointer; max-width: 100%; }
  select.chip { font-size: 16px; font-weight: 500; letter-spacing: 0; padding: 3px 8px; max-width: 150px; color: var(--muted); }
  select.chip:disabled { opacity: 0.45; }
  .chip.on { color: #140E04; background: var(--champagne); border-color: transparent; }
  .chip.on.weak { color: #fff; background: #8A1E33; }

  /* ---------- the card ---------- */
  .card {
    position: relative; min-height: 400px; border-radius: 26px; padding: 24px 20px 22px;
    display: flex; flex-direction: column; align-items: center; text-align: center; min-width: 0;
    background: radial-gradient(100% 50% at 50% 0%, rgba(124, 92, 255, 0.09) 0%, rgba(124, 92, 255, 0) 60%), linear-gradient(180deg, #0F0F1B 0%, #08080E 100%);
    border: 1px solid var(--line-2);
    box-shadow: 0 34px 70px -34px rgba(0, 0, 0, 1), inset 0 1px 0 rgba(255, 255, 255, 0.04);
  }
  .card::before { content: ""; position: absolute; top: 0; left: 24%; right: 24%; height: 1px; background: linear-gradient(90deg, transparent, rgba(243, 223, 176, 0.7), transparent); }
  .card.enter > * { animation: rise 0.5s var(--ease) both; }
  .card.enter > *:nth-child(2) { animation-delay: 0.04s; }
  .card.enter > *:nth-child(3) { animation-delay: 0.08s; }
  .card.enter > *:nth-child(n+4) { animation-delay: 0.12s; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .card.flash-ok { animation: flashOk 0.9s var(--ease); }
  .card.flash-bad { animation: shake 0.5s ease; }

  .card-top { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .card-area { min-width: 0; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--electric); text-align: left; line-height: 1.4; overflow-wrap: anywhere; }
  .card-area.boss-tag { color: #FF8FA3; }
  .badge { flex: 0 0 auto; font-size: 9px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--muted); white-space: nowrap; }
  .badge.new { color: var(--gold-bright); border-color: rgba(212, 180, 122, 0.45); }
  .badge.learning { color: var(--warning); border-color: rgba(229, 168, 90, 0.45); }
  .badge.mastered { color: var(--success); border-color: rgba(92, 201, 167, 0.45); }
  .card-name { margin-top: 22px; font-family: var(--serif); font-weight: 400; font-size: 38px; line-height: 1.08; color: var(--pearl); overflow-wrap: anywhere; }
  .card-name.small { font-size: 23px; line-height: 1.25; }
  .card-name.area-q { font-size: 24px; line-height: 1.28; }
  .qtype { margin-top: 16px; font-size: 9.5px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); }
  .qtype + .client-label { margin-top: 8px; }
  .head-badges { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 12px 0 0; }
  .setup { margin-top: 14px; width: 100%; list-style: none; text-align: left; padding: 11px 13px; border-radius: 14px; background: rgba(0, 0, 0, 0.3); border: 1px solid var(--line);
    display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; line-height: 1.45; }
  .setup li { position: relative; padding-left: 15px; overflow-wrap: anywhere; }
  .setup li::before { content: ""; position: absolute; left: 2px; top: 0.6em; width: 5px; height: 5px; transform: rotate(45deg); background: var(--violet); }
  .setup + .card-name, .setup + .client-label { margin-top: 16px; }
  .client-label { margin-top: 18px; font-size: 9.5px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--warning); }
  .client-label + .card-name { margin-top: 8px; }
  .client-q { margin-top: 8px; font-family: var(--serif); font-size: 21px; line-height: 1.35; font-style: italic; color: var(--text); }

  .big-fact { margin-top: 22px; width: 100%; padding: 20px 16px; border-radius: 18px; background: rgba(0, 0, 0, 0.32); border: 1px solid var(--line); }
  .big-fact.sec { text-align: left; }
  .big-fact.ok { border-color: rgba(92, 201, 167, 0.45); }
  .fact-label { font-size: 9.5px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold); }
  .big-value { margin-top: 8px; font-family: var(--serif); font-size: 42px; line-height: 1.1; overflow-wrap: anywhere;
    background: var(--champagne); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .big-value.text { background: none; color: var(--pearl); font-size: 20px; line-height: 1.38; }
  .fact-extra { margin-top: 4px; font-size: 12px; color: var(--muted); }
  .explain { margin-top: 10px; font-size: 13.5px; color: var(--muted); line-height: 1.55; }
  .meta-row { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; font-size: 11.5px; color: var(--muted); }
  .cls { font-size: 9.5px; font-weight: 700; letter-spacing: 0.08em; padding: 3px 8px; border-radius: 999px; border: 1px solid; }
  .cls.official, .cls.scnote { color: #9FD0F5; border-color: rgba(159, 208, 245, 0.4); }
  .cls.process { color: var(--gold-bright); border-color: rgba(212, 180, 122, 0.4); }
  .cls.brokerage, .cls.indic { color: #CDBDF5; border-color: rgba(205, 189, 245, 0.4); }
  .cls.bank { color: var(--warning); border-color: rgba(229, 168, 90, 0.4); }
  .cls.developer { color: var(--success); border-color: rgba(92, 201, 167, 0.4); }
  .cls.approx, .cls.recheck { color: #F2C66D; border-color: rgba(242, 198, 109, 0.45); }
  .cls.future, .cls.offplan { color: #7FE0D4; border-color: rgba(127, 224, 212, 0.45); }
  .future-note { margin-top: 10px; font-size: 12.5px; color: #7FE0D4; line-height: 1.45; }
  .warn-note { margin-top: 10px; font-size: 12.5px; line-height: 1.45; color: var(--warning); }
  .train-note { margin-top: 8px; font-size: 11px; color: var(--muted); }
  .fresh { font-size: 9px; font-weight: 700; letter-spacing: 0.08em; padding: 2px 6px; border-radius: 999px; border: 1px solid; margin-left: 4px; }
  .fresh.FRESH { color: var(--success); border-color: rgba(92, 201, 167, 0.5); }
  .fresh.RECENT { color: var(--warning); border-color: rgba(229, 168, 90, 0.5); }
  .fresh.OLD { color: var(--wrong); border-color: rgba(255, 77, 106, 0.5); }
  .sc-card, .vcard { margin-top: 12px; width: 100%; text-align: left; padding: 12px 14px; border-radius: 14px; background: rgba(0, 0, 0, 0.3); border: 1px solid var(--line); }
  .sc-name, .vcard-name { font-family: var(--serif); font-size: 18px; color: var(--pearl); letter-spacing: 0.02em; overflow-wrap: anywhere; }
  .sc-rate { margin-top: 6px; display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 8px; }
  .sc-rate b { font-family: var(--serif); font-weight: 400; font-size: 28px; line-height: 1.1; color: var(--gold-bright); }
  /* numeric policy: the broker anchor first, the exact working reference right under it (concise, no rounding lecture) */
  .sc-anchor, .num-anchor { margin-top: 6px; display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 8px; }
  .sc-anchor span, .num-anchor span { flex-basis: 100%; font-size: 9.5px; font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
  .sc-anchor b, .num-anchor b { font-family: var(--serif); font-weight: 400; font-size: 28px; line-height: 1.1; color: var(--gold-bright); }
  .sc-anchor em { font-style: normal; font-size: 12px; color: var(--muted); }
  .num-anchor { margin: 10px 0 2px; }
  .num-anchor b { font-size: 22px; }
  .num-anchor em { flex-basis: 100%; font-style: normal; font-size: 12px; color: var(--muted); }
  .num-anchor em b.ex { font-family: var(--sans); font-size: 13px; font-weight: 700; color: var(--pearl); }
  .num-exact { margin-top: 4px; font-size: 12px; color: var(--muted); }
  .num-exact b { color: var(--pearl); font-weight: 700; }
  .sc-rate span { font-size: 12px; color: var(--muted); }
  .sc-rate.text b { font-size: 17px; line-height: 1.35; }
  .sc-badges { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .sc-note, .vcard-extra { margin-top: 7px; font-size: 12px; color: var(--muted); line-height: 1.45; }
  .sc-broker, .view-note { margin-top: 10px; font-size: 11px; color: var(--muted); font-style: italic; line-height: 1.45; }
  .obj-break { margin-top: 12px; width: 100%; text-align: left; display: flex; flex-direction: column; gap: 9px; }
  .obj-part { padding: 10px 12px; border-radius: 12px; background: rgba(0, 0, 0, 0.3); border: 1px solid var(--line); }
  .obj-part .lbl { font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold); }
  .obj-part .txt { margin-top: 4px; font-size: 14px; line-height: 1.45; overflow-wrap: anywhere; }
  .obj-part.resp .txt { font-family: var(--serif); font-size: 16.5px; color: var(--pearl); }
  .obj-part.avoid { border-color: rgba(255, 77, 106, 0.3); }
  .obj-part.avoid .lbl { color: var(--wrong); }
  .obj-part.avoid .txt { color: #E9A3AA; text-decoration: line-through; text-decoration-color: rgba(255, 77, 106, 0.5); }
  .obj-part.focus { border-color: rgba(150, 130, 255, 0.55); box-shadow: 0 0 0 3px rgba(124, 92, 255, 0.08); }
  .vcard-label { margin-top: 4px; font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold); }
  .vcard ul { list-style: none; margin-top: 8px; display: flex; flex-direction: column; gap: 5px; }
  .vcard li { position: relative; padding-left: 15px; font-size: 13.5px; line-height: 1.4; overflow-wrap: anywhere; }
  .vcard li::before { content: ""; position: absolute; left: 2px; top: 0.55em; width: 5px; height: 5px; transform: rotate(45deg); background: var(--gold); }
  .vcard li.focus { color: var(--gold-bright); font-weight: 600; }
  .vcard li small { display: block; margin-top: 2px; font-size: 11.5px; color: var(--muted); font-weight: 400; }
  .say { margin-top: 8px; font-size: 12px; color: var(--muted); }
  .say b { color: var(--gold); font-weight: 600; }
  .lingo-example { margin-top: 8px; font-size: 13.5px; font-style: italic; line-height: 1.45; }
  .gap-full { margin-top: 10px; font-size: 12.5px; color: var(--muted); }

  .hint { margin-top: 14px; font-size: 13.5px; color: var(--muted); line-height: 1.55; max-width: 42ch; }
  .hint strong { color: var(--text); font-weight: 600; }
  .msg-glyph { width: 12px; height: 12px; transform: rotate(45deg); border: 1px solid var(--violet); box-shadow: 0 0 14px rgba(124, 92, 255, 0.7); }
  .spacer { flex: 1; min-height: 8px; }

  .options { margin-top: 16px; width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .options.single { grid-template-columns: minmax(0, 1fr); }
  .btn { font-size: 14px; font-weight: 600; color: var(--text); cursor: pointer; user-select: none; -webkit-user-select: none;
    background: linear-gradient(180deg, rgba(22, 22, 38, 0.95), rgba(11, 11, 19, 0.95)); border: 1px solid var(--line-2); border-radius: 14px; padding: 12px 16px;
    transition: border-color 0.2s var(--ease), transform 0.12s var(--ease), background 0.2s var(--ease); }
  .btn:hover { border-color: rgba(150, 130, 255, 0.55); }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { cursor: default; }
  .btn:disabled:active { transform: none; }
  .opt { position: relative; min-height: 62px; padding: 16px 10px; font-size: 16.5px; line-height: 1.25; color: var(--pearl); border-radius: 16px; overflow-wrap: anywhere; }
  .opt .key { position: absolute; top: 7px; left: 9px; font-size: 10px; color: var(--dim); font-weight: 500; }
  .options.single .opt { min-height: 54px; padding: 13px 14px 13px 32px; font-size: 14.5px; font-weight: 500; text-align: left; }
  .options.single .opt .key { top: 50%; left: 13px; transform: translateY(-50%); }
  .opt.correct { color: #C4F0DF; border-color: rgba(92, 201, 167, 0.75); background: linear-gradient(180deg, rgba(92, 201, 167, 0.2), rgba(92, 201, 167, 0.06)); box-shadow: 0 0 26px -8px rgba(92, 201, 167, 0.8); animation: pop 0.45s var(--ease); }
  .opt.incorrect { color: #FFB3C0; border-color: rgba(255, 77, 106, 0.7); background: rgba(255, 77, 106, 0.1); box-shadow: 0 0 22px -8px rgba(255, 77, 106, 0.8); }
  .opt.dim { opacity: 0.32; }
  @keyframes pop { 0% { transform: scale(1); } 45% { transform: scale(1.04); } 100% { transform: scale(1); } }
  .compare-opt { min-height: 96px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  .compare-name { font-family: var(--serif); font-size: 19px; font-weight: 400; }
  .compare-val { font-size: 12.5px; font-weight: 500; color: var(--muted); }
  .type-template { margin-top: 20px; font-size: 17px; color: var(--muted); line-height: 1.45; }
  .type-template strong { color: var(--gold); letter-spacing: 0.1em; }
  .type-row { margin-top: 16px; width: 100%; display: flex; gap: 10px; }
  .answer-input { flex: 1; min-width: 0; font-family: var(--serif); font-size: 28px; text-align: center; color: var(--gold-bright);
    background: rgba(0, 0, 0, 0.4); border: 1px solid var(--line-2); border-radius: 16px; padding: 11px; outline: none; transition: border-color 0.25s var(--ease), box-shadow 0.25s var(--ease); }
  .answer-input::placeholder { color: var(--dim); font-family: var(--sans); font-size: 16px; }
  .answer-input:focus { border-color: var(--violet); box-shadow: 0 0 0 4px rgba(124, 92, 255, 0.15); }
  .answer-input.ok { border-color: var(--success); color: var(--success); }
  .answer-input.bad { border-color: var(--wrong); color: var(--wrong); }
  .btn-primary { margin-top: 22px; width: 100%; max-width: 320px; padding: 15px; font-size: 12px; font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase;
    color: #140E04; border-color: transparent; background: var(--champagne); background-size: 220% 100%;
    box-shadow: 0 14px 28px -14px rgba(212, 180, 122, 0.75), inset 0 1px 0 rgba(255, 255, 255, 0.5); }
  .btn-primary:hover { border-color: transparent; filter: brightness(1.06); }
  .type-row .btn-primary { margin-top: 0; width: auto; padding: 14px 18px; }
  .btn-link { margin-top: 10px; background: none; border: none; color: var(--muted); font-size: 13px; font-weight: 500; padding: 8px 10px;
    text-decoration: underline; text-decoration-color: rgba(139, 141, 164, 0.4); text-underline-offset: 4px; }
  .btn-link:hover { color: var(--text); }
  .result-line { margin-top: 16px; font-size: 13px; font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase; }
  .result-line.good { color: var(--success); }
  .result-line.close { color: #F3C76B; }
  .result-line.quick { display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; gap: 2px 10px; }
  .result-line .quick-ref { flex-basis: 100%; font-size: 12px; letter-spacing: 0.02em; text-transform: none; color: var(--pearl); font-weight: 600; }
  .result-line .hold-hint { flex-basis: 100%; font-size: 9px; letter-spacing: 0.24em; color: var(--dim); text-transform: uppercase; }
  /* knowledge strength – five dots straight from the memory box */
  .strength { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 4px; padding: 5px 2px; }
  .strength i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255, 255, 255, 0.1); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12); transition: background 0.3s; }
  .strength i.on { background: linear-gradient(135deg, #CFE3FF, #5EA8FF); box-shadow: 0 0 6px rgba(94, 168, 255, 0.7); }
  .strength.locked i.on { background: linear-gradient(135deg, #FFF6DD, #D4B47A); box-shadow: 0 0 6px rgba(243, 223, 176, 0.75); }
  .strength i.gain { animation: dotGain 0.55s cubic-bezier(0.2, 1.6, 0.3, 1) 0.08s both; }
  .strength i.lost { background: rgba(255, 77, 106, 0.18); box-shadow: inset 0 0 0 1px rgba(255, 77, 106, 0.35); }
  .strength .tgt { margin-right: 4px; font-style: normal; font-size: 8.5px; font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase; color: #FF8FA3; }
  @keyframes dotGain { 0% { transform: scale(0.2); background: #FFFFFF; } 60% { transform: scale(1.6); box-shadow: 0 0 12px rgba(160, 210, 255, 1); } 100% { transform: scale(1); } }
  .card.snap { animation: snap 0.26s cubic-bezier(0.2, 1, 0.3, 1); }
  @keyframes snap { 0% { transform: scale(0.992); box-shadow: 0 0 0 0 rgba(94, 168, 255, 0.55); } 60% { transform: scale(1.004); } 100% { transform: none; box-shadow: 0 0 0 10px rgba(94, 168, 255, 0); } }
  /* boss life bar = correct answers still needed; shield = misses still affordable */
  .boss-hp { display: flex; align-items: center; gap: 8px; min-width: 0; color: #FFB3C0; }
  .boss-hp b { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; font-weight: 800; }
  .boss-hp .hp { flex: 1 1 60px; min-width: 40px; height: 6px; border-radius: 999px; background: rgba(255, 77, 106, 0.15); overflow: hidden; }
  .boss-hp .hp i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #8E1430, #FF4D6A); box-shadow: 0 0 8px rgba(255, 77, 106, 0.7); transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1); }
  .boss-hp em { flex: 0 0 auto; font-style: normal; font-family: var(--mono); letter-spacing: 0.02em; color: var(--muted); }
  .boss-hp.hit .hp { animation: hpHit 0.4s ease-out; }
  .boss-hp.holds em { color: #FF8FA3; }
  @keyframes hpHit { 0% { transform: scaleY(2.2); filter: brightness(2); } 100% { transform: none; filter: none; } }
  .result-line .anchor-lock { display: block; margin-top: 2px; font-size: 10px; letter-spacing: 0.22em; color: var(--gold-bright); }
  .answer-input.close { border-color: #F3C76B; color: #F3C76B; box-shadow: 0 0 0 4px rgba(243, 199, 107, 0.12); }
  .result-line.low { color: var(--wrong); }

  .bottom { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .session { font-size: 11.5px; color: var(--muted); min-width: 0; }
  .btn-skip { flex: 0 0 auto; font-size: 12px; padding: 9px 16px; border-radius: 999px; background: transparent; }
  footer { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 6px; }
  .footer-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .btn-reset { font-size: 11.5px; padding: 8px 13px; color: var(--muted); background: transparent; border-radius: 999px; }
  .btn-reset:hover { color: var(--wrong); border-color: rgba(255, 77, 106, 0.5); }
  .btn-reset.neutral:hover { color: var(--text); border-color: var(--line-2); }
  .btn-undo { color: var(--success); border-color: rgba(92, 201, 167, 0.5); }
  .keys { font-size: 10.5px; color: var(--dim); text-align: center; line-height: 1.6; }

  /* ---------- overlays ---------- */
  .overlay { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; overflow-y: auto; overflow-x: hidden;
    background: rgba(2, 2, 6, 0.84); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); animation: fadeIn 0.3s var(--ease); }
  .overlay.deep { background: rgba(0, 0, 0, 0.95); animation: fadeIn 0.6s var(--ease); }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .overlay-box { position: relative; width: 100%; max-width: 400px; margin: auto; padding: 28px 22px 20px; text-align: center; border-radius: 26px;
    background: radial-gradient(110% 60% at 50% 0%, rgba(124, 92, 255, 0.18), rgba(10, 10, 18, 0) 60%), linear-gradient(180deg, #11111F, #07070C);
    border: 1px solid rgba(150, 130, 255, 0.35); box-shadow: 0 40px 80px -30px rgba(0, 0, 0, 1); animation: popIn 0.45s var(--ease); }
  @keyframes popIn { 0% { transform: translateY(12px) scale(0.95); opacity: 0; } 100% { transform: none; opacity: 1; } }
  .overlay-kicker { font-size: 10px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--electric); }
  .overlay-title { margin-top: 10px; font-family: var(--serif); font-size: 34px; line-height: 1.12; color: var(--pearl); overflow-wrap: anywhere; }
  .overlay-text { margin-top: 12px; font-size: 13.5px; color: var(--muted); line-height: 1.6; }
  .overlay-box .btn-primary { max-width: none; }
  .overlay-art { margin: -6px auto 6px; }
  .overlay-box.victory { border-color: rgba(212, 180, 122, 0.5); box-shadow: 0 0 80px -24px rgba(243, 223, 176, 0.6); }
  .overlay-box.fail, .overlay-box.boss { border-color: rgba(255, 77, 106, 0.5);
    background: radial-gradient(110% 60% at 50% 0%, rgba(255, 77, 106, 0.18), rgba(12, 6, 10, 0) 60%), linear-gradient(180deg, #170910, #070407); }
  .overlay-box.fail .overlay-kicker, .overlay-box.boss .overlay-kicker { color: #FF8FA3; }
  .boss-core, .fail-core { width: 150px; height: 150px; margin: 0 auto; }
  .boss-core .core, .fail-core .core { width: 100%; height: 100%; }
  .boss-core { filter: drop-shadow(0 0 22px rgba(255, 77, 106, 0.45)); }
  .fail-core { filter: grayscale(0.6) sepia(0.4) hue-rotate(-30deg) saturate(2.2) brightness(0.8); animation: glitch 2.8s steps(1) infinite; }
  @keyframes glitch { 0%, 100% { transform: none; } 6% { transform: translateX(-3px) skewX(-6deg); } 8% { transform: translateX(3px); } 10% { transform: none; } 56% { transform: translateY(1px) skewX(4deg); } 58% { transform: none; } }

  /* the ascension sequence (≈ 3 s): slow down → pull inward → flash → new form → title */
  .overlay-box.ascension { max-width: 420px; background: none; border: none; box-shadow: none; animation: none; }
  /* BOSS DEFEATED · GATE OPEN – the boss bar collapses, crimson shards break off, a gold/electric gate line opens; the Core stays as it is */
  #overlaySecondary[hidden] { display: none; }
  .overlay-box.bosswin { border-color: rgba(243, 223, 176, 0.55); box-shadow: 0 0 90px -20px rgba(255, 77, 106, 0.55), 0 0 60px -24px rgba(243, 223, 176, 0.7); }
  .overlay-box.bosswin .overlay-kicker { color: #FF8FA3; letter-spacing: 0.4em; }
  .bv { position: relative; width: 190px; height: 190px; margin: 0 auto 8px; }
  .bv-core { position: absolute; inset: 22px; opacity: 0.95; }
  .bv-core .core { width: 100%; height: 100%; }
  .bv-hp { position: absolute; left: 10px; right: 10px; top: 4px; height: 6px; border-radius: 999px; background: rgba(255, 77, 106, 0.15); overflow: hidden; }
  .bv-hp i { display: block; height: 100%; width: 100%; border-radius: 999px; background: linear-gradient(90deg, #8E1430, #FF4D6A); animation: bvHp 0.7s 0.1s cubic-bezier(0.6, 0, 0.3, 1) forwards; }
  .bv-shards i { position: absolute; left: 50%; top: 50%; width: 3px; height: 16px; margin: -8px 0 0 -1.5px; border-radius: 2px; background: linear-gradient(#FF8FA3, rgba(255, 51, 85, 0)); opacity: 0;
    transform: rotate(var(--a)) translateY(-40px); animation: bvShard 0.9s calc(0.45s + var(--d)) ease-out forwards; }
  .bv-gate { position: absolute; left: 50%; top: 8%; bottom: 10%; width: 0; pointer-events: none; }
  .bv-gate::before, .bv-gate::after { content: ""; position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; opacity: 0;
    background: linear-gradient(transparent, #FFF6DD 30%, #7FE0FF 70%, transparent); filter: drop-shadow(0 0 6px rgba(243, 223, 176, 0.95));
    animation: bvGateL 1.1s 0.75s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
  .bv-gate::after { animation-name: bvGateR; }
  .bv-tag { position: absolute; left: 0; right: 0; bottom: -2px; text-align: center; font-size: 10px; font-weight: 900; letter-spacing: 0.5em; padding-left: 0.5em; color: var(--gold-bright); opacity: 0; animation: bvTag 0.5s 1.1s ease-out forwards; }
  @keyframes bvHp { to { width: 0; opacity: 0.4; } }
  @keyframes bvShard { 0% { opacity: 0; } 20% { opacity: 1; } 100% { opacity: 0; transform: rotate(var(--a)) translateY(-104px) scaleY(0.4); } }
  @keyframes bvGateL { 0% { opacity: 0; transform: scaleY(0.1); } 35% { opacity: 1; transform: scaleY(1); } 100% { opacity: 0.55; transform: translateX(-74px); } }
  @keyframes bvGateR { 0% { opacity: 0; transform: scaleY(0.1); } 35% { opacity: 1; transform: scaleY(1); } 100% { opacity: 0.55; transform: translateX(74px); } }
  @keyframes bvTag { from { opacity: 0; letter-spacing: 0.9em; } to { opacity: 1; letter-spacing: 0.5em; } }
  body.fx-reduced .bv-hp i, body.fx-reduced .bv-shards i, body.fx-reduced .bv-gate::before, body.fx-reduced .bv-gate::after { animation: none; }
  body.fx-reduced .bv-hp i { width: 0; }
  body.fx-reduced .bv-tag { animation: none; opacity: 1; }
  .asc { position: relative; width: 220px; height: 220px; margin: 0 auto 10px; }
  .asc > div { position: absolute; inset: 0; }
  .asc .core { width: 100%; height: 100%; overflow: visible; }
  .asc-old { animation: ascOld 1.75s cubic-bezier(0.5, 0, 0.75, 0) forwards; }
  @keyframes ascOld { 0% { transform: scale(1) rotate(0); opacity: 1; } 45% { transform: scale(0.97) rotate(6deg); } 82% { transform: scale(0.32) rotate(42deg); filter: brightness(2.6); opacity: 1; } 100% { transform: scale(0) rotate(64deg); filter: brightness(4); opacity: 0; } }
  .asc-ring { border-radius: 50%; border: 1px dashed rgba(170, 150, 255, 0.7); animation: ascRing 1.75s cubic-bezier(0.6, 0, 0.9, 0.4) forwards; }
  @keyframes ascRing { 0% { transform: scale(1.06) rotate(0); opacity: 0.8; } 100% { transform: scale(0.12) rotate(900deg); opacity: 0; } }
  .asc-pull i { position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px; border-radius: 50%; background: #D6CAFF; box-shadow: 0 0 8px #9F86FF; opacity: 0;
    animation: ascPull 1.25s cubic-bezier(0.55, 0, 0.9, 0.35) calc(0.25s + var(--d)) forwards; }
  @keyframes ascPull { 0% { opacity: 0; transform: rotate(var(--a)) translateY(-122px); } 20% { opacity: 1; } 100% { opacity: 0.9; transform: rotate(calc(var(--a) + 90deg)) translateY(0) scale(0.4); } }
  .asc-flash { border-radius: 50%; opacity: 0; background: radial-gradient(circle, #FFFFFF 0%, rgba(214, 200, 255, 0.9) 22%, rgba(124, 92, 255, 0.4) 48%, rgba(124, 92, 255, 0) 70%);
    animation: ascFlash 0.8s ease-out 1.6s forwards; }
  @keyframes ascFlash { 0% { opacity: 0; transform: scale(0.2); } 25% { opacity: 1; transform: scale(1.7); } 100% { opacity: 0; transform: scale(2.5); } }
  .asc-new { opacity: 0; animation: ascNew 1.1s cubic-bezier(0.2, 1.3, 0.3, 1) 1.8s forwards; }
  @keyframes ascNew { 0% { opacity: 0; transform: scale(0.4); filter: brightness(3) blur(3px); } 60% { opacity: 1; transform: scale(1.08); filter: brightness(1.4) blur(0); } 100% { opacity: 1; transform: none; filter: none; } }
  .overlay-box.ascension .overlay-kicker { color: var(--gold-bright); letter-spacing: 0.36em; animation: ascText 0.6s ease 2.2s both; }
  .overlay-box.ascension .overlay-title { font-size: 46px; text-shadow: 0 0 30px rgba(124, 92, 255, 0.7); animation: ascText 0.6s ease 2.4s both; }
  .overlay-box.ascension .overlay-text { color: var(--text); animation: ascText 0.6s ease 2.65s both; }
  .overlay-box.ascension .btn { animation: ascText 0.5s ease 2.9s both; }
  @keyframes ascText { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* ---------- answer feedback: short, layered, ranked by importance ---------- */
  .fx { position: fixed; inset: 0; pointer-events: none; z-index: 47; overflow: hidden; }
  .dust { position: absolute; top: -12px; width: 6px; height: 6px; border-radius: 1px; background: linear-gradient(135deg, #F3DFB0, #8F7CFF); animation: fall var(--t) linear forwards; }
  @keyframes fall { 0% { transform: translate(0, 0) rotate(0deg); opacity: 1; } 100% { transform: translate(var(--dx), 105vh) rotate(var(--r)); opacity: 0.2; } }
  .shard { position: absolute; width: 6px; height: 6px; border-radius: 1px; box-shadow: 0 0 8px currentColor; animation: shard 0.9s cubic-bezier(0.15, 0.8, 0.3, 1) forwards; }
  @keyframes shard { 0% { transform: translate(-50%, -50%) rotate(45deg) scale(1.2); opacity: 1; } 100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(225deg) scale(0.2); opacity: 0; } }
  .xp-pop { position: absolute; transform: translate(-50%, -50%); font-family: var(--serif); font-size: 22px; color: #EAF2FF; white-space: nowrap;
    text-shadow: 0 0 14px rgba(94, 168, 255, 0.9), 0 0 2px rgba(255, 255, 255, 0.9); animation: xpRise 1.05s cubic-bezier(0.2, 0.9, 0.3, 1) forwards; }
  .xp-pop.gold { font-size: 26px; color: #FFF3D2; text-shadow: 0 0 18px rgba(243, 223, 176, 1), 0 0 36px rgba(212, 180, 122, 0.7); }
  @keyframes xpRise { 0% { opacity: 0; transform: translate(-50%, -30%) scale(0.7); } 18% { opacity: 1; transform: translate(-50%, -60%) scale(1.08); } 100% { opacity: 0; transform: translate(-50%, -240%) scale(1); } }
  .ring-wave { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 2px solid rgba(243, 223, 176, 0.9);
    box-shadow: 0 0 30px rgba(243, 223, 176, 0.6), inset 0 0 24px rgba(243, 223, 176, 0.4); animation: ringWave 0.95s cubic-bezier(0.15, 0.8, 0.3, 1) forwards; }
  @keyframes ringWave { 0% { opacity: 1; transform: scale(0.3); } 100% { opacity: 0; transform: scale(4.4); } }

  .card.flash-ok { animation: flashOk 0.75s var(--ease); }
  .card.flash-strong { animation: flashStrong 0.9s var(--ease); }
  .card.flash-gold { animation: flashGold 1.1s var(--ease); }
  .card.flash-bad { animation: shake 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97); }
  @keyframes flashOk { 0% { box-shadow: 0 0 0 0 rgba(92, 201, 167, 0.55), 0 0 0 0 rgba(94, 168, 255, 0.4); } 100% { box-shadow: 0 0 0 22px rgba(92, 201, 167, 0), 0 0 50px 8px rgba(94, 168, 255, 0); } }
  @keyframes flashStrong { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(94, 168, 255, 0.7), 0 0 0 0 rgba(124, 92, 255, 0.6); } 22% { transform: scale(1.012); }
    100% { transform: none; box-shadow: 0 0 0 28px rgba(94, 168, 255, 0), 0 0 70px 14px rgba(124, 92, 255, 0); } }
  @keyframes flashGold { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(243, 223, 176, 0.9), 0 0 0 0 rgba(212, 180, 122, 0.7); border-color: rgba(243, 223, 176, 0.9); } 20% { transform: scale(1.018); }
    100% { transform: none; box-shadow: 0 0 0 34px rgba(243, 223, 176, 0), 0 0 90px 20px rgba(212, 180, 122, 0); } }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 15% { transform: translateX(-8px) skewX(-1deg); } 35% { transform: translateX(7px) skewX(0.8deg); } 55% { transform: translateX(-4px); } 75% { transform: translateX(2px); } }
  .opt.correct { color: #C4F0DF; border-color: rgba(92, 201, 167, 0.8); background: linear-gradient(180deg, rgba(92, 201, 167, 0.22), rgba(92, 201, 167, 0.06)); box-shadow: 0 0 28px -8px rgba(92, 201, 167, 0.85), inset 0 0 0 1px rgba(196, 240, 223, 0.25); animation: impact 0.5s var(--ease); }
  .opt.incorrect { color: #FFB3C0; border-color: rgba(255, 77, 106, 0.8); background: linear-gradient(180deg, rgba(120, 10, 40, 0.35), rgba(40, 4, 14, 0.5)); box-shadow: 0 0 24px -6px rgba(255, 51, 85, 0.85); animation: hitBadOpt 0.4s ease; }
  .answer-input.ok { box-shadow: 0 0 0 4px rgba(92, 201, 167, 0.14), 0 0 26px -6px rgba(92, 201, 167, 0.8); animation: impact 0.5s var(--ease); }
  .answer-input.bad { box-shadow: 0 0 0 4px rgba(255, 77, 106, 0.12), 0 0 22px -6px rgba(255, 51, 85, 0.8); }
  @keyframes impact { 0% { transform: scale(1); } 35% { transform: scale(1.045); filter: brightness(1.35); } 100% { transform: scale(1); filter: none; } }
  @keyframes hitBadOpt { 0% { transform: translateX(0); filter: brightness(1.6); } 30% { transform: translateX(-3px); } 60% { transform: translateX(2px); } 100% { transform: none; filter: none; } }

  /* the burst label – five weights, from a quiet REGISTERED to a rare MASTERY ACHIEVED */
  .fxburst { position: fixed; left: 50%; top: 32%; z-index: 46; pointer-events: none; transform: translate(-50%, -50%); opacity: 0; text-align: center; width: max-content; max-width: calc(100vw - 24px); }
  .fxburst .fb-in { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 11px 20px; border-radius: 16px;
    background: rgba(6, 6, 12, 0.93); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); border: 1px solid rgba(150, 130, 255, 0.3); box-shadow: 0 14px 34px -12px rgba(0, 0, 0, 0.95), 0 0 30px -12px rgba(124, 92, 255, 0.7); }
  .fxburst b { font-weight: 900; font-size: min(24px, 5.4vw); letter-spacing: 0.14em; white-space: nowrap; }
  .fxburst span { font-weight: 800; font-size: 11.5px; letter-spacing: 0.16em; white-space: nowrap; }
  .fxburst.ok b { background: linear-gradient(90deg, #DDE9FF, #FFFFFF 45%, #A9CBFF 70%, #C8B2FF); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 12px rgba(94, 140, 255, 0.85)); }
  .fxburst.ok span { color: #CFE3FF; }

  .fxburst.s1 b { font-size: min(18px, 4.6vw); filter: drop-shadow(0 0 6px rgba(94, 140, 255, 0.6)); }
  .fxburst.s3 b, .fxburst.s4 b { font-size: min(26px, 5.8vw); }
  .fxburst.t3 b { font-size: min(28px, 6.4vw); background: linear-gradient(90deg, #C8B2FF, #FFFFFF 50%, #8FD0FF); -webkit-background-clip: text; background-clip: text; filter: drop-shadow(0 0 16px rgba(140, 110, 255, 1)); }
  .fxburst.t4 b, .fxburst.s5 b { font-size: min(30px, 6.8vw); background: linear-gradient(90deg, #8E6D38, #F7E7C1 30%, #FFFFFF 50%, #E9D3A0 70%, #A8854C); -webkit-background-clip: text; background-clip: text;
    filter: drop-shadow(0 0 18px rgba(243, 223, 176, 0.95)); }
  .fxburst.t4 span, .fxburst.s5 span { color: #F3DFB0; }
  .fxburst.t4 .fb-in { border-color: rgba(243, 223, 176, 0.6); box-shadow: 0 14px 34px -12px rgba(0, 0, 0, 0.95), 0 0 40px -8px rgba(243, 223, 176, 0.75); }

  .fxburst.play.ok { animation: hitOk 1s cubic-bezier(0.2, 1.4, 0.3, 1) forwards; }

  .fxburst.play.t5 { animation: hitOk 0.8s cubic-bezier(0.2, 1.4, 0.3, 1) forwards; }

  @keyframes hitOk { 0% { opacity: 0; transform: translate(-50%, -30%) scale(0.6); } 16% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); } 30% { transform: translate(-50%, -52%) scale(1); }

  @keyframes checkIn { 0% { opacity: 0; transform: translate(-50%, -50%) scaleX(0.4); } 14% { opacity: 1; transform: translate(-50%, -50%) scaleX(1.04); } 22% { transform: translate(-50%, -50%) scaleX(1); } 82% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -62%); } }
  @keyframes hitBad { 0% { opacity: 0; transform: translate(-50%, -50%) scale(1.35) skewX(-12deg); } 12% { opacity: 1; transform: translate(-52%, -50%) scale(1) skewX(8deg); }
    18% { transform: translate(-48%, -50%) skewX(-5deg); } 24% { transform: translate(-50%, -50%) skewX(0); } 78% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -42%); } }

  /* NORMAL LEVEL-UP – big, short, non-blocking (pointer-events none) */
  .fxlevel { position: fixed; left: 50%; top: 34%; z-index: 46; pointer-events: none; transform: translate(-50%, -50%); opacity: 0; width: max-content; max-width: calc(100vw - 24px); text-align: center; }
  .fxlevel .lu-in { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 14px 30px 15px; border-radius: 20px;
    background: radial-gradient(ellipse at 50% 0%, rgba(124, 92, 255, 0.4), rgba(124, 92, 255, 0) 72%), #07070D; border: 1px solid rgba(243, 223, 176, 0.55);
    box-shadow: 0 20px 50px -16px #000, 0 0 60px -10px rgba(124, 92, 255, 0.95), inset 0 1px 0 rgba(255, 255, 255, 0.1); }
  .lu-k { font-weight: 900; font-size: min(30px, 7.6vw); letter-spacing: 0.24em; padding-left: 0.24em; text-transform: uppercase; white-space: nowrap;
    background: linear-gradient(90deg, #C8DEFF, #FFFFFF 40%, #F7E7C1 65%, #C8B2FF); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 14px rgba(140, 180, 255, 0.95)); }
  .lu-n { display: flex; align-items: baseline; gap: 12px; font-family: var(--serif); line-height: 1.05; }
  .lu-n span { font-size: 26px; color: var(--muted); }
  .lu-n i { font-style: normal; font-size: 18px; color: var(--electric); }
  .lu-n b { display: inline-block; font-weight: 400; font-size: 46px; color: #FFF6DD; text-shadow: 0 0 22px rgba(243, 223, 176, 1), 0 0 44px rgba(124, 92, 255, 0.9); }
  .fxlevel.play .lu-n b { animation: luNum 0.8s 0.18s cubic-bezier(0.2, 1.5, 0.3, 1) both; }
  .lu-t { font-size: 10.5px; font-weight: 800; letter-spacing: 0.24em; text-transform: uppercase; color: var(--gold-bright); }
  .lu-g { font-size: 10px; font-weight: 800; letter-spacing: 0.18em; text-transform: uppercase; color: #FF8FA3; margin-top: 2px; }
  .fxlevel.play { animation: luIn 1.25s cubic-bezier(0.2, 1.2, 0.3, 1) forwards; }
  @keyframes luIn { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.6); } 14% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); } 26% { transform: translate(-50%, -50%) scale(1); }
    80% { opacity: 1; transform: translate(-50%, -55%); } 100% { opacity: 0; transform: translate(-50%, -64%) scale(0.98); } }
  @keyframes luNum { 0% { transform: scale(0.4); opacity: 0; } 60% { transform: scale(1.25); opacity: 1; } 100% { transform: scale(1); } }
  .rise { position: absolute; width: 4px; height: 11px; border-radius: 2px; box-shadow: 0 0 10px currentColor; opacity: 0; animation: lvRise 1.05s ease-out forwards; }
  @keyframes lvRise { 0% { opacity: 0; transform: translate(-50%, 0) scaleY(0.6); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), var(--dy)) scaleY(1.25); } }
  .sweep { position: absolute; height: 3px; margin-top: -1.5px; border-radius: 2px; transform-origin: left center; opacity: 0;
    background: linear-gradient(90deg, rgba(94, 168, 255, 0), rgba(214, 234, 255, 0.95) 70%, #FFFFFF); box-shadow: 0 0 16px rgba(94, 168, 255, 0.9); animation: sweep 0.6s cubic-bezier(0.2, 0.8, 0.3, 1) forwards; }
  .sweep.gold { background: linear-gradient(90deg, rgba(243, 223, 176, 0), #F7E7C1 70%, #FFFFFF); box-shadow: 0 0 16px rgba(243, 223, 176, 0.9); }
  @keyframes sweep { 0% { opacity: 0; transform: scaleX(0.04); } 25% { opacity: 1; } 100% { opacity: 0; transform: scaleX(1); } }
  /* CHAPTER CLEARED – smaller, restrained blue / gold */
  .fxmile { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 98px); z-index: 45; pointer-events: none; transform: translate(-50%, 0); opacity: 0; width: max-content; max-width: calc(100vw - 32px); text-align: center; }
  .fxmile .mi-in { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 18px; border-radius: 14px; background: rgba(6, 8, 16, 0.95);
    border: 1px solid rgba(243, 223, 176, 0.45); box-shadow: 0 0 34px -10px rgba(94, 168, 255, 0.85), 0 12px 30px -14px #000; }
  .fxmile b { font-size: 13px; font-weight: 900; letter-spacing: 0.36em; padding-left: 0.36em; text-transform: uppercase; white-space: nowrap;
    background: linear-gradient(90deg, #F3DFB0, #FFFFFF 45%, #A9CBFF); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .fxmile span { font-size: 10.5px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #CFE3FF; }

  .fxmile.play { animation: miIn 1.05s var(--ease) forwards; }
  @keyframes miIn { 0% { opacity: 0; transform: translate(-50%, -10px) scaleX(0.6); } 15% { opacity: 1; transform: translate(-50%, 0) scaleX(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -6px); } }
  .fxburst.play.yield { animation: yieldOut 0.22s ease-out forwards; }
  @keyframes yieldOut { 0% { opacity: 0.9; transform: translate(-50%, -60%); } 100% { opacity: 0; transform: translate(-50%, -80%) scale(0.94); } }
  .fxburst.rec b { background: linear-gradient(90deg, #7FE0FF, #FFFFFF 45%, #F7E7C1 70%, #D4B47A); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 14px rgba(127, 224, 255, 0.9)); }
  .fxburst.rec span { color: #F3DFB0; }
  .fxburst.rec .fb-in { border-color: rgba(127, 224, 255, 0.55); box-shadow: 0 14px 34px -12px rgba(0, 0, 0, 0.95), 0 0 36px -8px rgba(243, 223, 176, 0.7); }
  .fxburst.practice b { font-size: min(17px, 4.4vw); }
  .fxburst.bad span { white-space: normal; }
  .fxburst.bad.soft b { font-size: min(15px, 4vw); letter-spacing: 0.24em; }
  .fxburst.bad.soft .fb-in { padding: 7px 14px; }
  .fxburst.play.bad.soft { animation: hitBad 0.6s ease-out forwards; }
  .fxburst.ir b { background: linear-gradient(90deg, #A6ECFF, #FFFFFF 45%, #CFE3FF 70%, #7FE0FF); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 14px rgba(127, 224, 255, 0.95)); letter-spacing: 0.2em; }
  .fxburst.ir .fb-in { border-color: rgba(127, 224, 255, 0.55); }
  .fxburst.play.ir { animation: hitOk 0.65s cubic-bezier(0.2, 1.4, 0.3, 1) forwards; }
  /* DEBRIEF – full screen, the numbers count up, it stays until you tap */
  .debrief { position: fixed; inset: 0; z-index: 54; display: flex; align-items: center; justify-content: center; padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px);
    background: radial-gradient(ellipse at 50% 30%, rgba(60, 40, 140, 0.45), rgba(3, 3, 8, 0.96) 70%); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); overflow-y: auto; }
  .debrief[hidden] { display: none; }
  .db-box { position: relative; width: 100%; max-width: 420px; padding: 26px 20px 14px; border-radius: 24px; border: 1px solid rgba(243, 223, 176, 0.35); background: rgba(8, 8, 15, 0.92); overflow: hidden; text-align: center;
    box-shadow: 0 30px 70px -20px #000, 0 0 60px -20px rgba(124, 92, 255, 0.8); }
  .db-sweep { position: absolute; top: 0; bottom: 0; left: -40%; width: 40%; pointer-events: none; background: linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(243, 223, 176, 0.18), rgba(255, 255, 255, 0)); }
  .debrief.play .db-sweep { animation: dbSweep 1.1s 0.15s cubic-bezier(0.3, 0.7, 0.2, 1) both; }
  .debrief.play .db-box { animation: dbIn 0.5s cubic-bezier(0.2, 1.1, 0.3, 1) both; }
  @keyframes dbSweep { from { left: -40%; } to { left: 110%; } }
  @keyframes dbIn { from { opacity: 0; transform: translateY(14px) scale(0.97); } to { opacity: 1; transform: none; } }
  .db-kicker { font-size: 11px; font-weight: 900; letter-spacing: 0.42em; padding-left: 0.42em; text-transform: uppercase;
    background: linear-gradient(90deg, #F3DFB0, #FFFFFF 50%, #A9CBFF); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .db-goals { margin-top: 10px; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 12px; font-size: 11px; color: var(--gold-bright); }
  .db-hero { margin-top: 18px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .db-stat b { display: block; font-family: var(--serif); font-weight: 400; font-size: min(38px, 10vw); line-height: 1.05; color: var(--pearl); font-variant-numeric: tabular-nums; }
  .db-stat:last-child b { font-size: min(26px, 7vw); color: #CFE3FF; padding-top: 6px; }
  .db-stat span { display: block; margin-top: 4px; font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
  .db-small { margin-top: 16px; font-size: 12px; line-height: 1.6; color: var(--muted); }
  .db-bonus { margin-top: 8px; font-family: var(--mono); font-size: 12px; color: var(--gold-bright); }
  .db-best { margin: 14px auto 0; padding: 8px 12px; border-radius: 12px; border: 1px solid rgba(243, 223, 176, 0.4); font-size: 12.5px; color: #FFF3D2; }
  .db-best span { display: block; font-size: 9px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--gold-bright); margin-bottom: 2px; }
  .db-go { margin-top: 20px; width: 100%; }
  .db-end { margin-top: 4px; }
  body.fx-reduced .debrief.play .db-box, body.fx-reduced .debrief.play .db-sweep, body.fx-reduced .strength i.gain, body.fx-reduced .card.snap, body.fx-reduced .hud-ring { animation: none; }
  .fxburst.close b { color: #F7D88C; text-shadow: 0 0 14px rgba(243, 199, 107, 0.75); font-size: min(22px, 5.2vw); }
  .fxburst.close span { color: #F3DFB0; }
  .fxburst.close .fb-in { border-color: rgba(243, 199, 107, 0.5); }
  .fxburst.play.close { animation: hitOk 0.9s cubic-bezier(0.2, 1.2, 0.3, 1) forwards; }
  .fxflash.level { background: radial-gradient(ellipse at 50% 36%, rgba(255, 255, 255, 0.24) 0%, rgba(124, 170, 255, 0.14) 35%, rgba(0, 0, 0, 0) 70%); }

  /* screen layer: a low-opacity radial flash – emerald / gold for success, a crimson fracture for a miss */
  .fxflash { position: fixed; inset: 0; z-index: 44; pointer-events: none; opacity: 0; }
  .fxflash.ok { background: radial-gradient(ellipse at 50% 55%, rgba(92, 201, 167, 0.16) 0%, rgba(94, 168, 255, 0.08) 40%, rgba(0, 0, 0, 0) 70%); }
  .fxflash.gold { background: radial-gradient(ellipse at 50% 55%, rgba(243, 223, 176, 0.26) 0%, rgba(124, 92, 255, 0.1) 45%, rgba(0, 0, 0, 0) 72%); }
  .fxflash.bad { background: radial-gradient(ellipse at center, rgba(255, 51, 85, 0) 35%, rgba(150, 10, 50, 0.28) 75%, rgba(40, 0, 25, 0.62) 100%); }
  .fxflash .fracture { position: absolute; inset: 0; width: 100%; height: 100%; display: none; }
  .fxflash.bad .fracture { display: block; }
  .fxflash.play { animation: flashIn 0.55s ease-out forwards; }
  .fxflash.bad.play { animation: flashBad 0.7s ease-out forwards; }
  @keyframes flashIn { 0% { opacity: 0; } 20% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes flashBad { 0% { opacity: 0; } 10% { opacity: 1; } 30% { opacity: 0.55; } 40% { opacity: 0.9; } 100% { opacity: 0; } }

  /* the combo indicator above the card – it builds with the run and breaks visibly */
  .card-wrap { position: relative; min-width: 0; }
  .combo-badge { position: absolute; z-index: 3; top: -11px; left: 50%; transform: translateX(-50%); display: flex; align-items: baseline; gap: 8px; white-space: nowrap;
    padding: 4px 12px; border-radius: 999px; background: #0B0B16; border: 1px solid rgba(150, 130, 255, 0.45); }
  .combo-badge b { font-size: 10.5px; font-weight: 800; letter-spacing: 0.22em; color: #CFC4FF; }
  .combo-badge span { font-size: 9px; font-weight: 700; letter-spacing: 0.26em; color: var(--muted); }
  .combo-badge.c5 { border-color: rgba(150, 130, 255, 0.7); box-shadow: 0 0 14px -4px rgba(124, 92, 255, 0.8); }
  .combo-badge.c10 { border-color: rgba(94, 168, 255, 0.8); box-shadow: 0 0 18px -4px rgba(94, 168, 255, 0.9); }
  .combo-badge.c10 b { color: #E2EEFF; }
  .combo-badge.c20 { border-color: rgba(243, 223, 176, 0.8); box-shadow: 0 0 22px -4px rgba(243, 223, 176, 0.8); }
  .combo-badge.c20 b, .combo-badge.c30 b { color: #FFF3D2; }
  .combo-badge.c30 { border-color: transparent; background: linear-gradient(#0B0B16, #0B0B16) padding-box, linear-gradient(90deg, #8E6D38, #F7E7C1, #7C5CFF, #5EA8FF, #F7E7C1) border-box; border: 1px solid transparent;
    box-shadow: 0 0 28px -4px rgba(243, 223, 176, 0.75); animation: syncEdge 2.4s ease-in-out infinite; }
  @keyframes syncEdge { 0%, 100% { box-shadow: 0 0 22px -6px rgba(243, 223, 176, 0.6); } 50% { box-shadow: 0 0 30px -2px rgba(124, 92, 255, 0.8); } }
  .combo-badge.up { animation: comboUp 0.5s var(--ease); }
  @keyframes comboUp { 0% { transform: translateX(-50%) scale(1); } 40% { transform: translateX(-50%) scale(1.14); } 100% { transform: translateX(-50%) scale(1); } }
  .combo-badge.broken { border-color: rgba(255, 77, 106, 0.6); animation: comboBreak 1.3s ease forwards; }
  .combo-badge.broken b { color: #FF8FA3; text-decoration: line-through; text-decoration-color: rgba(255, 77, 106, 0.7); }
  @keyframes comboBreak { 0% { opacity: 1; transform: translateX(-50%); } 12% { transform: translateX(-53%) skewX(-8deg); } 24% { transform: translateX(-48%) skewX(5deg); } 34% { transform: translateX(-50%); } 75% { opacity: 1; } 100% { opacity: 0; } }

  .toast { position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); z-index: 45; transform: translateX(-50%) translateY(20px); max-width: calc(100% - 32px); text-align: center;
    background: rgba(12, 12, 22, 0.97); border: 1px solid rgba(150, 130, 255, 0.45); color: var(--pearl); font-size: 13px; font-weight: 600; letter-spacing: 0.02em;
    padding: 10px 18px; border-radius: 18px; box-shadow: 0 16px 40px -12px rgba(0, 0, 0, 0.8); opacity: 0; pointer-events: none;
    transition: opacity 0.3s var(--ease), transform 0.4s var(--ease); }

  /* ---------- settings ---------- */
  .settings { position: fixed; inset: 0; z-index: 52; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(2, 2, 6, 0.84); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  .set-box { width: 100%; max-width: 380px; border-radius: 24px; padding: 20px 18px; background: linear-gradient(180deg, #11111F, #07070C); border: 1px solid rgba(150, 130, 255, 0.35); }
