  });


  // =====================================================
  // COMMAND CENTER ↔ TRAINING MODE and the persistent Agent HUD.
  // The HUD bar is the REAL Journey progress inside the current Agent Level (never XP);
  // XP sits beside it as a score. It updates only when state changes – no loops.
  // =====================================================
  let uiMode = "command", heroInView = true, hudState = null;
  function bodyHas(c) { return !!(document.body && document.body.classList && document.body.classList.contains(c)); }
  function bodyCls(c, on) { if (document.body && document.body.classList) document.body.classList.toggle(c, on); }
  function syncHud() { el.hud.classList.toggle("on", uiMode === "train" || !heroInView); }
  function setMode(m) {
    if (uiMode === m) return;
    uiMode = m;
    bodyCls("train", m === "train");
    bodyCls("opts", false);
    el.optsBtn.classList.remove("on");
    syncHud();
    if (m === "command") { try { window.scrollTo({ top: 0, behavior: motionMode() === "reduced" ? "auto" : "smooth" }); } catch (e) { /* ignore */ } }
  }
  function fmt2(v) { return (Math.floor(v * 100 + 1e-9) / 100).toFixed(2); }
  // smooth count-up of a number in the HUD (requestAnimationFrame only while it runs)
  function countTo(node, from, to, fmt, live) {
    node._tok = (node._tok || 0) + 1;
    const tok = node._tok;
    if (!live || from === to) { node.textContent = fmt(to); return; }
    const start = Date.now(), dur = 650;
    const tick = () => {
      if (node._tok !== tok) return;
      const t = Math.min(1, (Date.now() - start) / dur);
      node.textContent = fmt(from + (to - from) * (1 - Math.pow(1 - t, 3)));
      if (t < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
  // HUD text under the bar: the truthful distance to the next threshold (Journey %, never an item estimate)
  function hudNextText(st) {
    if (st.level >= 100) return "Final form";
    if (st.gated) return "⚔ Boss gate · Lv " + st.level + " locked";
    if (st.recovery) return fmtGap(st.toGo) + " % to recover Lv " + st.level;
    return fmtGap(st.toGo) + " % to Lv " + (st.level + 1);
  }
  let hudAnimUntil = 0, nearUntil = 0, antic = { level: 0, n75: true, n90: true };
  function applyHudBar(st, spark) {
    el.hudFill.style.width = (st.into * 100).toFixed(3) + "%";
    if (spark) restartAnim(el.hudSpark, "on");
  }
  function renderHud(infoIn) {
    const info = infoIn || agentInfo(), m = meta();
    const st = { level: info.level, pct: info.j.pct, into: info.into, xp: m.xp, combo: play.combo, gated: info.gated, recovery: info.recovery, toGo: info.toGo, title: info.title };
    const prev = hudState;
    hudState = st;
    const live = typeof requestAnimationFrame === "function" && motionMode() !== "reduced";
    el.hudTitle.textContent = st.recovery ? "Knowledge recovery" : st.title;
    countTo(el.hudPct, prev ? prev.pct : st.pct, st.pct, v => fmt2(v) + " %", live);
    countTo(el.hudXp, prev ? prev.xp : st.xp, st.xp, v => Math.round(v).toLocaleString("en-US") + " XP", live);
    if (prev && st.xp > prev.xp) restartAnim(el.hudXp, "pop");
    el.hud.classList.toggle("gated", st.gated);
    el.hud.classList.toggle("recovery", st.recovery);
    el.hud.classList.toggle("max", st.level >= 100);
    el.hud.classList.toggle("near", !st.gated && !st.recovery && st.level < 100 && st.into >= 0.75);
    if (Date.now() >= nearUntil) el.hudNext.textContent = hudNextText(st);
    // the session-mission ring next to the level (the one approved extra progress indicator)
    const mp = missionProgress(), C = 2 * Math.PI * 9.5;
    el.hudRingFg.style.strokeDasharray = C.toFixed(2);
    el.hudRingFg.style.strokeDashoffset = (C * (1 - mp.frac)).toFixed(2);
    el.hudRing.classList.toggle("full", mp.frac >= 1);
    const tier = comboTier(st.combo);
    el.hudCombo.textContent = st.combo >= 5 ? "Combo x" + st.combo : "";          // the combo only appears from x5
    el.hudCombo.style.color = tier ? (tier[0] >= 20 ? "#FFF3D2" : tier[0] >= 10 ? "#E2EEFF" : "#D9CFFF") : "";
    if (prev && st.combo > prev.combo) restartAnim(el.hudCombo, "bump");
    if (prev && st.combo > prev.combo && isComboMilestone(st.combo)) restartAnim(el.hud, "combo-hit");
    const grew = prev && st.pct > prev.pct + 1e-9;
    if (live && prev && st.level > prev.level) {
      // LEVEL UP: the bar runs full under the old number, flashes – then the new number bumps and the bar empties
      // into the new level's REAL progress. Without a level change the bar never resets.
      el.hudLevel.textContent = prev.level;
      el.hudNext.textContent = "Level up → Lv " + st.level;
      el.hudFill.style.width = "100%";
      restartAnim(el.hudGlint, "run");
      restartAnim(el.hudSpark, "on");
      restartAnim(el.hud, "lvl-up");
      hudAnimUntil = Date.now() + 900;
      setTimeout(() => {
        const now = hudState;
        el.hudLevel.textContent = now.level;
        el.hudNext.textContent = hudNextText(now);
        restartAnim(el.hudLevel, "bump");
        el.hudFill.classList.add("snap");
        el.hudFill.style.width = "0%";
        void el.hudFill.offsetWidth;
        el.hudFill.classList.remove("snap");
        applyHudBar(now, true);
      }, 900);
    } else if (Date.now() < hudAnimUntil) {
      // a level-up is still playing – its timer applies the latest state
    } else {
      el.hudLevel.textContent = st.level;
      applyHudBar(st, live && grew && !st.gated);
      if (live && grew && !st.gated && prev && st.level === prev.level) restartAnim(el.hudGlint, "run");
    }
    // near-level anticipation: once per level at 75 % (glow) and 90 % (a short system line) – never on load, never spammed
    if (antic.level !== st.level) antic = { level: st.level, n75: st.into >= 0.75, n90: st.into >= 0.9 };
    else if (!st.gated && !st.recovery && st.level < 100) {
      if (!antic.n90 && st.into >= 0.9) {
        antic.n90 = antic.n75 = true;
        if (live) {
          nearUntil = Date.now() + 1700;
          el.hudNext.textContent = "Level threshold near";
          restartAnim(el.hudNext, "near-msg");
          hudReact("near");
          setTimeout(() => { el.hudNext.classList.remove("near-msg"); if (hudState) el.hudNext.textContent = hudNextText(hudState); }, 1750);
        }
      } else if (!antic.n75 && st.into >= 0.75) {
        antic.n75 = true;
        if (live) hudReact("near");
      }
    }
  }
  // the mission line above the card (the card itself names module and chapter)
  // BOSS: a life bar that is exactly the number of correct answers still needed (90 %) + a shield = misses you can still afford
  let bossHpPrev = null;
  function bossHpHTML() {
    const total = test.items.length, need = testNeed(total);
    const hp = Math.max(0, need - test.correct), shield = (total - need) - test.missed.length;
    const hit = bossHpPrev !== null && hp < bossHpPrev;
    bossHpPrev = hp;
    return '<span class="boss-hp' + (hit ? " hit" : "") + (shield < 0 ? " holds" : "") + '"><b>⚔ ' + esc(test.bossName) + '</b><span class="hp"><i style="width:' + (hp / need * 100).toFixed(1) + '%"></i></span>' +
      "<em>" + hp + " HP · " + (shield >= 0 ? "Shield " + shield : "Gate holds") + "</em></span>";
  }
  function renderTrainCtx() {
    if (test && test.boss) { el.trainCtx.innerHTML = bossHpHTML(); return; }
    bossHpPrev = null;
    el.trainCtx.textContent = test ? testLabel(view.item || {})
      : journeyOn && focus ? "Journey · " + FOCUS_LABEL[focus.kind]
      : (weakMode[activeSection] ? "Weak spots · " : "Practice · ") + MODULE_NAME[activeSection];
  }


  el.hudBack.addEventListener("click", () => setMode("command"));
  el.debriefGo.addEventListener("click", () => closeDebrief("go"));
  el.debriefEnd.addEventListener("click", () => closeDebrief("end"));
  el.hudMain.addEventListener("click", () => { if (uiMode === "command") { try { window.scrollTo({ top: 0, behavior: "smooth" }); } catch (e) { /* ignore */ } } });
  el.optsBtn.addEventListener("click", () => { const on = !bodyHas("opts"); bodyCls("opts", on); el.optsBtn.classList.toggle("on", on); });
  el.trainSettings.addEventListener("click", () => openSettings());
  el.modbar.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-mod]");
    if (!btn) return;
    if (btn.dataset.mod === "more") { bodyCls("mod-more", !bodyHas("mod-more")); renderModule(); return; }
    // manual practice in this module
    journeyOn = false;
    focus = null;
    setMode("train");
    applySectionUI();
    if (!(view.kind === "intro" || (view.kind === "quiz" && view.picked === undefined)) && !test) nextItem(); else render();
    scrollToCard();
  });
  // the hero scrolls away → the HUD takes over at once
  if (typeof IntersectionObserver === "function") {
    new IntersectionObserver(entries => {
      const e = entries[entries.length - 1];
      heroInView = e.isIntersecting || e.boundingClientRect.top > 0;
      syncHud();
    }, { threshold: 0 }).observe(el.hudSentinel);
  }

  // =====================================================
  // OPENING SEQUENCE – plays once per document load, reads the real Agent state, can be skipped at once.
  // Data is fully initialised and the app rendered BEFORE it starts; a CSS fallback dissolves the layer
  // even if anything here failed, so the System can never trap the user on a black screen.
  // =====================================================
  const INTRO_LINES_BACK = [
    "Welcome back. Your ascent continues.", "Future mastery is built one answer at a time.", "Most agents know the area. Specialists command it.",
    "Your next level is waiting.", "The System remembers your progress.", "Knowledge compounds. Continue.", "Creek Harbour rewards specialists.",
    "Another session. Another layer of certainty.", "Your preparation is becoming an advantage.", "Mastery is not given. It is accumulated.",
    "Welcome back, future Creek Harbour Master.", "Your edge is being built.", "Certainty is the rarest thing a broker can offer."
  ];
  const INTRO_LINES_NEW = ["A new agent has been registered.", "Every specialist begins at Level 1.", "Your training begins now."];
  let introActive = false, introTimer = null;
  function playIntro() {
    const info = agentInfo(), back = meta().xp > 0 || info.j.seen > 0;
    const quick = motionMode() === "reduced";
    el.introStage.innerHTML = '<div class="in-energy"></div>' + el.introStage.innerHTML.replace(/^[\s\S]*?(<svg class="in-lines)/, "$1") +
      '<div class="in-pulse"></div><div class="in-core">' + coreSVG(info.band, "in") + "</div>" +
      '<div class="in-brand">CREEK ACADEMY</div><div class="in-sys">Agent System initializing</div>' +
      '<div class="in-line">' + esc(pick(back ? INTRO_LINES_BACK : INTRO_LINES_NEW)) + "</div>" +
      '<div class="in-status"><span>' + (back ? "Welcome back" : "Agent registered") + "</span><b>Level " + info.level + "</b><i>" + esc(info.title) + "</i>" +
      "<em>Journey " + fmtPct(info.j.pct) + " %" + (info.bossAvail ? " · boss gate open" : "") + "</em></div>" +
      '<div class="in-confirm">' + (info.level >= 100 ? "Identity confirmed · final form" : "Identity confirmed · ascension in progress") + "</div>";
    el.intro.className = "intro " + (quick ? "quick" : "play");
    introActive = true;
    introTimer = setTimeout(endIntro, quick ? 650 : 3350);
  }
  function endIntro() {
    if (!introActive) return;
    introActive = false;
    if (introTimer) { clearTimeout(introTimer); introTimer = null; }
    el.intro.className = "intro gone";
    restartAnim(el.app, "reveal");
  }
  el.introSkip.addEventListener("click", () => endIntro());
  // once dissolved, the layer leaves the page entirely (also after the CSS-only fallback)
  el.intro.addEventListener("animationend", (e) => { if (e.target === el.intro && !introActive) el.intro.hidden = true; });

  // =====================================================
  // INIT – older saves: derive open chapters from passed tests / manual unlocks / the chapter that was open,
  // carry the old best run over as best combo, then drop the old fields. No learning state is touched.
  // =====================================================
  function prepareProgress() {
    let best = meta().bestCombo || 0;
    MODULE_ORDER.forEach(sec => {
      const p = lvlProg(sec), defs = lvlDefs(sec), last = chapterCount(sec) - 1;
      if (typeof p.bestStreak === "number") best = Math.max(best, p.bestStreak);
      let r = Math.max(0, p.reached);
      Object.keys(p.passed).forEach(k => { const li = Number(k); if (p.passed[k] && defs[li] && !defs[li].final) r = Math.max(r, li + 1); });
      Object.keys(p.manualUnlock || {}).forEach(k => { if (p.manualUnlock[k]) r = Math.max(r, Number(k)); });
      if (defs[p.currentLevel] && !defs[p.currentLevel].final) r = Math.max(r, p.currentLevel);
      p.reached = Math.min(r, last);
      refreshUnlocks(sec);
      if (!defs[p.currentLevel] || defs[p.currentLevel].final || p.currentLevel > p.reached) p.currentLevel = p.reached;
      delete p.manualUnlock; delete p.testOffered; delete p.celebrated; delete p.bestStreak;
    });
    delete areaProgress.bestStreak;
    meta().bestCombo = best;
  }

  const mergedAtStart = mergeAreaIntoCommunity();
  prepareProgress();
  advanceCurriculum();
  levelSync(false);           // existing players start at their earned level – no fake level-up on first load
  applyFxClasses();
  applySectionUI();
  saveProgress();
  nextItem();
  booting = false;
  playIntro();
  if (mergedAtStart) showToast("Area Knowledge is now part of Community Expert – " + mergedAtStart + " learned facts carried over");
</script>
</body>
</html>
