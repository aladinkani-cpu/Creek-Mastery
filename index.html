  .set-row > div { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
  .seg { font-size: 12px; font-weight: 700; color: var(--muted); background: transparent; border: 1px solid var(--line-2); border-radius: 999px; padding: 7px 12px; min-height: 36px; cursor: pointer; }
  .seg.on { color: #140E04; background: var(--champagne); border-color: transparent; }
  .set-note { margin-top: 14px; font-size: 11.5px; color: var(--muted); line-height: 1.45; }
  .set-box .btn-primary { display: block; margin: 16px auto 0; }
  .set-box { margin: auto; }


  /* =====================================================
     COMMAND CENTER ↔ TRAINING MODE · the persistent Agent HUD
     ===================================================== */
  .hud { position: fixed; z-index: 25; left: 0; right: 0; top: 0; padding: env(safe-area-inset-top) 10px 0; pointer-events: none;
    transform: translateY(-115%); transition: transform 0.35s var(--ease); }
  .hud.on { transform: none; }
  .hud-in { pointer-events: auto; max-width: 560px; margin: 6px auto 0; display: flex; align-items: stretch; gap: 8px; padding: 8px 12px 8px 8px; border-radius: 16px;
    background: rgba(8, 8, 15, 0.94); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border: 1px solid rgba(150, 130, 255, 0.3); box-shadow: 0 12px 30px -14px rgba(0, 0, 0, 1), inset 0 1px 0 rgba(255, 255, 255, 0.04); }
  .hud-back { flex: 0 0 auto; width: 34px; border: 1px solid var(--line-2); border-radius: 11px; background: rgba(255, 255, 255, 0.03); color: var(--muted); font-size: 20px; line-height: 1; cursor: pointer; }
  .hud-back:hover { color: var(--pearl); }
  body:not(.train) .hud-back { display: none; }
  .hud-main { flex: 1; min-width: 0; cursor: pointer; }
  .hud-r1, .hud-r3 { display: flex; align-items: baseline; gap: 8px; min-width: 0; white-space: nowrap; }
  .hud-lv { font-size: 10px; font-weight: 800; letter-spacing: 0.16em; color: var(--muted); }
  .hud-lv b { font-family: var(--serif); font-weight: 400; font-size: 22px; letter-spacing: 0; color: var(--pearl); text-shadow: 0 0 14px rgba(124, 92, 255, 0.7); }
  .hud-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; font-size: 10px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold-bright); }
  .hud-pct { font-family: var(--mono); font-size: 11.5px; color: #CFE3FF; font-variant-numeric: tabular-nums; }
  .hud-bar { position: relative; margin: 5px 0 5px; height: 7px; border-radius: 999px; background: rgba(255, 255, 255, 0.07); overflow: hidden; box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.8); }
  .hud-bar i { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 999px; background: linear-gradient(90deg, #4B36C9, #5EA8FF 70%, #DDEBFF);

  // ---------- helpers: read amounts from the dataset strings (the strings stay exactly as given) ----------
  function parseAmount(text) {
    if (!text) return null;
    const nums = [];
    String(text).replace(/(\d+(?:\.\d+)?)\s*([MK])/g, (m, n, u) => { nums.push(Number(n) * (u === "M" ? 1e6 : 1e3)); return m; });
    if (!nums.length) return null;
    const lo = Math.min(...nums), hi = Math.max(...nums);
    return { lo, hi, mid: (lo + hi) / 2, approx: /approx/i.test(text) || nums.length === 1 };
  }
  function fmtAED(v) {
    if (v >= 1e6) return "AED " + String(Math.round(v / 1e4) / 100).replace(/\.0+$/, "").replace(/(\.\d)0$/, "$1") + "M";
    return "AED " + Math.round(v / 1e3) + "K";
  }
  function slug(t) { return String(t).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""); }
  function testableConf(b, u, kind) {
    const unit = b.units[u];
    const own = kind === "sale" ? unit.saleConfidence : unit.rentConfidence;
    if (own === "LOW") return false;
    return !/LOW/.test(b.confidence || "");
  }
  function marketFreshness() {
    const start = new Date(MARKET_UPDATED.start[0], MARKET_UPDATED.start[1], MARKET_UPDATED.start[2]).getTime();
    const days = (Date.now() - start) / (24 * 60 * 60 * 1000);
    return days < 30 ? "FRESH" : days <= 90 ? "RECENT" : "OLD";
  }

      // easy distractors: far away, spread out; always three distinct
      const n = sortedFar.length;
      const idx = [n - 1, Math.floor(n * 0.66), Math.floor(n * 0.4)];
      const out = [];
      idx.forEach(i => { const v = sortedFar[Math.max(0, Math.min(n - 1, i))]; if (v && !out.includes(v)) out.push(v); });
      for (let i = n - 1; out.length < 3 && i >= 0; i--) if (!out.includes(sortedFar[i])) out.push(sortedFar[i]);
      return out.slice(0, 3);
    }
    function rangeDistractors(answerText, pool) {
      const me = parseAmount(answerText);
      const others = [...new Set(pool.filter(t => t && t !== answerText))]
        .map(t => ({ t, d: Math.abs(parseAmount(t).mid - me.mid) }))
        .sort((a, b) => a.d - b.d);
      const close = others.slice(0, 3).map(x => x.t);
      const easy = pickSpread(others.map(x => x.t));

  // ---------- generator: builds every quiz item from the data above ----------
  function buildLingo() {
    const out = [];
    const termsAll = LINGO_TERMS.map(t => ({ id: t[0], english: t[1], meaning: t[2], example: t[3], group: t[4] }));
    termsAll.forEach((t, i) => {
      // confusers: same group first, then neighbours
      const pool = termsAll.filter(x => x !== t && x.group === t.group)
        .concat(termsAll.filter(x => x !== t && x.group !== t.group).sort((a, b) => Math.abs(termsAll.indexOf(a) - i) - Math.abs(termsAll.indexOf(b) - i)));
      const other = pool.slice(0, 3);
      out.push({
        id: "bl-" + t.id, level: 1, category: LINGO_CATEGORY[0], type: "term", difficulty: t.meaning.length > 70 ? 2 : 1,
        english: t.english, meaning: t.meaning, example: t.example,
        question: t.english, answer: t.english,
        v1: { qtype: "Term → meaning", question: "What does “" + t.english + "” mean?", answer: t.meaning, distractors: other.map(x => x.meaning) },
        v2: { qtype: "Meaning → term", question: "Which term means: “" + t.meaning + "”", answer: t.english, distractors: other.map(x => x.english) }
      });
    });
    Object.keys(LINGO_PHRASES).forEach(lv => {
      LINGO_PHRASES[lv].forEach(p => {
        const [id, english, situation, wrong, gap, gapWrong, extra] = p;
        const weak = (extra && extra.weak) || LINGO_WEAK[id];
        const client = (extra && extra.client) || LINGO_CLIENT[id];
        const blank = english.replace(new RegExp("\\b" + gap.replace(/[-]/g, "\\-") + "\\b"), "______");
        out.push({
          id: "bl-" + id, level: Number(lv), category: LINGO_CATEGORY[Number(lv) - 1], type: "phrase",
          difficulty: english.length > 75 ? 3 : english.length > 50 ? 2 : 1,
          english, meaning: situation.replace(/^[^–]+– /, "").replace(/^./, c => c.toUpperCase()), useCase: situation.split(" – ")[0],
          client, weak, question: english, answer: english,
          v1: weak
            ? { qtype: "Awkward → natural", question: "Make this sound natural and professional: “" + weak + "”", answer: english, distractors: wrong }
            : { qtype: "Best professional phrase", question: situation, answer: english, distractors: wrong },
          v2: { qtype: "Fill the gap", question: "“" + blank + "”", answer: gap, distractors: gapWrong, gapFor: english }
        });
      });
    });
    LINGO_EXTRA.forEach(x => {
      out.push({
        id: "bl-" + x.id, level: x.level, category: LINGO_CATEGORY[x.level - 1], type: "client", difficulty: 2,
        english: x.english, meaning: x.situation.replace(/ – choose the best response\.$/, "."), useCase: "Client question", client: x.client,
        question: x.english, answer: x.english,
        v1: { qtype: "Best professional phrase", question: x.situation, answer: x.english, distractors: x.wrong },
        v2: { qtype: "Best professional phrase", question: x.situation, answer: x.english, distractors: x.wrong }
      });
    });
    out.forEach(f => { f.section = "lingo"; f.levelTitle = LINGO_LEVELS[f.level - 1].title; });
    return out;
  }
  const brokerLingo = buildLingo();

    return { type: "l", id: item.id, base, fact: Object.assign({}, base, v, { variant: variant === 2 ? 2 : 1 }) };
  }

  // ---------- generator: every quiz item comes from the data above ----------
  function buildViewFacts() {
    const strict = VIEW_BUILDINGS.filter(b => b.status === "STRICT");
    const cats = b => b.views.map(v => v.cat);
    const has = (b, c) => cats(b).includes(c);
    const blocked = c => [c].concat(VIEW_NEAR[c] || []);
    const byId = id => VIEW_BUILDINGS.find(b => b.id === id);
    const out = [];
    const rot = (list, k) => list.slice(k % Math.max(1, list.length)).concat(list.slice(0, k % Math.max(1, list.length)));

    // 1) view → building (one correct project; the wrong ones are strict projects WITHOUT that or a near category)
    let k = 0;
    strict.forEach(b => b.views.forEach(v => {
      const others = rot(strict.filter(o => o !== b && !blocked(v.cat).some(c => has(o, c))), k++).slice(0, 3);
      if (others.length < 3) return;
      out.push({
        id: "v-has-" + b.id + "-" + v.cat, level: VIEW_CAT_LEVEL[v.cat], kind: "view-building", cats: [v.cat], buildings: [b.id], focus: v.label,
        question: "Which project has an officially documented “" + v.label + "” view association?",
        answer: b.building, distractors: others.map(o => o.building),
        explanation: v.label + " is officially documented for " + b.building + "." + (v.note ? " " + v.note : "")
      });
    }));

    // 2) building → which of these is documented (two-view projects; the wrong ones are clearly different categories)
    strict.filter(b => b.views.length === 2).forEach((b, i) => b.views.forEach((v, j) => {
      const pool = [];
      strict.forEach(o => o.views.forEach(w => {
        if (!cats(b).some(c => blocked(c).includes(w.cat)) && !pool.some(p => p.cat === w.cat)) pool.push(w);
      }));
      if (j !== 0) return; // one per project is enough – the other view is covered by item 1)
      const wrong = rot(pool, i).slice(0, 3);
      if (wrong.length < 3) return;
      out.push({
        id: "v-pick-" + b.id, level: VIEW_CAT_LEVEL[v.cat], kind: "building-view", cats: [v.cat], buildings: [b.id], focus: v.label,
        question: "Which of these views is officially documented for " + b.building + "?",
        answer: v.label, distractors: wrong.map(w => w.label),
        explanation: b.building + ": " + b.views.map(x => x.label).join(" + ") + "."
      });
    }));

    // 3) multi-view recall – the complete documented set (Level 4)
    strict.forEach((b, i) => {
      const own = b.views.map(v => v.label);
      const pool = [];
      strict.forEach(o => o.views.forEach(w => {
        if (!cats(b).some(c => blocked(c).includes(w.cat)) && !pool.some(p => p.cat === w.cat)) pool.push(w);
      }));
      const p = rot(pool, i);
      const sets = [];
      const add = list => { const key = list.slice().sort().join("|"); if (key !== own.slice().sort().join("|") && !sets.some(s => s.slice().sort().join("|") === key)) sets.push(list); };
      if (own.length > 1) add(own.slice(0, -1));                         // incomplete
      add(own.slice(0, -1).concat(p[0].label));                          // one swapped
      add(own.concat(p[1].label));                                       // one too many
      add(own.length > 1 ? own.slice(1).concat(p[2].label) : [p[2].label]);
      add([p[3 % p.length].label]);
      if (sets.length < 3) return;
      out.push({
        id: "v-set-" + b.id, level: 4, kind: "set", cats: cats(b), buildings: [b.id],
        question: "Which list shows exactly the views officially documented for " + b.building + "?",

        explanation: b.building + ": " + own.join(" · ") + (b.simplified ? " (simplified: " + b.simplified.join(" and ") + ")" : "") + "."
      });
    });

    // 4) which is NOT documented (projects with 3+ documented views)
    strict.filter(b => b.views.length >= 3).forEach((b, i) => {
      const pool = [];
      strict.forEach(o => o.views.forEach(w => {
        if (!cats(b).some(c => blocked(c).includes(w.cat)) && !pool.some(p => p.cat === w.cat)) pool.push(w);
      }));
      const outsider = rot(pool, i + 2)[0];
      out.push({
        id: "v-not-" + b.id, level: 4, kind: "not", cats: cats(b), buildings: [b.id],
        question: "Which of these is NOT officially documented for " + b.building + "?",

    // 5) building comparison – exactly one of the two has it
    VIEW_COMPARE.forEach(([a, bb, c]) => {
      const A = byId(a), B = byId(bb);

  }

    { id: "obj-011", level: 1, objection: "I’m waiting until the area is finished.", response: "That can be a valid strategy. I’d compare the potential upside of waiting with today’s achievable price rather than assume one is automatically better.", why: "Acknowledges the strategy without forecasting the future.", avoid: "Prices will definitely be much higher once everything is finished.", followup: "What price difference would make waiting worthwhile for you?", side: "owner", principle: 5, tags: ["owner", "timing"] },
    { id: "obj-012", level: 1, objection: "I have no reason to sell.", response: "Then you probably shouldn’t unless the market gives you a reason. My job would simply be to tell you if an unusually strong opportunity appears.", why: "Reduces resistance and builds credibility.", avoid: "Everyone has a reason to sell.", followup: "Would you be open to hearing about a serious offer if one came?", side: "owner", principle: 11, tags: ["owner"] },
    { id: "obj-013", level: 2, objection: "Your valuation is too low.", response: "Let’s separate my opinion from the evidence. I’ll show you the comparable transactions and then we can decide where your unit deserves to sit within that range.", why: "Moves the discussion from emotion to evidence.", avoid: "No, this is what your property is worth.", followup: "Which units are you comparing yours against?", side: "owner", principle: 2, tags: ["owner", "pricing"] },
    { id: "obj-014", level: 2, objection: "Another agent told me a higher price.", response: "That may be possible. The important question is whether that is a marketing price or a price they can support with comparable evidence.", why: "Challenges the number without attacking the other agent.", avoid: "They’re lying to get the listing.", followup: "Did they show you the transactions supporting that number?", side: "owner", principle: 4, tags: ["owner", "pricing"] },
    { id: "obj-015", level: 2, objection: "I want AED 3 million.", response: "We can discuss any asking price. I just want us to distinguish between the number you want and the level buyers are currently supporting.", why: "Separates aspiration from market evidence.", avoid: "That price is impossible.", followup: "What is the reasoning behind AED 3 million?", side: "owner", principle: 3, tags: ["owner", "pricing"] },
    { id: "obj-016", level: 2, objection: "I’m not negotiating.", response: "That’s completely your decision. I just need to know whether that means the asking price is genuinely your minimum or whether you simply don’t want low-quality offers.", why: "Clarifies what “not negotiating” actually means.", avoid: "Every seller negotiates.", followup: "If a qualified buyer came very close, would you still want me to bring the offer to you?", side: "owner", principle: 1, tags: ["owner", "pricing", "negotiation"] },
    { id: "obj-017", level: 2, objection: "My unit is better than the comparables.", response: "It may be. Then we should identify exactly where the premium comes from: view, floor, layout, condition, size or something else.", why: "Converts a subjective claim into measurable differentiators.", avoid: "All units in the building are basically the same.", followup: "What do you see as the strongest premium feature of your unit?", side: "owner", principle: 7, tags: ["owner", "pricing"] },
    { id: "obj-018", level: 2, objection: "I paid more than that.", response: "I understand. Your purchase price matters to your personal decision, but today’s buyer will mainly compare the property with today’s market.", why: "Separates cost basis from current value.", avoid: "What you paid is irrelevant.", followup: "Is there a minimum net figure you need in order for selling to make sense?", side: "owner", principle: 2, tags: ["owner", "pricing"] },
    { id: "obj-019", level: 2, objection: "I need to recover all my costs.", response: "Then we should calculate your required net figure first and compare it with what the market can realistically support.", why: "Makes the owner’s objective explicit.", avoid: "The buyer doesn’t care about your costs.", followup: "What net amount would you need after the transaction?", side: "owner", principle: 7, tags: ["owner", "pricing"] },
    { id: "obj-020", level: 2, objection: "I’ll wait until prices go higher.", response: "That may work, but future prices are uncertain. We can compare today’s realistic exit with the return you expect from continuing to hold.", why: "Avoids forecasting while supporting rational decision-making.", avoid: "Prices are definitely going up.", followup: "What level are you waiting for?", side: "owner", principle: 5, tags: ["owner", "pricing", "timing"] },
    { id: "obj-021", level: 2, objection: "There are listings online at my price.", response: "Yes, but asking prices tell us what owners want. For valuation I place more weight on what comparable units actually transact at.", why: "Explains asking versus closing price.", avoid: "Online listings mean nothing.", followup: "Shall we compare those listings with recent transactions?", side: "owner", principle: 3, tags: ["owner", "pricing"] },
    { id: "obj-022", level: 2, objection: "My neighbour sold for more.", response: "That’s useful information. Let’s compare the exact size, floor, view, condition and transaction date before treating it as a direct comp.", why: "Tests comparability rather than dismissing anecdotal evidence.", avoid: "Your neighbour is exaggerating.", followup: "Do you know which unit and when it transferred?", side: "owner", principle: 2, tags: ["owner", "pricing"] },
    { id: "obj-023", level: 2, objection: "I’ll list high and reduce later.", response: "We can do that, but the trade-off is that an overpriced listing can lose its strongest launch period. I’d rather agree in advance on how we’ll judge the market response.", why: "Explains consequences without forcing a lower price.", avoid: "That strategy never works.", followup: "If we get no serious activity, when should we review the price?", side: "owner", principle: 10, tags: ["owner", "pricing", "timing"] },
    { id: "obj-024", level: 2, objection: "I’m not in a rush.", response: "That gives us flexibility, but it doesn’t change what buyers compare your property with. We can price for patience without ignoring the market.", why: "Separates timeline from value.", avoid: "If you’re not in a rush, just list as high as possible.", followup: "Is your priority maximum price or a reasonable timeframe?", side: "owner", principle: 6, tags: ["owner", "pricing", "timing"] },
    { id: "obj-025", level: 3, objection: "I don’t pay commission.", response: "Understood. Before we discuss the fee, the question is whether I can create enough value in the transaction to justify it.", why: "Moves the discussion from cost to value.", avoid: "Everyone pays commission.", followup: "What would you expect an agent to deliver for you?", side: "owner", principle: 6, tags: ["owner", "commission"] },
    { id: "obj-026", level: 3, objection: "Another agent will do it cheaper.", response: "That may be true. I’d compare the overall service and outcome rather than choose purely on the lowest fee.", why: "Competes on value rather than attacking price.", avoid: "Cheap agents are bad agents.", followup: "What are they including in their service?", side: "owner", principle: 4, tags: ["owner", "commission"] },
    { id: "obj-027", level: 3, objection: "Why should I give you exclusivity?", response: "You should only do that if you believe one accountable agent with a clear strategy will represent you better than several agents competing for the same property.", why: "Explains the logic rather than demanding exclusivity.", avoid: "Exclusive listings always sell faster.", followup: "What concern do you have about working exclusively?", side: "owner", principle: 6, tags: ["owner", "commission"] },
    { id: "obj-028", level: 3, objection: "I want five agents marketing it.", response: "That gives you more agents, but not necessarily more unique buyers. The question is whether the property will be represented consistently and professionally.", why: "Addresses fragmentation without false claims.", avoid: "Multiple agents will destroy your listing.", followup: "How do you want the property positioned across the market?", side: "owner", principle: 2, tags: ["owner", "commission"] },
    { id: "obj-029", level: 3, objection: "Why should I trust you?", response: "You shouldn’t trust me because I ask you to. Judge me on the quality of my market evidence, communication and how transparent I am about what I can and cannot promise.", why: "Trust is earned through evidence.", avoid: "You can trust me, I’ve been doing this for years.", followup: "What would you need to see from me to feel comfortable?", side: "owner", principle: 2, tags: ["owner", "commission"] },
    { id: "obj-030", level: 3, objection: "What do you do differently?", response: "My value should be measurable: accurate positioning, qualified buyers, clear feedback, strong follow-up and disciplined deal management.", why: "Uses concrete deliverables instead of generic claims.", avoid: "I work harder than every other agent.", followup: "Which part of your previous agent experience disappointed you most?", side: "owner", principle: 7, tags: ["owner", "commission"] },
    { id: "obj-031", level: 3, objection: "I can put the listing online myself.", response: "You can. The value of representation has to come from what happens beyond simply publishing an advertisement.", why: "Acknowledges the owner’s capability.", avoid: "Property portals won’t work for owners.", followup: "What do you expect to happen after the enquiries arrive?", side: "owner", principle: 9, tags: ["owner", "commission"] },
    { id: "obj-032", level: 3, objection: "Why do you need an exclusive listing?", response: "I don’t need one in every situation. It only makes sense when both sides want accountability, consistent pricing and a clear strategy.", why: "Avoids making exclusivity sound self-serving.", avoid: "My company requires it.", followup: "What would make an exclusive arrangement worthwhile to you?", side: "owner", principle: 6, tags: ["owner", "commission"] },
    { id: "obj-033", level: 3, objection: "I don’t want to sign anything.", response: "I understand. Before signing anything, you should know exactly what you are authorising, for how long and under what terms.", why: "Reduces fear through transparency.", avoid: "It’s just standard paperwork.", followup: "Which part of the agreement concerns you?", side: "owner", principle: 1, tags: ["owner", "commission"] },
    { id: "obj-034", level: 3, objection: "I’ll only pay you if you get my full asking price.", response: "We can discuss your target, but my fee and the market value are separate issues. I don’t want to promise a price simply to win the instruction.", why: "Avoids incentive to overvalue.", avoid: "Fine, I guarantee your asking price.", followup: "Would you rather optimise for the highest credible offer or hold firm regardless of market response?", side: "owner", principle: 5, tags: ["owner", "commission"] },
    { id: "obj-035", level: 3, objection: "The buyer should pay all the commission.", response: "That depends on the agreed transaction structure. Let’s make the fee arrangement clear before we proceed so nobody gets surprised later.", why: "Avoids making unsupported assumptions about fee allocation.", avoid: "Yes, buyers always pay it.", followup: "What fee structure are you expecting?", side: "owner", principle: 1, tags: ["owner", "commission"] },
    { id: "obj-036", level: 3, objection: "Another broker said they already have a buyer.", response: "Great. If they have a genuinely qualified buyer, you should absolutely consider them. I’d just separate a real buyer mandate from a marketing claim.", why: "Does not undermine legitimate competition.", avoid: "They definitely don’t have a buyer.", followup: "Have they given you any details on the buyer’s budget and requirements?", side: "owner", principle: 4, tags: ["owner", "commission"] },
    { id: "obj-037", level: 4, objection: "It’s too expensive.", response: "Compared with which alternative?", why: "Turns a vague objection into a measurable comparison.", avoid: "No, it’s actually cheap.", followup: "Is the issue the total price or the value you feel you’re getting?", side: "buyer", principle: 7, tags: ["buyer", "pricing"] },
    { id: "obj-038", level: 4, objection: "I saw something cheaper.", response: "Let’s compare them properly: building, size, floor, view, condition, occupancy and price per square foot.", why: "Makes comparison like-for-like.", avoid: "The cheaper one is probably bad.", followup: "What was the other unit?", side: "buyer", principle: 7, tags: ["buyer", "pricing"] },
    { id: "obj-039", level: 4, objection: "The seller is unrealistic.", response: "They may be above the level you want to pay. The useful question is whether there is enough evidence and motivation to justify making an offer.", why: "Keeps the buyer focused on negotiation rather than frustration.", avoid: "Yes, the seller is crazy.", followup: "What number would you be prepared to stand behind?", side: "buyer", principle: 6, tags: ["buyer", "pricing", "negotiation"] },
    { id: "obj-040", level: 4, objection: "I want a bigger discount.", response: "I can ask, but we need to give the seller a reason to move. Price is only one part of the strength of an offer.", why: "Frames negotiation around deal quality.", avoid: "I’ll force the seller lower.", followup: "If we improve the terms, what price are you ready to commit to?", side: "buyer", principle: 7, tags: ["buyer", "pricing", "negotiation"] },
    { id: "obj-041", level: 4, objection: "I’ll wait for prices to drop.", response: "That’s a valid choice, but we don’t know where prices will be later. The decision should be whether this property makes sense for you at today’s terms.", why: "Avoids market prediction.", avoid: "Prices won’t drop.", followup: "What price movement are you waiting for?", side: "buyer", principle: 5, tags: ["buyer", "pricing", "timing"] },
    { id: "obj-042", level: 4, objection: "I don’t want to overpay.", response: "Neither do I want you to. That’s why we should compare the unit with relevant transactions rather than judge it only from the asking price.", why: "Aligns broker and buyer interests.", avoid: "Trust me, it’s a good deal.", followup: "Would you like to go through the comparable evidence?", side: "buyer", principle: 2, tags: ["buyer", "pricing"] },
    { id: "obj-043", level: 4, objection: "The price per square foot is too high.", response: "That can be important, but price per square foot doesn’t capture every difference in layout, floor, view or condition.", why: "Uses PSF correctly without treating it as the only metric.", avoid: "Price per square foot doesn’t matter.", followup: "Which comparable PSF are you using?", side: "buyer", principle: 2, tags: ["buyer", "pricing"] },
    { id: "obj-044", level: 4, objection: "I only buy below market.", response: "Then we need to define what ‘below market’ means using comparable transactions, not simply a discount from the asking price.", why: "Defines the claim objectively.", avoid: "I can always find distressed sellers.", followup: "What discount to comparable value are you targeting?", side: "buyer", principle: 7, tags: ["buyer", "pricing"] },
    { id: "obj-045", level: 4, objection: "I want to make a very low offer.", response: "You can, but before we do, I’d like to know whether you would actually buy if the seller came back somewhere between your offer and the asking price.", why: "Tests whether the offer is serious.", avoid: "Let’s lowball them and see what happens.", followup: "What is your genuine maximum for this unit?", side: "buyer", principle: 8, tags: ["buyer", "pricing", "negotiation"] },
    { id: "obj-046", level: 4, objection: "Why is this one more expensive than the other unit?", response: "Let’s isolate the difference: size, layout, floor, orientation, view, condition, occupancy and seller positioning.", why: "Explains premiums systematically.", avoid: "Because it’s a better unit.", followup: "Which difference matters most to you?", side: "buyer", principle: 7, tags: ["buyer", "pricing"] },
    { id: "obj-047", level: 4, objection: "I can get an off-plan unit for less.", response: "That may be true, but they are different propositions. We should compare payment timing, handover risk, immediate usability or income and the specific product.", why: "Avoids false equivalence between ready and off-plan.", avoid: "Ready property is always better.", followup: "Is your priority immediate use, income or future entry price?", side: "buyer", principle: 2, tags: ["buyer", "pricing"] },
    { id: "obj-048", level: 4, objection: "I’ll only buy if I get an amazing deal.", response: "Then let’s define ‘amazing’ before we search. Otherwise every property will feel expensive.", why: "Creates an objective acquisition criterion.", avoid: "I’ll find you the cheapest unit in Creek Harbour.", followup: "What would make a deal compelling to you?", side: "buyer", principle: 7, tags: ["buyer", "pricing"] },
    { id: "obj-049", level: 5, objection: "I don’t like the view.", response: "Then we shouldn’t try to talk you into it. The question is whether the price compensates for the weaker view or whether we should move to another unit.", why: "Does not fight a genuine preference.", avoid: "The view isn’t that important.", followup: "How important is the view relative to size and price?", side: "buyer", principle: 9, tags: ["buyer"] },
    { id: "obj-050", level: 5, objection: "The unit is too small.", response: "Then let’s see whether the layout uses the space efficiently or whether you genuinely need a larger unit.", why: "Separates nominal size from usable space.", avoid: "It feels bigger in person.", followup: "What minimum usable space do you need?", side: "buyer", principle: 6, tags: ["buyer"] },
    { id: "obj-051", level: 5, objection: "I don’t like the layout.", response: "That’s difficult to fix, so I’d take that seriously. Let’s identify exactly what doesn’t work for you.", why: "Layout is a structural objection.", avoid: "You’ll get used to it.", followup: "Is it the bedroom separation, living area, kitchen or something else?", side: "buyer", principle: 9, tags: ["buyer"] },
    { id: "obj-052", level: 5, objection: "It’s tenanted.", response: "That isn’t automatically good or bad. It depends on your objective and the exact tenancy situation.", why: "Avoids oversimplifying occupancy.", avoid: "The tenant can just leave.", followup: "Are you buying for investment or personal use?", side: "buyer", principle: 1, tags: ["buyer"] },
    { id: "obj-053", level: 5, objection: "The service charge is too high.", response: "Then we should look at the total annual ownership cost and compare it with similar buildings rather than assess the charge in isolation.", why: "Frames service charge within total economics.", avoid: "Service charges don’t matter.", followup: "Are you mainly concerned about net yield or the absolute annual cost?", side: "buyer", principle: 7, tags: ["buyer"] },
    { id: "obj-054", level: 5, objection: "The building is too old.", response: "Age matters, but condition, maintenance, management and pricing matter as well. Let’s compare those rather than use age alone.", why: "Adds context without dismissing the objection.", avoid: "It isn’t old.", followup: "What concerns you most about the building’s age?", side: "buyer", principle: 2, tags: ["buyer"] },
    { id: "obj-055", level: 5, objection: "I want a higher floor.", response: "That’s fine. Let’s decide how much premium you’re willing to pay for the higher floor.", why: "Turns preference into an economic trade-off.", avoid: "Higher floors are always better.", followup: "Is your priority the view, privacy or simply being higher?", side: "buyer", principle: 7, tags: ["buyer"] },
    { id: "obj-056", level: 5, objection: "I need a better view.", response: "Then view should become one of our primary filters, even if that means compromising somewhere else.", why: "Prioritises the buyer’s actual criteria.", avoid: "This is already one of the best views.", followup: "What exact view are you trying to achieve?", side: "buyer", principle: 9, tags: ["buyer"] },
    { id: "obj-057", level: 5, objection: "I don’t like the finishes.", response: "Then we need to decide whether the pricing leaves enough room for you to accept or upgrade them.", why: "Converts cosmetic objection into cost/value decision.", avoid: "The finishes are fine.", followup: "Is this a deal-breaker or mainly a pricing issue?", side: "buyer", principle: 7, tags: ["buyer"] },
    { id: "obj-058", level: 5, objection: "There’s not enough natural light.", response: "That is very unit-specific. If it matters to you, we should prioritise orientation and visit alternatives at a relevant time of day.", why: "Treats light as unit-specific rather than generic.", avoid: "It looks brighter in the photos.", followup: "How important is natural light in your shortlist?", side: "buyer", principle: 2, tags: ["buyer"] },
    { id: "obj-059", level: 5, objection: "The balcony is too small.", response: "If outdoor space is important to you, we should not ignore that. Let’s compare units where the balcony is a meaningful part of the layout.", why: "Accepts lifestyle criteria.", avoid: "You won’t use the balcony much anyway.", followup: "How do you expect to use the balcony?", side: "buyer", principle: 9, tags: ["buyer"] },
    { id: "obj-060", level: 5, objection: "I want vacant possession.", response: "Then we should make occupancy status a hard filter and verify the specific unit’s position before you commit.", why: "Avoids assuming vacancy.", avoid: "We can get the tenant out.", followup: "Do you need the property vacant immediately or by a specific date?", side: "buyer", principle: 2, tags: ["buyer"] },
    { id: "obj-061", level: 6, objection: "Creek Harbour is too far.", response: "Too far from where you spend most of your time?", why: "Turns a general location objection into the buyer’s actual travel pattern.", avoid: "It’s only 15 minutes from Downtown.", followup: "Which locations do you need to reach regularly?", side: "buyer", principle: 1, tags: ["buyer", "creek"] },
    { id: "obj-062", level: 6, objection: "The area is still developing.", response: "That’s true. The question is whether you see the remaining development as a disadvantage or part of why you’re considering entering now.", why: "Acknowledges reality without promising upside.", avoid: "It’ll all be finished soon.", followup: "Do you prefer a fully mature community or are you comfortable with continued development?", side: "buyer", principle: 5, tags: ["buyer", "creek"] },
    { id: "obj-063", level: 6, objection: "There’s too much future supply.", response: "That is something we should take seriously. Supply matters, but so do the exact building, unit quality, pricing and demand segment.", why: "Avoids denying supply risk.", avoid: "Supply won’t affect prices.", followup: "Are you more concerned about resale competition or rental competition?", side: "buyer", principle: 2, tags: ["buyer", "creek"] },
    { id: "obj-064", level: 6, objection: "Why not Downtown?", response: "Downtown may be the better choice depending on your priorities. The comparison should be lifestyle, entry price, product, maturity and your specific investment objective.", why: "Does not force Creek Harbour to win every comparison.", avoid: "Creek Harbour is the next Downtown.", followup: "What attracts you most about Downtown?", side: "buyer", principle: 9, tags: ["buyer", "creek"] },
    { id: "obj-065", level: 6, objection: "Why not Business Bay?", response: "That depends on whether you prioritise central business access, waterfront community living, investment characteristics or a specific price point.", why: "Frames areas by buyer criteria.", avoid: "Business Bay is overcrowded.", followup: "What is your main reason for considering Business Bay?", side: "buyer", principle: 1, tags: ["buyer", "creek"] },
    { id: "obj-066", level: 6, objection: "The yield is too low.", response: "Then we need to decide whether this is an income investment for you. If yield is the priority, we should compare alternatives objectively.", why: "Does not defend the area when it conflicts with investor goals.", avoid: "Capital appreciation will make up for it.", followup: "What gross or net return are you targeting?", side: "buyer", principle: 9, tags: ["buyer", "creek"] },
    { id: "obj-067", level: 6, objection: "I’m worried about future construction.", response: "That’s a fair concern. For the specific unit we should distinguish what exists today from what is planned around it.", why: "Keeps future surroundings factual.", avoid: "The view will stay open.", followup: "Is your concern noise, view obstruction or resale impact?", side: "buyer", principle: 5, tags: ["buyer", "creek"] },
    { id: "obj-068", level: 6, objection: "The metro isn’t operating yet.", response: "Correct. Any future metro benefit should be treated as future infrastructure, not current connectivity.", why: "Prevents misrepresentation.", avoid: "The metro is basically already here.", followup: "Does the purchase need to work for you based on today’s connectivity?", side: "buyer", principle: 5, tags: ["buyer", "creek"] },
    { id: "obj-069", level: 6, objection: "Dubai Square isn’t open.", response: "Correct. It is future development, so I would not value the property as though it already exists today.", why: "Separates current reality from future plans.", avoid: "Once Dubai Square opens prices will explode.", followup: "Would the property still make sense to you without relying on Dubai Square?", side: "buyer", principle: 5, tags: ["buyer", "creek"] },
    { id: "obj-070", level: 6, objection: "Creek Harbour feels quiet.", response: "That can be either a benefit or a drawback depending on what you want. It isn’t the same lifestyle as Downtown or Marina.", why: "Positions rather than argues.", avoid: "It’ll become much busier soon.", followup: "Do you prefer a quieter residential environment or a busier urban one?", side: "buyer", principle: 9, tags: ["buyer", "creek"] },
    { id: "obj-071", level: 6, objection: "There aren’t enough shops/restaurants.", response: "If immediate retail and dining density is important, we should compare the current offering with the communities you’re considering.", why: "Uses current reality rather than future promises.", avoid: "Loads more are coming.", followup: "How important is walkable retail to your decision?", side: "buyer", principle: 2, tags: ["buyer", "creek"] },
    { id: "obj-072", level: 6, objection: "I’m worried Creek Harbour is overhyped.", response: "Then ignore the marketing and judge it on the unit, transaction evidence, rental economics, community and your own objective.", why: "Moves from narrative to evidence.", avoid: "It’s definitely Dubai’s next big area.", followup: "Which part of the investment case do you want to test first?", side: "buyer", principle: 2, tags: ["buyer", "creek"] },
    { id: "obj-073", level: 7, objection: "I need to think about it.", response: "Of course. What specifically do you still need to think through?", why: "Identifies the unresolved issue.", avoid: "What is there to think about?", followup: "Is it mainly price, the property itself or the timing?", side: "buyer", principle: 6, tags: ["buyer", "timing"] },
    { id: "obj-074", level: 7, objection: "I need to speak to my wife/husband.", response: "Absolutely. Would it help if we summarised the key points so you can discuss the same information together?", why: "Respects joint decision-making.", avoid: "Can you decide without them?", followup: "What questions do you think they will have?", side: "buyer", principle: 10, tags: ["buyer", "timing"] },
    { id: "obj-075", level: 7, objection: "Send me the details.", response: "I will. To avoid sending you another generic listing, what should I focus on in the details?", why: "Turns a passive request into qualification.", avoid: "Sure, I’ll send everything.", followup: "Which two or three points matter most to you?", side: "buyer", principle: 1, tags: ["buyer", "timing"] },
    { id: "obj-076", level: 7, objection: "I’m not ready yet.", response: "No problem. What needs to happen before you would consider yourself ready?", why: "Defines the barrier.", avoid: "Why did you enquire then?", followup: "Is it financing, timing or finding the right property?", side: "buyer", principle: 6, tags: ["buyer", "timing"] },
    { id: "obj-077", level: 7, objection: "I’ll come back next month.", response: "Sure. What do you expect to be different next month?", why: "Clarifies whether delay has a real reason.", avoid: "Prices may be higher by then.", followup: "Would it help if I only contact you if something relevant changes?", side: "buyer", principle: 6, tags: ["buyer", "timing"] },
    { id: "obj-078", level: 7, objection: "I’m just browsing.", response: "That’s completely fine. Browsing becomes much more useful once we know what you’re actually comparing.", why: "Makes early-stage buyers easier to qualify.", avoid: "Call me when you’re serious.", followup: "What have you liked most so far?", side: "buyer", principle: 1, tags: ["buyer", "timing"] },
    { id: "obj-079", level: 7, objection: "I’m waiting for mortgage approval.", response: "Then we should keep the search aligned with what the bank is likely to support and avoid creating pressure before your financing is clear.", why: "Respects financing dependency.", avoid: "Make an offer now and sort the mortgage later.", followup: "What stage of the approval process are you at?", side: "buyer", principle: 11, tags: ["buyer", "timing"] },
    { id: "obj-080", level: 7, objection: "I want to see more properties first.", response: "That’s sensible. Let’s make sure each additional viewing teaches us something rather than showing you random units.", why: "Keeps the search structured.", avoid: "This is already the best one.", followup: "What do you still need to compare?", side: "buyer", principle: 10, tags: ["buyer", "timing"] },
    { id: "obj-081", level: 7, objection: "I’m not sure about Dubai.", response: "Then the property decision is probably secondary. We should first understand your wider plan.", why: "Does not force property before the underlying decision.", avoid: "Dubai is obviously the best place to invest.", followup: "What uncertainty about Dubai is holding you back?", side: "buyer", principle: 6, tags: ["buyer", "timing"] },
    { id: "obj-082", level: 7, objection: "I might buy next year.", response: "That’s fine. Then today’s conversation is more about understanding the market and your criteria than forcing a transaction.", why: "Matches sales pressure to the buyer timeline.", avoid: "You’ll miss the opportunity.", followup: "What would need to happen for your timeline to move forward?", side: "buyer", principle: 11, tags: ["buyer", "timing"] },
    { id: "obj-083", level: 7, objection: "I’m waiting for a better opportunity.", response: "Then let’s define what ‘better’ means so we recognise it when it appears.", why: "Creates measurable criteria.", avoid: "This is the opportunity.", followup: "What would the ideal opportunity look like?", side: "buyer", principle: 7, tags: ["buyer", "timing"] },
    { id: "obj-084", level: 7, objection: "I don’t want to rush.", response: "You shouldn’t. My job is to help you make the decision efficiently, not artificially quickly.", why: "Reduces pressure while maintaining momentum.", avoid: "This unit might be gone tomorrow.", followup: "What information do you still need before you can decide confidently?", side: "buyer", principle: 11, tags: ["buyer", "timing"] },

      const who = d.side === "owner" ? "An owner" : d.side === "buyer" ? "A buyer" : "Someone in the deal";
      const v = {

  // units as rounded bands: "~550" (option) · "~550 units" (reverse question) · "~300 hotel rooms"
  function unitsAnchorLabel(b, withNoun) {
    const raw = String(b.units), n = unitsValue(raw);
    if (n === null) return raw;
    const a = "~" + numericAnchor(n, "units").toLocaleString("en-US");
    const noun = raw.replace(/^\D*\d[\d,]*\s*/, "").trim();
    return withNoun || noun ? a + " " + (noun || "units") : a;
  }

  // =====================================================
  // STORAGE
  // =====================================================
  // Every module pool keeps: item states, reviewCount (the learning-step clock), currentLevel (open chapter),
  // reached (highest chapter opened), passed (module challenges cleared), answered / correct (accuracy).
  // Fields of older versions (manualUnlock, testOffered, celebrated, bestStreak) are read once in prepareProgress() and dropped.
  function freshProgress() {
    return { version: 2, reviewCount: 0, currentLevel: 0, reached: 0, passed: {}, answered: 0, correct: 0, cards: {} };
  }

  function normalizeFact(f, fallbackSeen) {
    if (typeof f.seen !== "boolean") f.seen = !!fallbackSeen;
    if (typeof f.box !== "number") f.box = 0;
    if (typeof f.due !== "number") f.due = 0;
    if (typeof f.dueAt !== "number") f.dueAt = 0;          // older saves: reviews are due right away
    if (typeof f.wrongCount !== "number") f.wrongCount = 0;
    if (typeof f.lastWrongAt !== "number") f.lastWrongAt = 0;
    return f;
  }

  function normalizeCommon(p, levels) {
    if (typeof p.reviewCount !== "number") p.reviewCount = 0;
    if (typeof p.currentLevel !== "number" || !levels[p.currentLevel]) p.currentLevel = 0;
    if (typeof p.reached !== "number") p.reached = -1;       // -1 = not yet derived (older save) → prepareProgress()
    if (!p.passed || typeof p.passed !== "object") p.passed = {};
    if (typeof p.answered !== "number") p.answered = 0;
    if (typeof p.correct !== "number") p.correct = 0;
    return p;
  }

  function normalize(p) {
    normalizeCommon(p, LEVELS);
    if (!p.cards) p.cards = {};
    Object.values(p.cards).forEach(card => {
      if (!card.facts) card.facts = {};
      Object.values(card.facts).forEach(f => normalizeFact(f, card.seen));
    });
    return p;
  }

  // Area Knowledge is part of Community Expert now – the old pool is only kept so older saves and codes stay complete
  function freshAreaProgress() { return { reviewCount: 0, facts: {} }; }
  function normalizeArea(a) {
    if (!a || typeof a !== "object") return freshAreaProgress();
    if (typeof a.reviewCount !== "number") a.reviewCount = 0;
    if (!a.facts || typeof a.facts !== "object") a.facts = {};
    Object.values(a.facts).forEach(f => normalizeFact(f, false));
    return a;
  }

  function freshPool() { return { reviewCount: 0, currentLevel: 0, reached: 0, passed: {}, answered: 0, correct: 0, facts: {} }; }
  function normalizePool(p, levels) {
    if (!p || typeof p !== "object") return freshPool();
    normalizeCommon(p, levels);
    if (!p.facts || typeof p.facts !== "object") p.facts = {};
    Object.values(p.facts).forEach(f => normalizeFact(f, false));
    return p;
  }
  const freshSecProgress = freshPool, freshMktProgress = freshPool, freshComProgress = freshPool, freshLingProgress = freshPool,
    freshViewProgress = freshPool, freshObjProgress = freshPool, freshScProgress = freshPool;
  function normalizeSec(p) { return normalizePool(p, SECONDARY_LEVELS); }
  function normalizeMkt(p) { return normalizePool(p, MARKET_LEVELS); }
  function normalizeCom(p) { return normalizePool(p, COMMUNITY_LEVELS); }
  function normalizeLing(p) { return normalizePool(p, LINGO_LEVELS); }
  function normalizeView(p) { return normalizePool(p, VIEW_LEVELS); }
  function normalizeObj(p) { return normalizePool(p, OBJ_LEVELS); }
  function normalizeSc(p) { return normalizePool(p, SC_LEVELS); }

  // Older saves also carry a daily plan, an old journey rank and section rank fields – they are ignored and not written again.
  function normalizeSettings(s) {
    return {
      clientMode: !!(s && s.clientMode),
      areaMerged: !!(s && s.areaMerged), // Area Knowledge progress already carried over into Community Expert
      meta: normalizeMeta(s && s.meta)    // Agent System: XP, bosses, curriculum position, effects, focus timer
    };
  }

  function readJSON(key) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }

  function sectionName(x) { return x === "area" ? "community" : x === "secondary" || x === "market" || x === "community" || x === "lingo" || x === "views" || x === "objections" || x === "services" ? x : "buildings"; }

  // Loads the v4 store. Older saves are migrated without touching them:
  // v3 (Buildings + Area) → v4 with Secondary at zero; a copy of the v3 save is kept as a backup.
  // v2 (Buildings only) → v4 as before.
  function loadStore() {
    const v6 = readJSON(STORAGE_KEY);
    if (v6 && v6.version === 6) {
      return {
        buildings: v6.buildings ? normalize(v6.buildings) : freshProgress(),
        areaFacts: normalizeArea(v6.areaFacts),
        secondaryFacts: normalizeSec(v6.secondaryFacts),
        marketFacts: normalizeMkt(v6.marketFacts),
        communityFacts: normalizeCom(v6.communityFacts),
        brokerLingoProgress: normalizeLing(v6.brokerLingoProgress), // missing in older v6 saves → starts at zero
        viewsProgress: normalizeView(v6.viewsProgress),             // missing in older v6 saves → starts at zero
        objectionsProgress: normalizeObj(v6.objectionsProgress),    // missing in older v6 saves → starts at zero
        serviceChargesProgress: normalizeSc(v6.serviceChargesProgress), // missing in older v6 saves → starts at zero
        activeSection: sectionName(v6.activeSection),
        settings: normalizeSettings(v6.settings),
        migrated: false
      };
    }

    // v5 (… + Market) → v6 with Community Expert at zero; the v5 save stays untouched + backup copy
    const v5 = readJSON(V5_KEY);
    if (v5 && v5.version === 5) {
      try {
        if (!localStorage.getItem(MIGRATION_BACKUP_V5_KEY)) localStorage.setItem(MIGRATION_BACKUP_V5_KEY, localStorage.getItem(V5_KEY));
      } catch (e) { /* the v5 save itself stays untouched anyway */ }
      return {
        buildings: v5.buildings ? normalize(v5.buildings) : freshProgress(),
        areaFacts: normalizeArea(v5.areaFacts),
        secondaryFacts: normalizeSec(v5.secondaryFacts),
        marketFacts: normalizeMkt(v5.marketFacts),
        communityFacts: freshComProgress(),
        brokerLingoProgress: freshLingProgress(),
        viewsProgress: freshViewProgress(),
        objectionsProgress: freshObjProgress(),
        serviceChargesProgress: freshScProgress(),
        activeSection: sectionName(v5.activeSection),
        settings: normalizeSettings(v5.settings),
        migrated: true
      };
    }

    // v4 (Buildings + Area + Secondary) → v5 with Market at zero; the v4 save stays untouched + backup copy
    const v4 = readJSON(V4_KEY);
    if (v4 && v4.version === 4) {
      try {
        if (!localStorage.getItem(MIGRATION_BACKUP_V4_KEY)) localStorage.setItem(MIGRATION_BACKUP_V4_KEY, localStorage.getItem(V4_KEY));
      } catch (e) { /* the v4 save itself stays untouched anyway */ }
      return {
        buildings: v4.buildings ? normalize(v4.buildings) : freshProgress(),
        areaFacts: normalizeArea(v4.areaFacts),
        secondaryFacts: normalizeSec(v4.secondaryFacts),
        marketFacts: freshMktProgress(),
        communityFacts: freshComProgress(),
        brokerLingoProgress: freshLingProgress(),
        viewsProgress: freshViewProgress(),
        objectionsProgress: freshObjProgress(),
        serviceChargesProgress: freshScProgress(),
        activeSection: sectionName(v4.activeSection),
        settings: normalizeSettings(v4.settings),
        migrated: true
      };
    }

    const v3 = readJSON(V3_KEY);
    if (v3 && v3.version === 3) {
      try {
        if (!localStorage.getItem(MIGRATION_BACKUP_KEY)) localStorage.setItem(MIGRATION_BACKUP_KEY, localStorage.getItem(V3_KEY));
      } catch (e) { /* the v3 save itself stays untouched anyway */ }
      return {
        buildings: v3.buildings ? normalize(v3.buildings) : freshProgress(),
        areaFacts: normalizeArea(v3.areaFacts),
        secondaryFacts: freshSecProgress(),
        marketFacts: freshMktProgress(),
        communityFacts: freshComProgress(),
        brokerLingoProgress: freshLingProgress(),
        viewsProgress: freshViewProgress(),
        objectionsProgress: freshObjProgress(),
        serviceChargesProgress: freshScProgress(),
        activeSection: sectionName(v3.activeSection),
        settings: normalizeSettings(v3.settings),
        migrated: true
      };
    }

    let buildingsProgress = freshProgress();
    let migrated = false;
    const legacy = readJSON(LEGACY_KEY);
    if (legacy && legacy.version === 2) {
      buildingsProgress = normalize(legacy);
      migrated = true;
    }
    return {
      buildings: buildingsProgress, areaFacts: freshAreaProgress(), secondaryFacts: freshSecProgress(), marketFacts: freshMktProgress(), communityFacts: freshComProgress(), brokerLingoProgress: freshLingProgress(), viewsProgress: freshViewProgress(), objectionsProgress: freshObjProgress(), serviceChargesProgress: freshScProgress(),
      activeSection: "buildings", settings: normalizeSettings(null), migrated
    };
  }

  function storeSnapshot() {
    return { version: 6, buildings: progress, areaFacts: areaProgress, secondaryFacts: secProgress, marketFacts: mktProgress, communityFacts: comProgress, brokerLingoProgress: lingProgress, viewsProgress: viewProgress, objectionsProgress: objProgress, serviceChargesProgress: scProgress, activeSection, settings };
  }

  function saveProgress() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(storeSnapshot())); } catch (e) { /* session only */ }
  }

  function factState(id, field) {
    if (!progress.cards[id]) progress.cards[id] = { facts: {} };
    const card = progress.cards[id];
    if (!card.facts) card.facts = {};
    if (!card.facts[field]) card.facts[field] = normalizeFact({ box: 0, due: 0, seen: false }, false);
    return card.facts[field];
  }

  function scState(id) {
    if (!scProgress.facts[id]) scProgress.facts[id] = normalizeFact({ box: 0, due: 0, seen: false }, false);
    return scProgress.facts[id];
  }

  function objState(id) {
    if (!objProgress.facts[id]) objProgress.facts[id] = normalizeFact({ box: 0, due: 0, seen: false }, false);
    return objProgress.facts[id];
  }

  function viewState(id) {

  function lingState(id) {

  function areaState(id) {
    if (!areaProgress.facts[id]) areaProgress.facts[id] = normalizeFact({ box: 0, due: 0, seen: false }, false);
    return areaProgress.facts[id];
  }

  // =====================================================
  // STATE
  // =====================================================
  const initialStore = loadStore();

  let secProgress = initialStore.secondaryFacts;  // secondary deal progress (separate pool)
